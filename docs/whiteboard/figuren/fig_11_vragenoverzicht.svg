 stroke-width="2" filter="url(#kaartschaduw)"/><rect x="492.0" y="390.0" width="416.0" height="8.0" rx="4" ry="4" fill="#6B4BA8" fill-opacity="1" stroke="none" stroke-width="2"/><text x="518.0" y="466.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="46" fill="#6B4BA8" text-anchor="start" font-weight="bold" letter-spacing="0">4</text><text x="562.0" y="466.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="19" fill="#64748B" text-anchor="start" letter-spacing="0">vragen</text><text x="518.0" y="506.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="22" fill="#0F1B2D" text-anchor="start" font-weight="bold" letter-spacing="0">Simulatie en jaarplan</text><text x="518.0" y="542.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="17" fill="#64748B" text-anchor="start" letter-spacing="0">ICU- en CCU-data, seizoenspatroon,</text><text x="518.0" y="565.5" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="17" fill="#64748B" text-anchor="start" letter-spacing="0">verdeling ICU/CCU</text><rect x="928.0" y="390.0" width="416.0" height="208.0" rx="14" ry="14" fill="#FFFFFF" fill-opacity="1" stroke="#B8C4D0" stroke-width="2" filter="url(#kaartschaduw)"/><rect x="928.0" y="390.0" width="416.0" height="8.0" rx="4" ry="4" fill="#123A63" fill-opacity="1" stroke="none" stroke-width="2"/><text x="954.0" y="466.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="46" fill="#123A63" text-anchor="start" font-weight="bold" letter-spacing="0">3</text><text x="998.0" y="466.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="19" fill="#64748B" text-anchor="start" letter-spacing="0">vragen</text><text x="954.0" y="506.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="22" fill="#0F1B2D" text-anchor="start" font-weight="bold" letter-spacing="0">Direct naar Remco</text><text x="954.0" y="542.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="17" fill="#64748B" text-anchor="start" letter-spacing="0">EHH bij welk team, opvang acute cardio,</text><text x="954.0" y="565.5" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="17" fill="#64748B" text-anchor="start" letter-spacing="0">verblijfsduur SEH</text><rect x="56.0" y="634.0" width="1288.0" height="128.0" rx="14" ry="14" fill="#F3F5F7" fill-opacity="1" stroke="#C4CED8" stroke-width="2" filter="url(#kaartschaduw)"/><text x="84.0" y="678.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="23" fill="#123A63" text-anchor="start" font-weight="bold" letter-spacing="0">Alle vragen worden gescheiden langs twee sporen en vier perioden</text><text x="84.0" y="712.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="19" fill="#0F1B2D" text-anchor="start" letter-spacing="0">Fysiek gaat over wat en waar. De personele inzet volgt daaruit. De perioden zijn: nu en heel 2026, oudbouw 2027, de</text><text x="84.0" y="738.2" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="19" fill="#0F1B2D" text-anchor="start" letter-spacing="0">verhuisperiode, en de nieuwbouw vanaf juni 2027.</text></svg>