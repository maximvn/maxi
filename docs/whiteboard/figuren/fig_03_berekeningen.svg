D" text-anchor="start" letter-spacing="0">Per afdeling in beeld gebracht en</text><text x="938.0" y="526.2" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="19" fill="#0F1B2D" text-anchor="start" letter-spacing="0">gereed voor de doorrekening.</text><text x="938.0" y="566.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="18" fill="#DE8A1B" text-anchor="start" font-weight="bold" letter-spacing="0">De oude begroting loopt sterk</text><text x="938.0" y="590.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="18" fill="#DE8A1B" text-anchor="start" font-weight="bold" letter-spacing="0">uiteen: wat houden we aan?</text><rect x="56.0" y="662.0" width="1288.0" height="76.0" rx="14" ry="14" fill="#FAEFDF" fill-opacity="1" stroke="none" stroke-width="2"/><rect x="56.0" y="662.0" width="8.0" height="76.0" rx="4" ry="4" fill="#DE8A1B" fill-opacity="1" stroke="none" stroke-width="2"/><text x="86.0" y="692.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="16" fill="#DE8A1B" text-anchor="start" font-weight="bold" letter-spacing="1.4">OPENSTAANDE VRAAG</text><text x="86.0" y="720.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="21.0" fill="#0F1B2D" text-anchor="start" font-weight="bold" letter-spacing="0">Wat houden we aan voor de indirecte uren, en verlaagt de regieverpleegkundige die vanaf september?</text><rect x="56.0" y="756.0" width="1288.0" height="76.0" rx="14" ry="14" fill="#F7E3E2" fill-opacity="1" stroke="none" stroke-width="2"/><rect x="56.0" y="756.0" width="8.0" height="76.0" rx="4" ry="4" fill="#C4392D" fill-opacity="1" stroke="none" stroke-width="2"/><text x="86.0" y="786.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="16" fill="#C4392D" text-anchor="start" font-weight="bold" letter-spacing="1.4">BLOKKERENDE VRAAG</text><text x="86.0" y="814.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="15.0" fill="#0F1B2D" text-anchor="start" font-weight=