><text x="1117.0" y="570.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="18" fill="#64748B" text-anchor="middle" letter-spacing="0">aantal plekken, type plek, locatie</text><rect x="912.0" y="638.0" width="410.0" height="130.0" rx="14" ry="14" fill="#FFFFFF" fill-opacity="1" stroke="#B7E1DB" stroke-width="2" filter="url(#kaartschaduw)"/><rect x="912.0" y="638.0" width="410.0" height="6.0" rx="3" ry="3" fill="#0E9A87" fill-opacity="1" stroke="none" stroke-width="2"/><text x="1117.0" y="690.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="22" fill="#0E9A87" text-anchor="middle" font-weight="bold" letter-spacing="0">Personele inzet</text><text x="1117.0" y="720.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="18" fill="#64748B" text-anchor="middle" letter-spacing="0">norm en deskundigheid</text><rect x="56.0" y="864.0" width="1288.0" height="76.0" rx="14" ry="14" fill="#DDF1EE" fill-opacity="1" stroke="none" stroke-width="2"/><rect x="56.0" y="864.0" width="8.0" height="76.0" rx="4" ry="4" fill="#0E9A87" fill-opacity="1" stroke="none" stroke-width="2"/><text x="86.0" y="894.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="16" fill="#0E9A87" text-anchor="start" font-weight="bold" letter-spacing="1.4">AFSPRAAK</text><text x="86.0" y="922.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="21.0" fill="#0F1B2D" text-anchor="start" font-weight="bold" letter-spacing="0">De keuze tussen deze scenario's wordt gemaakt op basis van data uit BIC, niet op basis van aannames.</text></svg>