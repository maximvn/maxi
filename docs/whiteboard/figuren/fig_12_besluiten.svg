<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980"><defs><filter id="kaartschaduw" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0F1B2D" flood-opacity="0.10"/></filter></defs><rect width="1400" height="980" fill="#F4F7FB"/><rect x="0.0" y="0.0" width="1400.0" height="6.0" rx="0" ry="0" fill="#C4392D" fill-opacity="1" stroke="none" stroke-width="2"/><rect x="56.0" y="38.0" width="56.0" height="56.0" rx="16" ry="16" fill="#C4392D" fill-opacity="1" stroke="none" stroke-width="2"/><text x="84.0" y="76.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="27" fill="#FFFFFF" text-anchor="middle" font-weight="bold" letter-spacing="0">12</text><text x="132.0" y="72.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="34" fill="#0F1B2D" text-anchor="start" font-weight="bold" letter-spacing="0">Wat moet er besloten worden</text><text x="132.0" y="104.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="21" fill="#64748B" text-anchor="start" letter-spacing="0">De beslissingen waar de rest van het traject op wacht</text><line x1="56.0" y1="126.0" x2="1344.0" y2="126.0" stroke="#D8E0EA" stroke-width="2" stroke-linecap="round"/><rect x="56.0" y="182.0" width="1288.0" height="96.0" rx="14" ry="14" fill="#FFFFFF" fill-opacity="1" stroke="#EDC4C0" stroke-width="2" filter="url(#kaartschaduw)"/><rect x="56.0" y="182.0" width="8.0" height="96.0" rx="4" ry="4" fill="#C4392D" fill-opacity="1" stroke="none" stroke-width="2"/><circle cx="108.0" cy="230.0" r="24" fill="#C4392D" stroke="none" stroke-width="2"/><text x="108.0" y="238.1" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="23" fill="#FFFFFF" text-anchor="middle" font-weight="bold" letter-spacing="0">1</text><text x="148.0" y="226.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="23" fill="#0F1B2D" text-anchor="start" font-weight="bold" letter-spacing="0">Waar valt de EHH onder: acute poort of Hotfloor?</text><text x="148.0" y="254.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="18" fill="#64748B" text-anchor="start" letter-spacing="0">blokkeert beide analyses en de personele inzet</text><rect x="994.0" y="214.0" width="124.0" height="34.0" rx="17.0" ry="17.0" fill="#F6DFDD" fill-opacity="1" stroke="#C4392D" stroke-width="2"/><text x="1056.0" y="236.2" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="15.0" fill="#C4392D" text-anchor="middle" font-weight="bold" letter-spacing="0">blokkerend</text><text x="1318.0" y="238.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="17" fill="#64748B" text-anchor="end" letter-spacing="0">hoofdstuk 9</text><rect x="56.0" y="292.0" width="1288.0" height="96.0" rx="14" ry="14" fill="#FFFFFF" fill-opacity="1" stroke="#EDC4C0" stroke-width="2" filter="url(#kaartschaduw)"/><rect x="56.0" y="292.0" width="8.0" height="96.0" rx="4" ry="4" fill="#C4392D" fill-opacity="1" stroke="none" stroke-width="2"/><circle cx="108.0" cy="340.0" r="24" fill="#C4392D" stroke="none" stroke-width="2"/><text x="108.0" y="348.1" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="23" fill="#FFFFFF" text-anchor="middle" font-weight="bold" letter-spacing="0">2</text><text x="148.0" y="336.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="23" fill="#0F1B2D" text-anchor="start" font-weight="bold" letter-spacing="0">Hoeveel plekken krijgt de acute poort?</text><text x="148.0" y="364.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="18" fill="#64748B" text-anchor="start" letter-spacing="0">de analyse zegt nu: drie stromen passen niet achter een poort</text><rect x="994.0" y="324.0" width="124.0" height="34.0" rx="17.0" ry="17.0" fill="#F6DFDD" fill-opacity="1" stroke="#C4392D" stroke-width="2"/><text x="1056.0" y="346.2" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="15.0" fill="#C4392D" text-anchor="middle" font-weight="bold" letter-spacing="0">blokkerend</text><text x="1318.0" y="348.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="17" fill="#64748B" text-anchor="end" letter-spacing="0">hoofdstuk 8</text><rect x="56.0" y="402.0" width="1288.0" height="96.0" rx="14" ry="14" fill="#FFFFFF" fill-opacity="1" stroke="#EDC4C0" stroke-width="2" filter="url(#kaartschaduw)"/><rect x="56.0" y="402.0" width="8.0" height="96.0" rx="4" ry="4" fill="#C4392D" fill-opacity="1" stroke="none" stroke-width="2"/><circle cx="108.0" cy="450.0" r="24" fill="#C4392D" stroke="none" stroke-width="2"/><text x="108.0" y="458.1" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="23" fill="#FFFFFF" text-anchor="middle" font-weight="bold" letter-spacing="0">3</text><text x="148.0" y="446.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="23" fill="#0F1B2D" text-anchor="start" font-weight="bold" letter-spacing="0">Wie stelt de norm verpleegkundigen vast?</text><text x="148.0" y="474.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="18" fill="#64748B" text-anchor="start" letter-spacing="0">geen enkele afdeling heeft een vastgestelde norm</text><rect x="994.0" y="434.0" width="124.0" height="34.0" rx="17.0" ry="17.0" fill="#F6DFDD" fill-opacity="1" stroke="#C4392D" stroke-width="2"/><text x="1056.0" y="456.2" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="15.0" fill="#C4392D" text-anchor="middle" font-weight="bold" letter-spacing="0">blokkerend</text><text x="1318.0" y="458.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="17" fill="#64748B" text-anchor="end" letter-spacing="0">hoofdstuk 1 en 3</text><rect x="56.0" y="512.0" width="1288.0" height="96.0" rx="14" ry="14" fill="#FFFFFF" fill-opacity="1" stroke="#F5DCBB" stroke-width="2" filter="url(#kaartschaduw)"/><rect x="56.0" y="512.0" width="8.0" height="96.0" rx="4" ry="4" fill="#DE8A1B" fill-opacity="1" stroke="none" stroke-width="2"/><circle cx="108.0" cy="560.0" r="24" fill="#DE8A1B" stroke="none" stroke-width="2"/><text x="108.0" y="568.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="23" fill="#FFFFFF" text-anchor="middle" font-weight="bold" letter-spacing="0">4</text><text x="148.0" y="556.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="23" fill="#0F1B2D" text-anchor="start" font-weight="bold" letter-spacing="0">Welk scenario kiezen we?</text><text x="148.0" y="584.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="18" fill="#64748B" text-anchor="start" letter-spacing="0">keuze gebeurt op basis van BIC-data; tot die tijd staat het rooster stil</text><rect x="994.0" y="544.0" width="124.0" height="34.0" rx="17.0" ry="17.0" fill="#FAECDB" fill-opacity="1" stroke="#DE8A1B" stroke-width="2"/><text x="1056.0" y="567.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="17" fill="#DE8A1B" text-anchor="middle" font-weight="bold" letter-spacing="0">urgent</text><text x="1318.0" y="568.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="17" fill="#64748B" text-anchor="end" letter-spacing="0">hoofdstuk 6</text><rect x="56.0" y="622.0" width="1288.0" height="96.0" rx="14" ry="14" fill="#FFFFFF" fill-opacity="1" stroke="#F5DCBB" stroke-width="2" filter="url(#kaartschaduw)"/><rect x="56.0" y="622.0" width="8.0" height="96.0" rx="4" ry="4" fill="#DE8A1B" fill-opacity="1" stroke="none" stroke-width="2"/><circle cx="108.0" cy="670.0" r="24" fill="#DE8A1B" stroke="none" stroke-width="2"/><text x="108.0" y="678.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="23" fill="#FFFFFF" text-anchor="middle" font-weight="bold" letter-spacing="0">5</text><text x="148.0" y="666.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="23" fill="#0F1B2D" text-anchor="start" font-weight="bold" letter-spacing="0">Wat is de weigerkans bij 16 bedden?</text><text x="148.0" y="694.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="18" fill="#64748B" text-anchor="start" letter-spacing="0">de Hotfloor past wel, maar het risico is niet becijferd</text><rect x="994.0" y="654.0" width="124.0" height="34.0" rx="17.0" ry="17.0" fill="#FAECDB" fill-opacity="1" stroke="#DE8A1B" stroke-width="2"/><text x="1056.0" y="677.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="17" fill="#DE8A1B" text-anchor="middle" font-weight="bold" letter-spacing="0">urgent</text><text x="1318.0" y="678.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="17" fill="#64748B" text-anchor="end" letter-spacing="0">hoofdstuk 9</text><rect x="56.0" y="732.0" width="1288.0" height="96.0" rx="14" ry="14" fill="#FFFFFF" fill-opacity="1" stroke="#F5DCBB" stroke-width="2" filter="url(#kaartschaduw)"/><rect x="56.0" y="732.0" width="8.0" height="96.0" rx="4" ry="4" fill="#DE8A1B" fill-opacity="1" stroke="none" stroke-width="2"/><circle cx="108.0" cy="780.0" r="24" fill="#DE8A1B" stroke="none" stroke-width="2"/><text x="108.0" y="788.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="23" fill="#FFFFFF" text-anchor="middle" font-weight="bold" letter-spacing="0">6</text><text x="148.0" y="776.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="23" fill="#0F1B2D" text-anchor="start" font-weight="bold" letter-spacing="0">Wat doen we met de gedeelde knelpunten?</text><text x="148.0" y="804.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="18" fill="#64748B" text-anchor="start" letter-spacing="0">de analyses zijn gedeeld, de vervolgacties niet belegd</text><rect x="994.0" y="764.0" width="124.0" height="34.0" rx="17.0" ry="17.0" fill="#FAECDB" fill-opacity="1" stroke="#DE8A1B" stroke-width="2"/><text x="1056.0" y="787.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="17" fill="#DE8A1B" text-anchor="middle" font-weight="bold" letter-spacing="0">urgent</text><text x="1318.0" y="788.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="17" fill="#64748B" text-anchor="end" letter-spacing="0">hoofdstuk 8 en 11</text><rect x="56.0" y="848.0" width="1288.0" height="96.0" rx="14" ry="14" fill="#F3F5F7" fill-opacity="1" stroke="#C4CED8" stroke-width="2" filter="url(#kaartschaduw)"/><text x="84.0" y="892.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="22" fill="#123A63" text-anchor="start" font-weight="bold" letter-spacing="0">Zolang de eerste drie besluiten openstaan, kan de personele inzet niet onderbouwd worden.</text><text x="84.0" y="922.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="19" fill="#64748B" text-anchor="start" letter-spacing="0">Fysiek eerst: wat en waar. De personele inzet volgt daaruit.</text></svg>