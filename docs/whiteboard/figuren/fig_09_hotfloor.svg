<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980"><defs><filter id="kaartschaduw" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0F1B2D" flood-opacity="0.10"/></filter><marker id="pijl-DE8A1B" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M 0 0.6 L 9.4 5 L 0 9.4 z" fill="#DE8A1B"/></marker></defs><rect width="1400" height="980" fill="#F4F7FB"/><rect x="0.0" y="0.0" width="1400.0" height="6.0" rx="0" ry="0" fill="#0E9A87" fill-opacity="1" stroke="none" stroke-width="2"/><rect x="56.0" y="38.0" width="56.0" height="56.0" rx="16" ry="16" fill="#0E9A87" fill-opacity="1" stroke="none" stroke-width="2"/><text x="84.0" y="76.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="27" fill="#FFFFFF" text-anchor="middle" font-weight="bold" letter-spacing="0">9</text><text x="132.0" y="72.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="34" fill="#0F1B2D" text-anchor="start" font-weight="bold" letter-spacing="0">Analyse 2: de Hotfloor, en de EHH-vraag</text><text x="132.0" y="104.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="21" fill="#64748B" text-anchor="start" letter-spacing="0">ICU, CCU en SCU samen op een vloer</text><line x1="56.0" y1="126.0" x2="1344.0" y2="126.0" stroke="#D8E0EA" stroke-width="2" stroke-linecap="round"/><rect x="56.0" y="162.0" width="1288.0" height="62.0" rx="14" ry="14" fill="#0E9A87" fill-opacity="1" stroke="none" stroke-width="2"/><text x="700.0" y="202.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="21" fill="#FFFFFF" text-anchor="middle" font-weight="bold" letter-spacing="1.6">WIJZIGING 2   -   ICU / CCU / SCU SAMEN</text><rect x="56.0" y="248.0" width="700.0" height="118.0" rx="14" ry="14" fill="#E7F5F3" fill-opacity="1" stroke="#0E9A87" stroke-width="3" filter="url(#kaartschaduw)"/><text x="406.0" y="304.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="32" fill="#0E9A87" text-anchor="middle" font-weight="bold" letter-spacing="0">16 BEDDEN PAST WEL</text><text x="406.0" y="338.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="20" fill="#0F1B2D" text-anchor="middle" letter-spacing="0">ICU samen met CCU en SCU op de Hotfloor</text><path d="M 406.0 372.0 L 406.0 398.0" fill="none" stroke="#DE8A1B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#pijl-DE8A1B)"/><rect x="56.0" y="404.0" width="700.0" height="84.0" rx="14" ry="14" fill="#FCF6ED" fill-opacity="1" stroke="#F4DAB6" stroke-width="2" filter="url(#kaartschaduw)"/><rect x="56.0" y="404.0" width="8.0" height="84.0" rx="4" ry="4" fill="#DE8A1B" fill-opacity="1" stroke="none" stroke-width="2"/><text x="84.0" y="442.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="22" fill="#0F1B2D" text-anchor="start" font-weight="bold" letter-spacing="0">Wat is de weigerkans?</text><text x="84.0" y="470.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="18" fill="#64748B" text-anchor="start" letter-spacing="0">nog niet bekend</text><rect x="56.0" y="500.0" width="700.0" height="84.0" rx="14" ry="14" fill="#FCF6ED" fill-opacity="1" stroke="#F4DAB6" stroke-width="2" filter="url(#kaartschaduw)"/><rect x="56.0" y="500.0" width="8.0" height="84.0" rx="4" ry="4" fill="#DE8A1B" fill-opacity="1" stroke="none" stroke-width="2"/><text x="84.0" y="538.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="22" fill="#0F1B2D" text-anchor="start" font-weight="bold" letter-spacing="0">Komt de EHH er apart bij?</text><text x="84.0" y="566.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="18" fill="#64748B" text-anchor="start" letter-spacing="0">of toch mee bij de acute poort en de SEH?</text><rect x="780.0" y="248.0" width="564.0" height="356.0" rx="14" ry="14" fill="#F6F4FA" fill-opacity="1" stroke="#D3C9E5" stroke-width="2" filter="url(#kaartschaduw)"/><text x="1062.0" y="300.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="23" fill="#6B4BA8" text-anchor="middle" font-weight="bold" letter-spacing="0">De twee wijzigingen naast elkaar</text><rect x="800.0" y="324.0" width="524.0" height="112.0" rx="14" ry="14" fill="#FFFFFF" fill-opacity="1" stroke="#BCD4E8" stroke-width="2" filter="url(#kaartschaduw)"/><circle cx="842.0" cy="368.0" r="22" fill="#1F6FB2" stroke="none" stroke-width="2"/><text x="842.0" y="375.7" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="22" fill="#FFFFFF" text-anchor="middle" font-weight="bold" letter-spacing="0">1</text><text x="878.0" y="366.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="22" fill="#1F6FB2" text-anchor="start" font-weight="bold" letter-spacing="0">Acute poort</text><text x="878.0" y="392.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="17" fill="#64748B" text-anchor="start" letter-spacing="0">3 stromen naar 1 poort</text><rect x="878.0" y="402.0" width="119.0" height="26.0" rx="13.0" ry="13.0" fill="#F6DFDD" fill-opacity="1" stroke="#C4392D" stroke-width="2"/><text x="937.5" y="420.9" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="17" fill="#C4392D" text-anchor="middle" font-weight="bold" letter-spacing="0">past niet</text><rect x="800.0" y="454.0" width="524.0" height="112.0" rx="14" ry="14" fill="#FFFFFF" fill-opacity="1" stroke="#B7E1DB" stroke-width="2" filter="url(#kaartschaduw)"/><circle cx="842.0" cy="498.0" r="22" fill="#0E9A87" stroke="none" stroke-width="2"/><text x="842.0" y="505.7" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="22" fill="#FFFFFF" text-anchor="middle" font-weight="bold" letter-spacing="0">2</text><text x="878.0" y="496.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="22" fill="#0E9A87" text-anchor="start" font-weight="bold" letter-spacing="0">Hotfloor</text><text x="878.0" y="522.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="17" fill="#64748B" text-anchor="start" letter-spacing="0">ICU / CCU / SCU samen</text><rect x="878.0" y="532.0" width="115.0" height="26.0" rx="13.0" ry="13.0" fill="#D8EFEC" fill-opacity="1" stroke="#0E9A87" stroke-width="2"/><text x="935.5" y="551.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="17" fill="#0E9A87" text-anchor="middle" font-weight="bold" letter-spacing="0">past wel</text><text x="1062.0" y="586.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="17" fill="#64748B" text-anchor="middle" font-style="italic" letter-spacing="0">beide zijn apart geanalyseerd</text><rect x="56.0" y="634.0" width="1288.0" height="300.0" rx="14" ry="14" fill="#FCF6ED" fill-opacity="1" stroke="#F4DAB6" stroke-width="2" filter="url(#kaartschaduw)"/><text x="700.0" y="690.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="30" fill="#DE8A1B" text-anchor="middle" font-weight="bold" letter-spacing="0">Waar valt de EHH onder: bij 1 of bij 2?</text><text x="700.0" y="722.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="20" fill="#64748B" text-anchor="middle" letter-spacing="0">Zolang dit niet vastligt, staan beide analyses stil</text><path d="M 388.0 740.0 L 388.0 766.0" fill="none" stroke="#DE8A1B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#pijl-DE8A1B)"/><rect x="86.0" y="770.0" width="604.0" height="128.0" rx="14" ry="14" fill="#FFFFFF" fill-opacity="1" stroke="#F2D0A4" stroke-width="2" filter="url(#kaartschaduw)"/><text x="388.0" y="810.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="22" fill="#DE8A1B" text-anchor="middle" font-weight="bold" letter-spacing="0">Analyse plus knelpunten</text><text x="110.0" y="842.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="18" fill="#0F1B2D" text-anchor="start" letter-spacing="0">De analyses zijn gedeeld. Wat doen we met de knelpunten,</text><text x="110.0" y="866.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="18" fill="#0F1B2D" text-anchor="start" letter-spacing="0">en welke acties volgen daaruit?</text><path d="M 1012.0 740.0 L 1012.0 766.0" fill="none" stroke="#DE8A1B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#pijl-DE8A1B)"/><rect x="710.0" y="770.0" width="604.0" height="128.0" rx="14" ry="14" fill="#FFFFFF" fill-opacity="1" stroke="#F2D0A4" stroke-width="2" filter="url(#kaartschaduw)"/><text x="1012.0" y="810.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="22" fill="#DE8A1B" text-anchor="middle" font-weight="bold" letter-spacing="0">Of past het?</text><text x="734.0" y="842.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="18" fill="#0F1B2D" text-anchor="start" letter-spacing="0">Of concluderen we dat het past en gaan we er zo mee aan</text><text x="734.0" y="866.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="18" fill="#0F1B2D" text-anchor="start" letter-spacing="0">de slag?</text></svg>