<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Acuut Capaciteitsdashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: klinische regiekamer — vaste app-balk met stappen, daaronder
   locatie-tabs (zoals het Slingeland-dashboard), weergave-tabs, één
   filterstrook, en een raster van panelen. Rustig koel-grijs, marineblauw
   als accent; kleur in grafieken is uitsluitend data. */
:root {
  --bg: #f3f5f8;
  --surface: #ffffff;
  --surface-2: #f7f8fb;
  --ink: #0f1a2b;
  --ink-2: #47536a;
  --muted: #7d8799;
  --line: #e1e5ec;
  --line-strong: #c9d0dc;
  --accent: #133f8c;
  --accent-ink: #ffffff;
  --accent-soft: #e7eefa;
  --focus: #2a78d6;
  --grid: #e8ebf0;
  --axis: #c3c9d4;
  --good: #0a8a0a; --good-soft: #e5f4e5;
  --warn: #b77a00; --warn-soft: #fdf3dc;
  --crit: #c93535; --crit-soft: #fbe7e7;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #4a3aa7; --s8: #e34948;
  --div-pos: #d03b3b; --div-neg: #2a78d6;
  --seq-0: #f1f6fd; --seq-1: #cde2fb; --seq-2: #9ec5f4; --seq-3: #6da7ec; --seq-4: #3987e5; --seq-5: #256abf; --seq-6: #184f95; --seq-7: #0d366b;
  --heat-0: #fdf1ea; --heat-1: #fbd9c6; --heat-2: #f6b292; --heat-3: #ee8a5d; --heat-4: #d9622f; --heat-5: #a8441b;
  --shadow: 0 1px 2px rgba(15, 26, 43, .05), 0 4px 16px rgba(15, 26, 43, .04);
  --font-ui: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-display: 'IBM Plex Sans Condensed', 'IBM Plex Sans', system-ui, sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  --r: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1118; --surface: #141a23; --surface-2: #19202b; --ink: #edf1f7; --ink-2: #b4bdcc; --muted: #8590a3;
    --line: #262f3c; --line-strong: #364152; --accent: #7fa8ee; --accent-ink: #0c1118; --accent-soft: #1b2a44; --focus: #7fa8ee;
    --grid: #222a36; --axis: #3a4555;
    --good: #2bb52b; --good-soft: #13281a; --warn: #e3a51c; --warn-soft: #2d2410; --crit: #ec6a6a; --crit-soft: #351919;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
    --div-pos: #e66767; --div-neg: #3987e5;
    --seq-0: #16202d; --seq-1: #13294a; --seq-2: #173a68; --seq-3: #1c5cab; --seq-4: #2a78d6; --seq-5: #5598e7; --seq-6: #86b6ef; --seq-7: #cde2fb;
    --heat-0: #241a16; --heat-1: #4a2616; --heat-2: #7a3518; --heat-3: #b34a1d; --heat-4: #e06a33; --heat-5: #f6a27a;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c1118; --surface: #141a23; --surface-2: #19202b; --ink: #edf1f7; --ink-2: #b4bdcc; --muted: #8590a3;
  --line: #262f3c; --line-strong: #364152; --accent: #7fa8ee; --accent-ink: #0c1118; --accent-soft: #1b2a44; --focus: #7fa8ee;
  --grid: #222a36; --axis: #3a4555;
  --good: #2bb52b; --good-soft: #13281a; --warn: #e3a51c; --warn-soft: #2d2410; --crit: #ec6a6a; --crit-soft: #351919;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
  --div-pos: #e66767; --div-neg: #3987e5;
  --seq-0: #16202d; --seq-1: #13294a; --seq-2: #173a68; --seq-3: #1c5cab; --seq-4: #2a78d6; --seq-5: #5598e7; --seq-6: #86b6ef; --seq-7: #cde2fb;
  --heat-0: #241a16; --heat-1: #4a2616; --heat-2: #7a3518; --heat-3: #b34a1d; --heat-4: #e06a33; --heat-5: #f6a27a;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4); color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 14px/1.5 var(--font-ui); -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
.num, td.num, .mono { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--font-mono); }
[hidden] { display: none !important; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }

/* ── App-balk ─────────────────────────────────────────────── */
.appbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30;
  display: flex; align-items: center; gap: 24px; flex-wrap: wrap;
  padding: 10px clamp(16px, 3vw, 32px); background: var(--surface); border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand-mark { width: 28px; height: 28px; border-radius: 6px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; flex: none; }
.brand-mark svg { width: 16px; height: 16px; }
.brand-text { line-height: 1.15; }
.brand-eyebrow { font-size: 11px; color: var(--muted); letter-spacing: .04em; }
.brand-title { font-weight: 600; font-size: 15px; }
.stepper { display: flex; align-items: center; gap: 4px; margin-left: auto; flex-wrap: wrap; }
.step { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 999px; border: 0; background: none; color: var(--muted); font-size: 13px; }
.step .dot { width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid var(--line-strong); display: grid; place-items: center; font-size: 11px; font-weight: 600; }
.step.done { color: var(--ink-2); }
.step.done .dot { background: var(--accent-soft); border-color: transparent; color: var(--accent); }
.step.active { color: var(--ink); font-weight: 600; background: var(--accent-soft); }
.step.active .dot { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.step:disabled { cursor: default; opacity: .6; }
.step-sep { width: 16px; height: 1px; background: var(--line-strong); }
.appbar-actions { display: flex; gap: 8px; align-items: center; }
.icon-btn { width: 32px; height: 32px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; color: var(--ink-2); }
.icon-btn:hover { border-color: var(--line-strong); color: var(--ink); }
.icon-btn svg { width: 16px; height: 16px; }

.wrap { max-width: 1480px; margin: 0 auto; padding-inline: clamp(16px, 3vw, 32px); padding-block: 24px 64px; }

/* ── Startscherm ──────────────────────────────────────────── */
.start { display: grid; gap: 28px; padding-top: 3vh; }
.start-head { max-width: 680px; }
.eyebrow { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
.start-head h1 { font: 600 clamp(28px, 4vw, 40px)/1.1 var(--font-display); letter-spacing: -.01em; margin-top: 6px; }
.start-head p { color: var(--ink-2); font-size: 15px; margin: 10px 0 0; max-width: 62ch; }
.mode-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
.mode-card {
  text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 22px;
  display: grid; gap: 14px; transition: border-color .15s, box-shadow .15s, transform .15s; box-shadow: var(--shadow);
}
.mode-card:hover { border-color: var(--accent); transform: translateY(-1px); }
.mode-card h2 { font: 600 24px/1.15 var(--font-display); }
.mode-card p { margin: 0; color: var(--ink-2); max-width: 52ch; }
.mode-units { display: flex; flex-wrap: wrap; gap: 8px; }
.unit-pill { border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; background: var(--surface-2); min-width: 0; }
.unit-pill b { display: block; font-size: 13px; }
.unit-pill span { display: block; font-size: 11.5px; color: var(--muted); }
.mode-go { font-weight: 600; color: var(--accent); display: flex; align-items: center; gap: 6px; }
.start-steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; color: var(--ink-2); font-size: 13px; }
.start-steps div { border-top: 2px solid var(--line-strong); padding-top: 10px; }
.start-steps b { display: block; color: var(--ink); font-size: 13.5px; margin-bottom: 2px; }

/* ── Data inladen ─────────────────────────────────────────── */
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
.page-head h1 { font: 600 28px/1.15 var(--font-display); margin-top: 4px; }
.page-head p { margin: 6px 0 0; color: var(--ink-2); max-width: 70ch; }
.btn { display: inline-flex; align-items: center; gap: 8px; border-radius: var(--r); padding: 8px 14px; border: 1px solid var(--line-strong); background: var(--surface); font-weight: 500; font-size: 13.5px; white-space: nowrap; }
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); color: var(--accent-ink); }
.btn:disabled { opacity: .45; cursor: not-allowed; filter: none; }
.btn svg { width: 15px; height: 15px; }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
.dropzone {
  border: 1.5px dashed var(--line-strong); border-radius: 10px; background: var(--surface); padding: 22px;
  display: flex; align-items: center; gap: 18px; flex-wrap: wrap; transition: border-color .15s, background .15s;
}
.dropzone.over { border-color: var(--accent); background: var(--accent-soft); }
.dropzone .dz-icon { width: 44px; height: 44px; border-radius: 10px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; flex: none; }
.dropzone .dz-icon svg { width: 22px; height: 22px; }
.dropzone .dz-text { flex: 1 1 260px; min-width: 0; }
.dropzone b { font-size: 15px; }
.dropzone p { margin: 2px 0 0; color: var(--ink-2); font-size: 13px; }
.load-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; margin-top: 18px; }
.load-unit { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.load-unit-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; padding: 14px 16px 10px; border-bottom: 1px solid var(--line); }
.load-unit-head h3 { font-size: 15px; }
.load-unit-head span { font-size: 12px; color: var(--muted); }
.slot { display: grid; grid-template-columns: 10px 1fr auto; align-items: center; gap: 10px; padding: 11px 16px; border-bottom: 1px solid var(--line); }
.slot:last-child { border-bottom: 0; }
.slot .sw { width: 10px; height: 10px; border-radius: 3px; }
.slot-name { font-weight: 500; font-size: 13.5px; }
.slot-meta { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.slot-meta.ok { color: var(--ink-2); }
.slot-body { min-width: 0; }
.slot-actions { display: flex; gap: 6px; align-items: center; }
.tag { font-size: 11px; font-weight: 500; padding: 2px 7px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); color: var(--ink-2); white-space: nowrap; }
.tag.ok { background: var(--good-soft); color: var(--good); border-color: transparent; }
.tag.demo { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.link-btn { border: 0; background: none; color: var(--accent); font-size: 12.5px; font-weight: 500; padding: 4px 6px; border-radius: 4px; }
.link-btn:hover { background: var(--accent-soft); }
.link-btn.danger { color: var(--muted); }
.link-btn.danger:hover { color: var(--crit); background: var(--crit-soft); }
.load-foot { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; margin-top: 20px; padding: 16px 18px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.load-foot p { margin: 0; color: var(--ink-2); }
.unmatched { margin-top: 14px; background: var(--warn-soft); border-radius: 8px; padding: 12px 14px; display: grid; gap: 8px; font-size: 13px; }
.unmatched-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.unmatched-row code { font-family: var(--font-mono); font-size: 12px; overflow-wrap: anywhere; }
select, input[type="number"], input[type="time"] { background: var(--surface); border: 1px solid var(--line-strong); border-radius: 5px; padding: 5px 8px; font-size: 13px; }
.toast { position: fixed; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--surface); padding: 10px 16px; border-radius: 8px; font-size: 13px; z-index: 60; box-shadow: var(--shadow); max-width: calc(100% - 32px); }

/* ── Dashboard ────────────────────────────────────────────── */
.dash-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 14px; }
.dash-head h1 { font: 600 26px/1.15 var(--font-display); }
.dash-head .sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
.loc-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.loc-label { font-weight: 600; font-size: 13px; }
.seg { display: inline-flex; background: var(--surface-2); border: 1px solid var(--line); border-radius: 7px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: none; padding: 6px 14px; border-radius: 5px; font-weight: 500; font-size: 13.5px; color: var(--ink-2); display: flex; align-items: center; gap: 6px; }
.seg button:hover { color: var(--ink); background: var(--surface); }
.seg button.on { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: 0 0 0 1px var(--line-strong), 0 1px 2px rgba(0,0,0,.06); }
.seg button .cnt { font-size: 11px; color: var(--muted); font-weight: 500; }
.seg button.empty { opacity: .55; }
.seg.small button { padding: 4px 10px; font-size: 12.5px; }

.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin: 16px 0 0; overflow-x: auto; scrollbar-width: none; }
.tabs button { border: 0; background: none; padding: 10px 14px; font-weight: 500; color: var(--ink-2); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; font-size: 14px; }
.tabs button:hover { color: var(--ink); }
.tabs button.on { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }

.filters {
  position: sticky; top: calc(53px + env(safe-area-inset-top, 0px)); z-index: 20;
  display: flex; gap: 10px 22px; align-items: center; flex-wrap: wrap;
  padding: 10px 0; background: var(--bg); border-bottom: 1px solid var(--line); margin-bottom: 18px;
}
.f-group { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-width: 0; }
.f-label { font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; font-weight: 500; }
.chip {
  display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line-strong); background: var(--surface);
  border-radius: 999px; padding: 4px 11px 4px 9px; font-size: 13px; font-weight: 500; color: var(--ink);
}
.chip .sw { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.chip.off { color: var(--muted); background: transparent; border-style: dashed; }
.chip.off .sw { opacity: .3; }
.chip:disabled { cursor: not-allowed; opacity: .5; }

.grid { display: grid; gap: 16px; }
.g-2 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 460px), 1fr)); }
.g-3-1 { grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); }
@media (max-width: 1000px) { .g-3-1 { grid-template-columns: minmax(0, 1fr); } }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; min-width: 0; }
.panel-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
.panel-head h2 { font-size: 15px; font-weight: 600; }
.panel-head .desc { font-size: 12.5px; color: var(--muted); margin-top: 2px; max-width: 70ch; }
.chart-box { position: relative; height: 300px; }
.chart-box.tall { height: 360px; }
.chart-box.short { height: 220px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12.5px; color: var(--ink-2); margin-top: 10px; align-items: center; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend .sw { width: 10px; height: 10px; border-radius: 3px; }
.legend .ln { width: 16px; height: 0; border-top: 2px dashed var(--ink); }
.legend .ln.solid { border-top-style: solid; }
.legend .wh { width: 10px; height: 12px; border: solid var(--ink-2); border-width: 1.5px 0; position: relative; }
.legend .wh::after { content: ''; position: absolute; left: 4px; top: 0; bottom: 0; border-left: 1.5px solid var(--ink-2); }
.legend .sep { width: 1px; height: 14px; background: var(--line-strong); }
.legend .key b { color: var(--ink); font-weight: 600; }

/* KPI-tegels */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 16px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: grid; gap: 4px; align-content: start; }
.kpi-label { font-size: 12px; color: var(--ink-2); font-weight: 500; }
.kpi-val { font: 600 28px/1.1 var(--font-display); letter-spacing: -.01em; }
.kpi-val small { font: 500 13px var(--font-ui); color: var(--muted); margin-left: 3px; letter-spacing: 0; }
.kpi-sub { font-size: 12px; color: var(--muted); }
.status { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; width: fit-content; }
.status svg { width: 12px; height: 12px; }
.status.good { background: var(--good-soft); color: var(--good); }
.status.warn { background: var(--warn-soft); color: var(--warn); }
.status.crit { background: var(--crit-soft); color: var(--crit); }

/* Tabellen */
.table-wrap { overflow-x: auto; margin: 0 -2px; }
table.data { width: 100%; border-collapse: collapse; font-size: 13px; }
table.data th { text-align: left; font-weight: 500; font-size: 12px; color: var(--muted); padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.data td { padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
table.data tr:last-child td { border-bottom: 0; }
table.data th.num, table.data td.num { text-align: right; }
table.data tr.sub td { color: var(--ink-2); }
table.data tr.total td { font-weight: 600; border-top: 1px solid var(--line-strong); }
table.data tbody tr:hover td { background: var(--surface-2); }
.cell-name { display: flex; align-items: center; gap: 8px; font-weight: 500; white-space: nowrap; }
.cell-name .sw { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.diff { display: inline-block; min-width: 34px; text-align: center; font-weight: 600; font-size: 12px; padding: 2px 6px; border-radius: 4px; }
.diff.pos { background: var(--crit-soft); color: var(--crit); }
.diff.neg { background: var(--accent-soft); color: var(--accent); }
.diff.zero { background: var(--good-soft); color: var(--good); }
.stepper-input { display: inline-flex; align-items: center; border: 1px solid var(--line-strong); border-radius: 5px; overflow: hidden; background: var(--surface); }
.stepper-input button { border: 0; background: var(--surface-2); width: 24px; height: 28px; color: var(--ink-2); font-weight: 600; }
.stepper-input button:hover { color: var(--accent); }
.stepper-input input { width: 44px; border: 0; text-align: center; padding: 4px 0; font-variant-numeric: tabular-nums; -moz-appearance: textfield; background: transparent; }
.stepper-input input::-webkit-inner-spin-button { -webkit-appearance: none; }

/* Stroomkaarten */
.stream-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: 12px; margin-bottom: 16px; }
.s-card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px 10px; text-align: left; display: grid; gap: 8px; transition: border-color .15s, box-shadow .15s; }
.s-card:hover { border-color: var(--line-strong); }

const WD_LONG = ['Maandag', 'Dinsdag', 'Woensdag', 'Donderdag', 'Vrijdag', 'Zaterdag', 'Zondag'];

/* ════════════════════════════════════════════════════════════════════
   DATA — inlezen van de Excel-bestanden, voorbeelddata, en de
   rekenkern (dagframes, diensten, statistiek).
   ════════════════════════════════════════════════════════════════════ */

// streamId -> { fileName, source: 'bestand'|'voorbeeld'|'synthetisch', days: Map(date -> Float32Array(96)) }
const STORE = {};

/* ── Hulpfuncties datum ─────────────────────────────────────────────── */
const pad2 = n => String(n).padStart(2, '0');
const ymd = (y, m, d) => `${y}-${pad2(m)}-${pad2(d)}`;
function dateParts(ds) { return { y: +ds.slice(0, 4), m: +ds.slice(5, 7), d: +ds.slice(8, 10) }; }
function utcDate(ds) { const p = dateParts(ds); return new Date(Date.UTC(p.y, p.m - 1, p.d)); }
function addDays(ds, n) { const d = utcDate(ds); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
function weekdayOf(ds) { return (utcDate(ds).getUTCDay() + 6) % 7; } // 0 = maandag
function isoWeek(ds) {
  const d = utcDate(ds); const day = (d.getUTCDay() + 6) % 7;
  d.setUTCDate(d.getUTCDate() - day + 3);
  const isoYear = d.getUTCFullYear();
  const jan4 = new Date(Date.UTC(isoYear, 0, 4));
  const week = 1 + Math.round(((d - jan4) / 86400000 - 3 + ((jan4.getUTCDay() + 6) % 7)) / 7);
  return { isoYear, week };
}
function isoWeekMonday(isoYear, week) {
  const jan4 = new Date(Date.UTC(isoYear, 0, 4));
  const mon = new Date(jan4); mon.setUTCDate(jan4.getUTCDate() - ((jan4.getUTCDay() + 6) % 7) + (week - 1) * 7);
  return mon.toISOString().slice(0, 10);
}
function fmtDay(ds) { const p = dateParts(ds); return `${WD_SHORT[weekdayOf(ds)]} ${p.d} ${MONTH_SHORT[p.m - 1]}`; }
const slotLabel = q => `${pad2(Math.floor(q / 4))}:${pad2((q % 4) * 15)}`;

/* ── Excel inlezen ──────────────────────────────────────────────────── */
// Herkent een kwartierkolom in de kop: Excel-tijd (0..1), "H:MM(:SS)" of een Date.
function headerToSlot(h) {
  let mins = null;
  if (typeof h === 'number' && h >= 0 && h < 1) mins = Math.round(h * 1440);
  else if (h instanceof Date) mins = h.getUTCHours() * 60 + h.getUTCMinutes();
  else if (typeof h === 'string') {
    const m = h.trim().match(/^(\d{1,2}):(\d{2})(?::\d{2})?$/);
    if (m) mins = +m[1] * 60 + +m[2];
  }
  if (mins == null || mins % 15 !== 0 || mins >= 1440) return null;
  return mins / 15;
}
// Datumcel → 'YYYY-MM-DD'. Excel-serienummer, Date, ISO, D-M-YYYY of M/D/YYYY.
function cellToDate(v) {
  if (v == null || v === '') return null;
  if (typeof v === 'number') {
    const p = XLSX.SSF.parse_date_code(v);
    return p && p.y > 1900 ? ymd(p.y, p.m, p.d) : null;
  }
  if (v instanceof Date) return isNaN(v) ? null : ymd(v.getFullYear(), v.getMonth() + 1, v.getDate());
  const s = String(v).trim();
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (m) return ymd(+m[1], +m[2], +m[3]);
  m = s.match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{2,4})/);
  if (m) {
    let a = +m[1], b = +m[2], y = +m[3]; if (y < 100) y += 2000;
    // Met "/" is de Excel-export Amerikaans (M/D); met "-" of "." Nederlands (D-M).
    const usa = s.includes('/') && a <= 12;
    const [mo, d] = usa ? [a, b] : [b, a];
    return ymd(y, mo, d);
  }
  return null;
}
const toNum = v => {
  if (v == null || v === '') return NaN;
  return typeof v === 'number' ? v : parseFloat(String(v).replace(',', '.'));
};

function parseWorkbook(buf, fileName) {
  const wb = XLSX.read(buf, { type: 'array', cellDates: false });
  const candidates = [
    ...wb.SheetNames.filter(n => /brongegevens/i.test(n)),
    ...wb.SheetNames.filter(n => /bron|blad|sheet/i.test(n)),
    ...wb.SheetNames,
  ];
  for (const name of [...new Set(candidates)]) {
    const grid = XLSX.utils.sheet_to_json(wb.Sheets[name], { header: 1, raw: true, defval: null });
    const res = parseGrid(grid);
    if (res) return { ...res, sheet: name, fileName };
  }
  throw new Error('Geen blad gevonden met een kolom "Datum" en kwartierkolommen (00:00 … 23:45).');
}

function parseGrid(grid) {
  let hr = -1;
  for (let r = 0; r < Math.min(grid.length, 40); r++) {
    const row = grid[r] || [];
    if (row.some(c => typeof c === 'string' && c.trim().toLowerCase() === 'datum')) { hr = r; break; }
  }
  if (hr < 0) return null;
  const hdr = grid[hr];
  const iDate = hdr.findIndex(c => typeof c === 'string' && c.trim().toLowerCase() === 'datum');
  const slotCols = [];
  hdr.forEach((h, i) => {
    if (i === iDate) return;
    const q = headerToSlot(h);
    if (q != null && !slotCols.some(s => s.q === q)) slotCols.push({ i, q });
  });
  if (slotCols.length < 24) return null;
  const days = new Map();
  for (let r = hr + 1; r < grid.length; r++) {
    const row = grid[r]; if (!row) continue;
    const ds = cellToDate(row[iDate]); if (!ds) continue;
    const arr = new Float32Array(96).fill(NaN);
    let any = false;
    for (const { i, q } of slotCols) { const v = toNum(row[i]); if (!isNaN(v)) { arr[q] = v; any = true; } }
    if (!any) continue;
    // Ontbrekende kwartieren (bv. bestand met uurkolommen) opvullen met de vorige waarde.
    for (let q = 0; q < 96; q++) if (isNaN(arr[q])) arr[q] = q > 0 ? arr[q - 1] : 0;
    days.set(ds, arr);
  }
  if (!days.size) return null;
  return { days };
}

function guessStream(fileName) {
  const n = fileName.toLowerCase().replace(/[\s-]+/g, '_');
  return STREAM_ORDER.find(id => STREAMS[id].match(n)) || null;
}

function putStream(id, days, fileName, source) {
  const sorted = new Map([...days.entries()].sort((a, b) => (a[0] < b[0] ? -1 : 1)));
  STORE[id] = { fileName, source, days: sorted };
  invalidateFrames();
}
function streamSummary(id) {
  const st = STORE[id]; if (!st) return null;
  const keys = [...st.days.keys()];
  return { n: keys.length, from: keys[0], to: keys[keys.length - 1] };
}

/* ── Synthetische voorbeelddata (zelfde vorm als de echte bestanden) ── */
function mulberry32(a) {
  return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
function poisson(lambda, rnd) {
  if (lambda <= 0) return 0;
  if (lambda > 30) return Math.max(0, Math.round(lambda + Math.sqrt(lambda) * gauss(rnd)));
  const L = Math.exp(-lambda); let k = 0, p = 1;
  do { k++; p *= rnd(); } while (p > L);
  return k - 1;
}
function gauss(rnd) { return Math.sqrt(-2 * Math.log(rnd() + 1e-12)) * Math.cos(2 * Math.PI * rnd()); }

function generateStream(id, fromYear = 2022, toYear = 2025) {
  const p = STREAMS[id].demo;
  const rnd = mulberry32(STREAM_ORDER.indexOf(id) * 7919 + 17);
  const days = new Map();
  let level = p.base; // langzaam bewegend dagniveau → realistische autocorrelatie
  for (let ds = `${fromYear}-01-01`; ds <= `${toYear}-12-31`; ds = addDays(ds, 1)) {
    const { y, m } = dateParts(ds);
    const wd = weekdayOf(ds);
    const season = 1 + p.season * Math.cos(((m - 1.5) / 12) * 2 * Math.PI);
    const trend = 1 + p.trend * (y - fromYear);
    level = 0.8 * level + 0.2 * p.base * (0.75 + 0.5 * rnd());
    const arr = new Float32Array(96);
    let cur = poisson(level * p.wkd[wd] * season * trend, rnd);
    for (let q = 0; q < 96; q++) {
      const h = q / 4;
      const diurnal = 1 + p.amp * Math.exp(-((h - p.peak) ** 2) / 18) - 0.25 * p.amp * Math.exp(-((h - 4) ** 2) / 10);
      const target = Math.max(0, level * p.wkd[wd] * season * trend * diurnal / (1 + p.amp * 0.35));
      // geboorte-sterfte stap: bezetting verandert kwartier op kwartier geleidelijk
      if (rnd() < 0.18) cur += (target > cur ? 1 : target < cur ? -1 : 0) + (rnd() < 0.08 ? (rnd() < 0.5 ? 1 : -1) : 0);
      cur = Math.max(0, Math.min(p.max, cur));
      arr[q] = cur;
    }
    days.set(ds, arr);
  }
  return days;
}

/* ── Frames: bezetting per dag voor een set componenten ─────────────── */
// Een component is één reeks in de grafieken: in een afdelingstab is dat een
// stroom, op het tabblad "Alle" is het een hele afdeling (som van stromen).
let FRAME_CACHE = new Map();

function buildFrame(comps, filter) {
  const key = JSON.stringify([comps.map(c => c.id + ':' + c.streams.join('+')), filter]);
  if (FRAME_CACHE.has(key)) return FRAME_CACHE.get(key);
  const streamIds = [...new Set(comps.flatMap(c => c.streams))].filter(id => STORE[id]);
  if (!streamIds.length) return null;
  // Alleen datums waarop alle gekozen stromen data hebben (anders tel je te laag).
  let dates = [...STORE[streamIds[0]].days.keys()];
  for (const id of streamIds.slice(1)) { const d = STORE[id].days; dates = dates.filter(x => d.has(x)); }
  const all = dates.map(ds => {
    const parts = comps.map(c => {
      const a = new Float32Array(96);
      c.streams.forEach(id => { const s = STORE[id] && STORE[id].days.get(ds); if (s) for (let q = 0; q < 96; q++) a[q] += s[q]; });
      return a;
    });
    const total = new Float32Array(96);
    parts.forEach(a => { for (let q = 0; q < 96; q++) total[q] += a[q]; });
    const { y, m } = dateParts(ds);
    return { ds, y, m, wd: weekdayOf(ds), parts, total };
  });
  all.forEach((d, i) => { const n = all[i + 1]; d.next = n && n.ds === addDays(d.ds, 1) ? n : null; });
  const years = [...new Set(all.map(d => d.y))];
  const days = all.filter(d =>
    (filter.year === 'all' || d.y === +filter.year) &&
    (filter.months === 'all' || MONTH_SETS[filter.months].includes(d.m)) &&
    (filter.days === 'all' || (filter.days === 'werk' ? d.wd < 5 : d.wd >= 5)));
  const frame = { comps, days, all, years };
  FRAME_CACHE.set(key, frame);
  return frame;
}
const MONTH_SETS = {
  winter: [12, 1, 2], lente: [3, 4, 5], zomer: [6, 7, 8], herfst: [9, 10, 11],
  q1: [1, 2, 3], q2: [4, 5, 6], q3: [7, 8, 9], q4: [10, 11, 12],
};

/* ── Diensten ───────────────────────────────────────────────────────── */
// Kwartieren van een dienst als [dagOffset, kwartier]; de nacht loopt door
// in de volgende kalenderdag.
function shiftSlots(k) {
  const s = SHIFT_INFO[k]; const out = [];
  const a = s.start / 15, b = s.end / 15;
  if (a < b) for (let q = a; q < b; q++) out.push([0, q]);
  else { for (let q = a; q < 96; q++) out.push([0, q]); for (let q = 0; q < b; q++) out.push([1, q]); }
  return out;
}
function shiftHours(k) { const s = SHIFT_INFO[k]; return ((s.end - s.start + 1440) % 1440 || 1440) / 60; }
function shiftOfSlot(q) {
  const mins = q * 15;
  for (const k of SHIFT_KEYS) {
    const s = SHIFT_INFO[k];
    if (s.start < s.end ? (mins >= s.start && mins < s.end) : (mins >= s.start || mins < s.end)) return k;
  }
  return 'N';
}

// Verzamelt kwartierwaarden voor dagen × kwartieren. which = 'total' of componentindex.
function collect(days, slots, which = 'total') {
  const out = new Float64Array(days.length * slots.length);
  let n = 0;
  for (const d of days) {
    for (const [off, q] of slots) {
      const src = off ? d.next : d; if (!src) continue;
      out[n++] = which === 'total' ? src.total[q] : src.parts[which][q];
    }
  }
  return out.subarray(0, n);
}
const ALL_SLOTS = Array.from({ length: 96 }, (_, q) => [0, q]);

/* ── Statistiek ─────────────────────────────────────────────────────── */
function stats(vals) {
  const n = vals.length; if (!n) return null;
  let sum = 0, mx = -Infinity, mn = Infinity;
  for (let i = 0; i < n; i++) { const v = vals[i]; sum += v; if (v > mx) mx = v; if (v < mn) mn = v; }
  const avg = sum / n;
  let ss = 0; for (let i = 0; i < n; i++) ss += (vals[i] - avg) ** 2;
  const sd = n > 1 ? Math.sqrt(ss / (n - 1)) : 0;
  const s = Float64Array.from(vals).sort();
  const pct = p => s[Math.max(0, Math.min(n - 1, Math.ceil(n * p) - 1))];
  return { n, avg, sd, min: mn, max: mx, mu2s: avg + 2 * sd, p10: pct(0.10), p50: pct(0.5), p90: pct(0.90), p95: pct(0.95), p99: pct(0.99), sorted: s };
}
// PERCENTILE.INC zoals Excel — gebruikt door het prognosemodel.
function percentileInc(arr, p) {
  if (!arr.length) return null;
  const s = Float64Array.from(arr).sort();
  const idx = p * (s.length - 1), lo = Math.floor(idx), hi = Math.ceil(idx);
  return s[lo] + (s[hi] - s[lo]) * (idx - lo);
}
const mean = a => { let s = 0; for (const v of a) s += v; return a.length ? s / a.length : 0; };

/* ── Nederlandse feestdagen en schoolvakanties (voor de prognose) ───── */
function nlHolidays(year) {
  const a = year % 19, b = Math.floor(year / 100), c = year % 100, d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30, i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451);
  const em = Math.floor((h + l - 7 * m + 114) / 31), ed = ((h + l - 7 * m + 114) % 31) + 1;
  const easter = ymd(year, em, ed);
  const kd = weekdayOf(ymd(year, 4, 27)) === 6 ? ymd(year, 4, 26) : ymd(year, 4, 27);
  return {
    [ymd(year, 1, 1)]: 'Nieuwjaarsdag', [addDays(easter, -2)]: 'Goede Vrijdag', [easter]: '1e Paasdag', [addDays(easter, 1)]: '2e Paasdag',
    [kd]: 'Koningsdag', [ymd(year, 5, 5)]: 'Bevrijdingsdag', [addDays(easter, 39)]: 'Hemelvaart', [addDays(easter, 49)]: '1e Pinksterdag',
    [addDays(easter, 50)]: '2e Pinksterdag', [ymd(year, 12, 25)]: '1e Kerstdag', [ymd(year, 12, 26)]: '2e Kerstdag',
  };
}
const VACATIONS = [
  { label: 'Voorjaarsvakantie', weeks: [8, 9] }, { label: 'Meivakantie', weeks: [17, 18] },
  { label: 'Zomervakantie', weeks: [29, 30, 31, 32, 33, 34] }, { label: 'Herfstvakantie', weeks: [43] }, { label: 'Kerstvakantie', weeks: [52, 1] },
];
const vacationOf = w => (VACATIONS.find(v => v.weeks.includes(w)) || {}).label || null;

/* ── Prognosemodel (zelfde methode als het Slingeland-rekenmodel) ─────
   1. Per ISO-week het percentiel (100 − weigeringskans) van de dagmaxima.
   2. Trend: lineaire regressie op het doorlopende weeknummer.
   3. Seizoensindex per weeknummer = gemiddelde van (waarde ÷ trend).
   4. Prognose = trend(week) × seizoensindex(weeknummer).            */
function forecast(frame, slots, refusalPct, which = 'total') {
  const p = 1 - refusalPct / 100;
  const weeks = new Map();
  for (const d of frame.all) {
    const { isoYear, week } = isoWeek(d.ds);
    const k = isoYear * 100 + week;
    if (!weeks.has(k)) weeks.set(k, { isoYear, week, maxes: [], vals: [] });
    let mx = -Infinity;
    for (const [off, q] of slots) {
      const src = off ? d.next : d; if (!src) continue;
      const v = which === 'total' ? src.total[q] : src.parts[which][q];
      if (v > mx) mx = v;
      weeks.get(k).vals.push(v);
    }
    if (mx > -Infinity) weeks.get(k).maxes.push(mx);
  }
  const list = [...weeks.values()].filter(w => w.maxes.length >= 4).sort((a, b) => a.isoYear - b.isoYear || a.week - b.week);
  if (list.length < 30) return null;
  const y = list.map(w => percentileInc(w.maxes, p));
  const xs = y.map((_, i) => i + 1);
  const mx = mean(xs), my = mean(y);
  let num = 0, den = 0; xs.forEach((x, i) => { num += (x - mx) * (y[i] - my); den += (x - mx) ** 2; });
  const slope = den ? num / den : 0, intercept = my - slope * mx;
  const ratios = {};
  y.forEach((v, i) => { const t = slope * (i + 1) + intercept; if (t > 0) (ratios[list[i].week] = ratios[list[i].week] || []).push(v / t); });
  const seasonal = w => (ratios[w] && ratios[w].length ? mean(ratios[w]) : 1);
  const lastYear = list[list.length - 1].isoYear, fcYear = lastYear + 1;
  const hist = {};
  list.forEach(w => { (hist[w.week] = hist[w.week] || []).push(...w.vals); });
  const out = [];
  for (let w = 1; w <= 52; w++) {
    const idx = list.length + w;
    const val = Math.max(0, (slope * idx + intercept) * seasonal(w));
    const h = hist[w] ? stats(hist[w]) : null;
    out.push({ week: w, monday: isoWeekMonday(fcYear, w), val, avg: h ? h.avg : null, max: h ? h.max : null, p10: h ? h.p10 : null, vacation: vacationOf(w), season: seasonal(w) });
  }
  return { weeks: out, fcYear, slopePerYear: slope * 52, nWeeks: list.length, years: [...new Set(list.map(w => w.isoYear))] };
}

function tok(name) { return getComputedStyle(document.documentElement).getPropertyValue('--' + name).trim(); }

    ink: tok('ink'), ink2: tok('ink-2'), muted: tok('muted'), grid: tok('grid'), axis: tok('axis'),
    surface: tok('surface'), line: tok('line'), accent: tok('accent'),

// Spreiding per categorie: verticale streep met dopjes van lo naar hi.
const whiskerPlugin = {
  id: 'whiskers',
  afterDatasetsDraw(chart, _args, opts) {
    if (!opts || !opts.data) return;
    const { ctx, scales: { x, y } } = chart;
    ctx.save(); ctx.strokeStyle = opts.color || C().ink2; ctx.lineWidth = 1.5;
    opts.data.forEach((w, i) => {
      if (!w || w.lo == null || w.hi == null) return;
      const px = x.getPixelForValue(i), y1 = y.getPixelForValue(w.lo), y2 = y.getPixelForValue(w.hi);
      const cap = Math.min(6, (x.width / opts.data.length) * 0.18);
      ctx.beginPath(); ctx.moveTo(px, y1); ctx.lineTo(px, y2);
      ctx.moveTo(px - cap, y1); ctx.lineTo(px + cap, y1); ctx.moveTo(px - cap, y2); ctx.lineTo(px + cap, y2);
      ctx.stroke();
    });
    ctx.restore();
  },
};
// Horizontale gestippelde capaciteitslijn met label ("10 open bedden").
const capLinePlugin = {
  id: 'capLine',
  afterDatasetsDraw(chart, _args, opts) {
    if (!opts || opts.value == null) return;
    const { ctx, chartArea: a, scales: { y } } = chart;
    const py = y.getPixelForValue(opts.value);
    if (py < a.top - 1 || py > a.bottom + 1) return;
    const c = C();
    ctx.save(); ctx.strokeStyle = c.ink; ctx.lineWidth = 1.5; ctx.setLineDash([5, 4]);

      ctx.fillStyle = c.ink; ctx.textAlign = 'right'; ctx.textBaseline = 'bottom'; ctx.fillText(opts.label, a.right - 2, py - 4);

const dayBandPlugin = {
  id: 'dayBands',

    if (!opts || !opts.size) return;

}

let toastTimer = null;
function toast(msg) {
  let el = $('.toast'); if (!el) { el = document.createElement('div'); el.className = 'toast'; el.setAttribute('role', 'status'); document.body.appendChild(el); }
  el.textContent = msg; el.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { el.hidden = true; }, 3800);
}

async function readFiles(files, forcedStream) {
  const list = [...files]; if (!list.length) return;
  toast(`Bezig met inlezen van ${list.length} ${list.length === 1 ? 'bestand' : 'bestanden'}…`);
  await new Promise(r => setTimeout(r, 30));
  const done = [], failed = [];
  for (const f of list) {
    try {
      const buf = new Uint8Array(await f.arrayBuffer());
      const res = parseWorkbook(buf, f.name);
      const sid = forcedStream || guessStream(f.name);
      if (sid) { putStream(sid, res.days, f.name, 'bestand'); done.push(STREAMS[sid].label); }
      else S.unmatched.push({ fileName: f.name, days: res.days });
    } catch (e) { failed.push(`${f.name}: ${e.message}`); }
  }
  render();
  if (failed.length) toast(`Niet ingelezen — ${failed.join(' · ')}`);
  else if (done.length) toast(`Ingelezen: ${done.join(', ')}`);
  else if (S.unmatched.length) toast('Kies hieronder bij welke stroom het bestand hoort.');
}

async function loadSamples() {
  toast('Voorbeelddata wordt geladen…');
  let fromFile = 0;
  for (const path of SAMPLE_FILES) {
    try {
      const r = await fetch(path); if (!r.ok) throw new Error(r.status);
      const name = path.split('/').pop();
      const res = parseWorkbook(new Uint8Array(await r.arrayBuffer()), name);
      const sid = guessStream(name);
      if (sid) { putStream(sid, res.days, name, 'voorbeeld'); fromFile++; }
    } catch (e) { /* bestand niet bereikbaar (bv. geopend via file://) → synthetisch */ }
  }
  STREAM_ORDER.forEach(sid => { if (!STORE[sid]) putStream(sid, generateStream(sid), 'Synthetische reeks', 'synthetisch'); });
  render();
  toast(fromFile ? `Voorbeeld geladen: ${fromFile} DUMMY-bestanden, overige stromen synthetisch.` : 'Synthetische voorbeelddata geladen voor alle stromen.');
}

/* ── Gebeurtenissen ─────────────────────────────────────────────────── */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t || t.disabled) return;
  const a = t.dataset.act, arg = t.dataset.arg;
  const acts = {
    go: () => go(arg),
    mode: () => chooseMode(arg),
    'demo-all': loadSamples,
    'demo-one': () => { putStream(arg, generateStream(arg), 'Synthetische reeks', 'synthetisch'); render(); },
    unload: () => { delete STORE[arg]; invalidateFrames(); render(); },
    'drop-unmatched': () => { S.unmatched.splice(+arg, 1); render(); },
    unit: () => { S.unit = arg; render(); },
    view: () => { S.view = arg; render(); },
    toggle: () => { S.off[arg] = !S.off[arg]; render(); },
    metric: () => { S.metric = arg; saveSettings(); render(); },
    days: () => { S.filter.days = arg; render(); },
    weekmode: () => { S.weekMode = arg; render(); },
    weekstep: () => { stepWeek(+arg); },
    focus: () => { S.focus[S.unit] = arg; render(); },
    target: () => { S.bedTarget = +arg; render(); },
    refusal: () => { S.refusal = +arg; render(); },
    step: () => { stepValue(t.dataset.path, +arg); },
    theme: toggleTheme,
    export: exportTables,
  };
  if (acts[a]) acts[a]();
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'multi-file') return readFiles(t.files);
  if (t.dataset.slot) return readFiles(t.files, t.dataset.slot);
  if (t.dataset.assign != null && t.value) {
    const u = S.unmatched.splice(+t.dataset.assign, 1)[0];
    putStream(t.value, u.days, u.fileName, 'bestand'); render(); return;
  }
  if (t.dataset.filter) { S.filter[t.dataset.filter] = t.value; render(); return; }
  if (t.dataset.path) { setValue(t.dataset.path, t.value); return; }
  if (t.id === 'week-select') { S.weekSel = t.value; render(); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.type === 'range' && t.dataset.path) {
    const out = document.getElementById(t.dataset.out); if (out) out.value = t.value;
  }
});
document.addEventListener('dragover', e => { if (S.screen !== 'data') return; e.preventDefault(); const dz = $('#dropzone'); if (dz) dz.classList.add('over'); });
document.addEventListener('dragleave', e => { if (e.target.id === 'dropzone') e.target.classList.remove('over'); });
document.addEventListener('drop', e => {

  const dz = $('#dropzone'); if (dz) dz.classList.remove('over');

});

// Paden als "beds", "ratio.D", "plan.3.N", "shift.D.start", "fteHours".
function setValue(path, raw) {
  const parts = path.split('.');
  if (parts[0] === 'shift') {
    const [hh, mm] = raw.split(':').map(Number); if (isNaN(hh) || isNaN(mm)) return;
    SHIFT_INFO[parts[1]][parts[2]] = Math.round((hh * 60 + mm) / 15) * 15 % 1440;
    invalidateFrames();
  } else if (parts[0] === 'fteHours') S.fteHours = Math.max(1, +String(raw).replace(',', '.') || 36);
  else {
    const c = cfgOf(S.unit);
    const v = Math.max(parts[0] === 'ratio' ? 0.5 : 0, +String(raw).replace(',', '.') || 0);
    if (parts[0] === 'beds') c.beds = Math.round(v);
    else if (parts[0] === 'ratio') c.ratio[parts[1]] = v;
    else if (parts[0] === 'plan') {
      if (parts[1] === 'all') c.plan.forEach(p => { p[parts[2]] = Math.round(v); });
      else c.plan[+parts[1]][parts[2]] = Math.round(v);
    }
  }
  saveSettings();
  const y = window.scrollY; render(); window.scrollTo({ top: y });
}
function stepValue(path, delta) {
  const parts = path.split('.'); const c = cfgOf(S.unit);
  let cur;
  if (parts[0] === 'beds') cur = c.beds;
  else if (parts[0] === 'ratio') cur = c.ratio[parts[1]];
  else if (parts[0] === 'plan') cur = parts[1] === 'all' ? c.plan[0][parts[2]] : c.plan[+parts[1]][parts[2]];
  setValue(path, String((cur || 0) + delta));
}
function stepWeek(delta) {
  const f = currentFrame(); if (!f) return;
  const mondays = weekList(f);
  const i = mondays.indexOf(S.weekSel);
  S.weekSel = mondays[Math.max(0, Math.min(mondays.length - 1, i + delta))];
  render();
}

function toggleTheme() {
  const root = document.documentElement;
  const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  root.dataset.theme = dark ? 'light' : 'dark';
  try { localStorage.setItem('acuut-dash-theme', root.dataset.theme); } catch (e) { /* negeren */ }
}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { applyChartDefaults(); render(); });
new MutationObserver(() => { applyChartDefaults(); const y = window.scrollY; render(); window.scrollTo({ top: y }); })
  .observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

function boot() {
  try { const t = localStorage.getItem('acuut-dash-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) { /* negeren */ }
  loadSettings();
  applyChartDefaults();
  Chart.register(whiskerPlugin, capLinePlugin, dayBandPlugin);
  render();
}

/* ════════════════════════════════════════════════════════════════════
   DASHBOARD — locatie-tabs, filterstrook en de vijf weergaven.
   ════════════════════════════════════════════════════════════════════ */

/* ── Componenten & frame voor de huidige tab ────────────────────────── */
function compsFor(unitId) {
  if (unitId === 'ALL') {
    return unitsOf().map((u, i) => ({ id: u.id, label: u.label, streams: loadedStreams(u), ci: i }))
      .filter(c => c.streams.length && !S.off[c.id]);
  }
  const u = unitDef(unitId);
  return loadedStreams(u).filter(s => !S.off[s]).map(s => ({ id: s, label: STREAMS[s].label, streams: [s], ci: streamColorIdx(u, s) }));
}
function currentFrame() { const comps = compsFor(S.unit); return comps.length ? buildFrame(comps, S.filter) : null; }
const colorOf = c => C().series[c.ci % 8];
const cssColor = c => `var(--s${(c.ci % 8) + 1})`;
function bedsOf(unitId) { return unitId === 'ALL' ? unitsOf().reduce((s, u) => s + cfgOf(u.id).beds, 0) : cfgOf(unitId).beds; }
const mv = st => (st ? st[S.metric] : null);
const mLabel = () => METRICS[S.metric].short;
const hhmm = m => `${pad2(Math.floor(m / 60))}:${pad2(m % 60)}`;
const shiftTimes = k => `${hhmm(SHIFT_INFO[k].start)}–${hhmm(SHIFT_INFO[k].end)}`;

function weekList(frame) {
  const count = new Map();
  frame.all.forEach(d => { const { isoYear, week } = isoWeek(d.ds); const m = isoWeekMonday(isoYear, week); count.set(m, (count.get(m) || 0) + 1); });
  return [...count.entries()].filter(([, n]) => n === 7).map(([m]) => m).sort();
}

/* ── Rekenblokken die meerdere weergaven delen ──────────────────────── */
// 21 cellen (7 dagen × D/A/N): gemiddelde per component + statistiek van het totaal.
function weekCells(frame) {
  const cells = [];
  if (S.weekMode === 'typical') {
    for (let wd = 0; wd < 7; wd++) {
      const days = frame.days.filter(d => d.wd === wd);
      for (const k of SHIFT_KEYS) {
        const slots = shiftSlots(k);
        const tot = stats(collect(days, slots));
        cells.push({ wd, k, dayLabel: WD_SHORT[wd], title: `${WD_LONG[wd]} · ${SHIFT_INFO[k].label}`, parts: frame.comps.map((_, ci) => mean(collect(days, slots, ci))), tot, lo: tot && tot.p10, hi: mv(tot) });
      }
    }
  } else {
    const byDate = new Map(frame.all.map(d => [d.ds, d]));
    for (let i = 0; i < 7; i++) {
      const ds = addDays(S.weekSel, i), d = byDate.get(ds);
      for (const k of SHIFT_KEYS) {
        const slots = shiftSlots(k);
        const tot = d ? stats(collect([d], slots)) : null;
        cells.push({ wd: i, k, ds, dayLabel: fmtDay(ds), title: `${fmtDay(ds)} ${ds.slice(0, 4)} · ${SHIFT_INFO[k].label}`, parts: frame.comps.map((_, ci) => (d ? mean(collect([d], slots, ci)) : null)), tot, lo: tot && tot.min, hi: tot && tot.max });
      }
    }
  }
  return cells;
}
// Per kwartier van de dag: gemiddelde per component + statistiek van het totaal.
function dayProfile(frame) {
  const parts = frame.comps.map(() => new Array(96));
  const tot = new Array(96);
  for (let q = 0; q < 96; q++) {
    const sl = [[0, q]];
    frame.comps.forEach((_, ci) => { parts[ci][q] = mean(collect(frame.days, sl, ci)); });
    tot[q] = stats(collect(frame.days, sl));
  }
  return { parts, tot };
}
function monthly(frame) {
  const g = new Map();
  frame.days.forEach(d => { const k = `${d.y}-${pad2(d.m)}`; if (!g.has(k)) g.set(k, []); g.get(k).push(d); });
  return [...g.entries()].map(([k, days]) => ({
    k, label: `${MONTH_SHORT[+k.slice(5) - 1]} ${k.slice(2, 4)}`,
    parts: frame.comps.map((_, ci) => mean(collect(days, ALL_SLOTS, ci))), tot: stats(collect(days, ALL_SLOTS)),
  }));
}
const needOf = (v, ratio) => (v == null ? null : Math.ceil(v / ratio - 1e-9));

/* ── Gedeelde bouwstenen ───────────────────────────────────────────── */
function kpi(label, val, unit, sub, status) {
  return `<div class="kpi"><div class="kpi-label">${label}</div><div class="kpi-val num">${val}${unit ? `<small>${unit}</small>` : ''}</div>${status || ''}${sub ? `<div class="kpi-sub">${sub}</div>` : ''}</div>`;
}
function statusPill(kind, text) {
  const ic = kind === 'good' ? ICON.check : kind === 'info' ? ICON.info : ICON.alert;
  return `<span class="status ${kind}">${ic}${text}</span>`;
}
function legendHTML(comps, extra = '') {
  return `<div class="legend">${comps.map(c => `<span><i class="sw" style="background:${cssColor(c)}"></i>${esc(c.label)}</span>`).join('')}${extra}</div>`;
}
function stepper(path, val, label) {
  return `<span class="stepper-input"><button data-act="step" data-path="${path}" data-arg="-1" aria-label="${label} min één">−</button><input type="number" id="in-${path.replace(/\./g, '-')}" data-path="${path}" value="${val}" aria-label="${label}"><button data-act="step" data-path="${path}" data-arg="1" aria-label="${label} plus één">+</button></span>`;
}
function weekModeControl(frame) {
  const weeks = weekList(frame);
  if (!S.weekSel || !weeks.includes(S.weekSel)) S.weekSel = weeks[weeks.length - 1];
  return `<div class="set-row">

    </div>
    ${S.weekMode === 'week' ? `<span class="set-row">
      <button class="icon-btn" data-act="weekstep" data-arg="-1" aria-label="Vorige week">‹</button>
      <select id="week-select" aria-label="Kies week">${weeks.slice().reverse().map(m => { const w = isoWeek(m); return `<option value="${m}" ${m === S.weekSel ? 'selected' : ''}>Week ${w.week} · ${w.isoYear} (${fmtDay(m)})</option>`; }).join('')}</select>
      <button class="icon-btn" data-act="weekstep" data-arg="1" aria-label="Volgende week">›</button></span>` : ''}
  </div>`;
}
const narrow = () => window.innerWidth < 640;
function tickEveryTwoHours(v) { return v % (narrow() ? 24 : 8) === 0 ? slotLabel(v) : ''; }
// D/A/N-labels; op een smal scherm alleen de dag onder de avonddienst.
const shiftTick = x => (narrow() ? (x.k === 'A' ? x.dayLabel.split(' ')[0] : '') : x.k === 'A' ? ['A', x.dayLabel] : [x.k, '']);

/* ── Dashboard-scherm ───────────────────────────────────────────────── */
function dashScreen() {

  const frame = currentFrame();
  const span = frame && frame.all.length ? `${fmtDay(frame.all[0].ds)} ${frame.all[0].y} – ${fmtDay(frame.all[frame.all.length - 1].ds)} ${frame.all[frame.all.length - 1].y}` : 'geen data';
  const chipsFor = isAll
    ? units.map((x, i) => ({ id: x.id, label: x.label, ci: i, ok: loadedStreams(x).length > 0 }))
    : u.streams.map(sid => ({ id: sid, label: STREAMS[sid].label, ci: streamColorIdx(u, sid), ok: !!STORE[sid] }));
  const years = frame ? frame.years : [];
  if (S.filter.year !== 'all' && !years.includes(+S.filter.year)) S.filter.year = 'all';
  return `<div class="wrap">
    <div class="dash-head">
      <div>
        <div class="eyebrow">${MODES[S.mode].label}</div>
        <h1>${isAll ? 'Alle afdelingen' : esc(u.long)}</h1>
