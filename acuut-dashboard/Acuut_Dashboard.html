function todayWeek() { const t = new Date(); return { ds: ymd(t.getFullYear(), t.getMonth() + 1, t.getDate()), ...isoWeek(ymd(t.getFullYear(), t.getMonth() + 1, t.getDate())) }; }
// Lijst van ISO-weken voor de gekozen horizon.
function horizonWeeks(fc) {
  const now = todayWeek();
  if (S.fcRange === 'year') return Array.from({ length: 52 }, (_, i) => fc.at(now.isoYear, i + 1));
  const out = []; let m = isoWeekMonday(now.isoYear, now.week);
  for (let i = 0; i < 13; i++) { const w = isoWeek(m); out.push(fc.at(w.isoYear, w.week)); m = addDays(m, 7); }
  return out;
}
function viewForecast(el, frame) {
  const beds = bedsOf(S.unit);
  const fc = forecast(frame, ALL_SLOTS, S.refusal);
  if (!fc) {
    el.innerHTML = `<div class="empty-state"><h2>Te weinig historie voor een prognose</h2><p>Het model heeft minstens 30 volledige weken data nodig. Laad een langere reeks.</p></div>`;
    return;
  }
  const isAll = S.unit === 'ALL';
  const cfg = isAll ? null : cfgOf(S.unit);
  const now = todayWeek();
  const weeks = horizonWeeks(fc);
  const nowIdx = weeks.findIndex(w => w.isoYear === now.isoYear && w.week === now.week);
  // Per week: het gemiddelde vraagprofiel geschaald met (prognose ÷ jaargemiddelde prognose),
  // daarna hetzelfde kwartier-advies als bij Verpleegkundige inzet.
  let shiftFc = null;
  if (!isAll) {
    const prof = demandProfile(frame);
    const avgProf = Array.from({ length: 96 }, (_, q) => mean(prof.map(p => p[q])));
    const base = mean(Array.from({ length: 52 }, (_, i) => fc.at(now.isoYear, i + 1).val)) || 1;
    const avgPlan = cfg.shifts.map(sh => ({ ...sh, plan: Array(7).fill(Math.round(mean(sh.plan))) }));
    const adv = weeks.map(w => adviseDay(avgPlan, avgProf.map(v => v * w.val / base), 0, cfg.minStaff).plan);
    shiftFc = cfg.shifts.map((_, si) => weeks.map((w, wi) => ({ ...w, need: adv[wi][si] })));
  }
  const peak = weeks.reduce((a, b) => (b.val > a.val ? b : a));
  const overWeeks = weeks.filter(w => w.val > beds).length;
  const next4 = weeks.slice(Math.max(0, nowIdx), Math.max(0, nowIdx) + 4);
  const all52 = Array.from({ length: 52 }, (_, i) => fc.at(now.isoYear, i + 1));
  const vac = all52.filter(w => w.vacation), nonVac = all52.filter(w => !w.vacation);
  const vacDiff = (mean(vac.map(w => w.season)) / mean(nonVac.map(w => w.season)) - 1) * 100;
  const pct = 100 - S.refusal;
  const lastDs = frame.all[frame.all.length - 1].ds;
  const gapWeeks = Math.max(0, Math.round((utcDate(isoWeekMonday(now.isoYear, now.week)) - utcDate(fc.lastMonday)) / (7 * 86400000)));
  const holidays = { ...nlHolidays(now.isoYear), ...nlHolidays(now.isoYear + 1) };
  const holInWeek = w => Object.entries(holidays).filter(([ds]) => ds >= w.monday && ds <= addDays(w.monday, 6)).map(([, n]) => n);
  const c = C();
  const span = `week ${weeks[0].week}${weeks[0].isoYear !== weeks[weeks.length - 1].isoYear ? ' ' + weeks[0].isoYear : ''} t/m week ${weeks[weeks.length - 1].week} ${weeks[weeks.length - 1].isoYear}`;

  el.innerHTML = `
    <section class="panel stagger fc-intro" style="margin-bottom:16px">
      <div class="panel-head">
        <div>
          <h2>Prognose ${span}</h2>
          <div class="desc">We zitten nu in <b>week ${now.week} van ${now.isoYear}</b> (${fmtDay(now.ds)}). De historie loopt t/m ${fmtDay(lastDs)} ${lastDs.slice(0, 4)} (${fc.nWeeks} weken, ${fc.years[0]}–${fc.years[fc.years.length - 1]})${gapWeeks > 1 ? `; de prognose kijkt dus ${gapWeeks} weken vooruit vanaf het einde van de data` : ''}.
          Per week: P${fmt(pct, pct % 1 ? 1 : 0)} van de dagmaxima (weigeringskans ${fmt(S.refusal, S.refusal % 1 ? 1 : 0)}%), met lineaire trend × seizoensindex per weeknummer. Periode- en dagfilters gelden hier niet.</div>
        </div>
        <div class="set-row">
          <div class="set"><label>Horizon</label><div class="seg small" role="group" aria-label="Horizon" data-ind="fcrange">${[['next', 'Komende 13 weken'], ['year', `Heel ${now.isoYear}`]].map(([v, l]) => `<button class="${S.fcRange === v ? 'on' : ''}" data-act="fcrange" data-arg="${v}">${l}</button>`).join('')}</div></div>
          <div class="set"><label>Weigeringskans</label><div class="seg small" role="group" aria-label="Weigeringskans" data-ind="refusal">${[1, 2.5, 5, 10].map(r => `<button class="${S.refusal === r ? 'on' : ''}" data-act="refusal" data-arg="${r}">${fmt(r, r % 1 ? 1 : 0)}%</button>`).join('')}</div></div>
        </div>
      </div>
    </section>
    <div class="kpis">
      ${kpi('Nu', `week ${now.week}`, String(now.isoYear), `${fmtDay(now.ds)} · prognose ${fmt(nowIdx >= 0 ? weeks[nowIdx].val : fc.at(now.isoYear, now.week).val)} patiënten`)}
      ${kpi('Komende 4 weken', kn(next4.length ? Math.max(...next4.map(w => w.val)) : 0), 'patiënten piek', next4.length ? `week ${next4[0].week}–${next4[next4.length - 1].week}` : '', next4.some(w => w.val > beds) ? statusPill('crit', 'Boven de bedden') : statusPill('good', `Binnen ${beds} bedden`))}
      ${kpi('Drukste week in beeld', `wk ${peak.week}`, String(peak.isoYear), `${fmt(peak.val)} patiënten · vanaf ${fmtDay(peak.monday)}${peak.vacation ? ' · ' + peak.vacation.toLowerCase() : ''}`)}
      ${kpi('Weken boven bedden', kn(overWeeks, 0), `van ${weeks.length}`, `prognose > ${beds} bedden · trend ${fc.slopePerYear >= 0 ? '+' : ''}${fmt(fc.slopePerYear)} pat./jaar · vakanties ${vacDiff >= 0 ? '+' : ''}${fmt(vacDiff, 0)}%`, statusPill(overWeeks === 0 ? 'good' : overWeeks < 4 ? 'warn' : 'crit', overWeeks === 0 ? 'Past' : `${overWeeks} weken krap`))}
    </div>
    <section class="panel stagger">
      <div class="panel-head"><div><h2>Verwachte piekbezetting per week</h2><div class="desc">Staaf = prognose voor die week; streepje = historisch gemiddelde tot maximum in hetzelfde weeknummer. Rood = boven de ${beds} bedden. "Nu" = de huidige week.</div></div></div>
      <div class="chart-box tall"><canvas id="ch-fc" role="img" aria-label="Prognose per week"></canvas></div>
      <div class="legend"><span><i class="sw" style="background:var(--s1)"></i>Prognose binnen capaciteit</span><span><i class="sw" style="background:var(--crit)"></i>Boven capaciteit</span><span class="sep"></span><span><i class="wh"></i>Historie gem.–max</span><span><i class="ln"></i>Open bedden</span></div>
    </section>
    ${isAll ? `<p class="note">Per afdeling zie je in hun eigen tabblad ook de benodigde verpleegkundigen per week.</p>` : `
    <section class="panel stagger" style="margin-top:16px">
      <div class="panel-head"><div><h2>Verpleegkundigen nodig per week en dienst</h2><div class="desc">Advies per dienst als de bezetting de prognose van die week volgt (zelfde kwartier-toets als bij Verpleegkundige inzet), tegen het gemiddelde rooster. Beweeg over een week voor details.</div></div></div>
      <div class="table-wrap">${forecastStrip(shiftFc, cfg, weeks, nowIdx)}</div>
      <div class="heat-scale"><span class="diff neg">−1</span> overschot <span class="diff zero">0</span> sluitend <span class="diff pos">+1</span> tekort t.o.v. rooster</div>
    </section>`}`;

  mkChart($('#ch-fc'), {
    type: 'bar',
    data: { labels: weeks.map(w => [`wk ${w.week}`, w.week === 1 || w === weeks[0] ? String(w.isoYear) : '']), datasets: [{ label: 'Prognose', data: weeks.map(w => w.val), backgroundColor: weeks.map(w => (w.val > beds ? c.crit : c.series[0])), barPercentage: 0.8, categoryPercentage: 0.92 }] },
    options: {
      layout: { padding: { top: 18 } },
      scales: { ...baseScales({ yMax: Math.ceil(Math.max(beds, ...weeks.map(w => w.max || 0), ...weeks.map(w => w.val)) + 1), yTitle: 'Patiënten' }), x: { grid: { display: false }, border: { color: c.axis }, ticks: { maxRotation: 0, autoSkip: false, callback: (v, i) => (weeks.length <= 13 || i % 4 === 0 || i === nowIdx ? [`wk ${weeks[i].week}`, i === 0 || weeks[i].week === 1 ? String(weeks[i].isoYear) : ''] : '') } } },
      plugins: {
        nowMarker: nowIdx >= 0 ? { index: nowIdx } : {},
        whiskers: { data: weeks.map(w => ({ lo: w.avg, hi: w.max })) },
        capLine: { value: beds, label: `${beds} open bedden` },
        tooltip: { callbacks: {
          title: it => { const w = weeks[it[0].dataIndex]; return `Week ${w.week} · ${w.isoYear} · vanaf ${fmtDay(w.monday)}`; },
          label: it => ` Prognose: ${fmt(it.raw)} patiënten`,
          footer: it => { const w = weeks[it[0].dataIndex]; const h = holInWeek(w); return [`Historie wk ${w.week}: gem. ${fmt(w.avg)} · max ${fmt(w.max, 0)}`, `Seizoensindex ${fmt(w.season, 2)}`, ...(w.vacation ? [w.vacation] : []), ...(h.length ? [h.join(', ')] : [])]; },
        } },
      },
    },
  });
}

function forecastStrip(shiftFc, cfg, weeks, nowIdx) {
  const n = weeks.length;
  return `<div class="strip" role="table" aria-label="Verpleegkundigen per week" style="grid-template-columns: 110px repeat(${n}, minmax(0, 1fr)); min-width:${n > 13 ? 760 : 0}px">
    <div></div>${weeks.map((w, i) => `<div class="sh ${i === nowIdx ? 'now' : ''}">${n <= 13 || i % 4 === 0 || i === nowIdx ? 'wk ' + w.week : ''}</div>`).join('')}
    ${cfg.shifts.map((sh, si) => {
      const f = shiftFc[si]; const plan = Math.round(mean(sh.plan));
      return `<div class="sl" title="${esc(sh.label)} ${shiftSpan(sh)} · ${fmtRatio(sh.ratio)}">${esc(sh.label)} <span class="hint">${plan} vpk</span></div>` + (f ? f.map((w, i) => {
        const need = w.need; const d = need - plan;
        const bg = d > 0 ? `color-mix(in srgb, var(--nurse) ${Math.min(100, 30 + d * 25)}%, var(--surface))` : d < 0 ? `color-mix(in srgb, var(--s2) ${Math.min(80, 20 + -d * 18)}%, var(--surface))` : 'var(--surface-2)';
        const fg = d >= 2 ? '#fff' : 'var(--ink)';
        return `<div class="sc ${i === nowIdx ? 'now' : ''}" style="background:${bg};color:${fg}" title="Week ${w.week} ${w.isoYear} · ${esc(sh.label)}: advies ${need}, ingepland ${plan} (prognose ${fmt(w.val)} pat., norm ${fmtRatio(sh.ratio)})">${need}</div>`;
      }).join('') : weeks.map(() => '<div class="sc">—</div>').join(''));
    }).join('')}
  </div>`;
}

/* ── Export: alle tabellen van de huidige weergave naar één Excel ───── */
function exportTables() {
  const tables = [...document.querySelectorAll('#view table.data')];
  if (!tables.length) { toast('Deze weergave heeft geen tabellen om te exporteren.'); return; }
  try {
    const wb = XLSX.utils.book_new();
    tables.forEach((t, i) => {
      const clone = t.cloneNode(true);
      clone.querySelectorAll('.stepper-input').forEach(s => { s.replaceWith(document.createTextNode(s.querySelector('input').value)); });
      XLSX.utils.book_append_sheet(wb, XLSX.utils.table_to_sheet(clone), (t.dataset.name || 'Tabel ' + (i + 1)).slice(0, 31));
    });
    const name = `${S.unit === 'ALL' ? 'Alle' : unitDef(S.unit).label}_${S.view}.xlsx`.replace(/\s+/g, '_');

    toast(`Geëxporteerd: ${name}`);

/* ═════════════ 7. JDT SEH WERKDRUK ═════════════ */
// Werkdruk % = JDT-punten ÷ (verpleegkundigen × 30) × 100, per uur.
function viewJDT(el) {
  const st = STORE.jdt;
  if (!st) {
    el.innerHTML = `<div class="empty-state stagger"><h2>Nog geen JDT-bestand</h2><p>Laad het JDT SEH-bestand (tabbladen "JDT aantal" en "%") om de werkdruk per uur te zien.</p><button class="btn primary" data-act="go" data-arg="data">${ICON.file} Naar data inladen</button></div>`;
    return;
  }
  if (!S.jdtVpk) S.jdtVpk = st.vpkBase.slice(0, 24);
  const years = [...new Set(st.days.map(d => d.y))];
  if (S.jdtYear !== 'all' && !years.includes(+S.jdtYear)) S.jdtYear = 'all';
  const days = st.days.filter(d => (S.jdtYear === 'all' || d.y === +S.jdtYear) && (S.filter.days === 'all' || (S.filter.days === 'werk' ? d.wd < 5 : d.wd >= 5)));
  const pct = (a, h) => (a == null || !S.jdtVpk[h] ? null : a / (S.jdtVpk[h] * 30) * 100);
  const hourStats = Array.from({ length: 24 }, (_, h) => stats(days.map(d => pct(d.hours[h], h)).filter(v => v != null)));
  const allP = days.flatMap(d => d.hours.map((a, h) => pct(a, h)).filter(v => v != null));
  const tot = stats(allP);
  const over = allP.length ? allP.filter(v => v > 100).length / allP.length * 100 : 0;
  const peakH = hourStats.reduce((b, s2, h) => (s2 && s2.avg > (hourStats[b] ? hourStats[b].avg : -1) ? h : b), 0);
  const pts = mean(days.map(d => d.hours.reduce((a, b) => a + (b || 0), 0)));
  const c = C();
  const heat = WD_SHORT.map((_, wd) => Array.from({ length: 24 }, (_, h) => { const st = stats(days.filter(d => d.wd === wd).map(d => pct(d.hours[h], h)).filter(v => v != null)); return st ? mv(st) : 0; }));

/* ════════════════════════════════════════════════════════════════════
   OVERZICHT — nagebouwd naar het Slingeland-dashboard:
   · Bezetting 08:00 vandaag → 08:00 morgen met een "Nu"-markering:
     vóór Nu de werkelijke bezetting (nog aanwezig / reeds vertrokken),
     na Nu de huidige patiënten die blijven + verwachte nieuwe patiënten,
     met de bandbreedte uit de historie en het aantal open bedden.
   · Verpleegkundigen (nodig − ingepland) per dag en dienst.
   · Bezetting per dienst (D/A/N), gestapeld per stroom, met spreiding.
   Het peilmoment ("Nu") is een moment in de geladen historie; met
   Afspelen loopt het uur voor uur door.
   ════════════════════════════════════════════════════════════════════ */

// Standaard gemiddelde verblijfsduur (uur) — bepaalt hoe snel huidige patiënten vertrekken.
const LOS_DEFAULT = { IC: 72, CCU: 48, SEH: 3.5, EHH: 8, AP: 4, HF: 60, ALL: 24 };
function losOf(unitId) { if (unitId === 'ALL') return LOS_DEFAULT.ALL; const c = cfgOf(unitId); return c.los || LOS_DEFAULT[unitId] || 24; }
function bedsAtHour(unitId, h) {
  if (unitId === 'ALL') return unitsOf().reduce((t, u) => t + bedsAtHour(u.id, h), 0);
  const c = cfgOf(unitId); const k = shiftOfSlot(h * 4);
  return c.bedsShift && c.bedsShift[k] != null ? c.bedsShift[k] : c.beds;
}

const byDateCache = new WeakMap();
function dayByDate(frame) { let m = byDateCache.get(frame); if (!m) { m = new Map(frame.all.map(d => [d.ds, d])); byDateCache.set(frame, m); } return m; }
// Historisch profiel per weekdag × uur (statistiek van het totaal), gecachet.
const whCache = new WeakMap();
function weekdayHourProfile(frame) {
  let p = whCache.get(frame);
  if (!p) { p = WD_SHORT.map((_, wd) => { const days = frame.days.filter(d => d.wd === wd); return HOUR_SLOTS.map(sl => stats(collect(days, sl))); }); whCache.set(frame, p); }
  return p;
}
function peilOf(frame) {
  const first = frame.all[0].ds, last = frame.all[frame.all.length - 1].ds;
  if (!S.peil || S.peil.ds < first || S.peil.ds > last) S.peil = { ds: last, h: Math.min(22, Math.max(9, new Date().getHours())) };
  return S.peil;
}
function movePeil(hours, frame) {
  let { ds, h } = S.peil; h += hours;
  while (h >= 24) { h -= 24; ds = addDays(ds, 1); }
  while (h < 0) { h += 24; ds = addDays(ds, -1); }
  const first = frame.all[0].ds, last = frame.all[frame.all.length - 1].ds;
  if (ds < first || ds > last) return false;
  S.peil = { ds, h }; return true;
}
const hourMean = (d, h) => (d ? (d.total[h * 4] + d.total[h * 4 + 1] + d.total[h * 4 + 2] + d.total[h * 4 + 3]) / 4 : null);

// 25 uren: 08:00 van de peildag (of de dag ervoor als Nu vóór 08:00 valt) t/m 08:00 de dag erna.
function next24(frame, unitId) {
  const peil = peilOf(frame);
  const startDs = peil.h >= 8 ? peil.ds : addDays(peil.ds, -1);
  const nowIdx = (peil.h - 8 + 24) % 24;
  const map = dayByDate(frame), prof = weekdayHourProfile(frame);
  const occNow = hourMean(map.get(peil.ds), peil.h);
  const los = losOf(unitId);
  const pts = [];
  for (let t = 0; t <= 24; t++) {
    const h = (8 + t) % 24, ds = t + 8 >= 24 ? addDays(startDs, 1) : startDs;
    const st = prof[weekdayOf(ds)][h];
    const exp = st ? mv(st) : 0;
    const act = hourMean(map.get(ds), h);
    const p = { t, ds, h, beds: bedsAtHour(unitId, h), lo: st ? st.p10 : null, hi: st ? st.p95 : null, exp, act };
    if (t < nowIdx) { const a = act ?? exp; p.cur = Math.min(a, occNow ?? a); p.gone = Math.max(0, a - p.cur); p.nieuw = 0; p.kind = 'past'; }
    else if (t === nowIdx) { p.cur = occNow ?? exp; p.gone = 0; p.nieuw = 0; p.kind = 'now'; }
    else { const remain = (occNow ?? 0) * Math.exp(-(t - nowIdx) / los); p.cur = Math.min(remain, Math.max(exp, remain)); p.nieuw = Math.max(0, exp - remain); p.gone = 0; p.kind = 'future'; }
    pts.push(p);
  }
  return { pts, nowIdx, occNow, startDs, peil, los };
}

// Dagen rond het peilmoment (gisteren t/m over 3 dagen), zoals in het voorbeeld.
function rangeDays(frame) { const p = peilOf(frame); return [-1, 0, 1, 2, 3].map(i => addDays(p.ds, i)); }
function shiftEndsBeforePeil(ds, sh, peil) {
  const endDs = sh.end <= sh.start ? addDays(ds, 1) : ds;
  return endDs < peil.ds || (endDs === peil.ds && sh.end <= peil.h * 60);
}
function rangeCells(frame) {
  const peil = peilOf(frame), map = dayByDate(frame);
  const cells = [];
  rangeDays(frame).forEach(ds => {
    const wd = weekdayOf(ds), d = map.get(ds);
    SHIFT_KEYS.forEach(k => {
      const sh = SHIFT_INFO[k];
      const known = d && (k !== 'N' || d.next) && shiftEndsBeforePeil(ds, sh, peil);
      const sp = known ? splitByMetric([d], shiftSlots(k), frame.comps.length) : splitByMetric(frame.days.filter(x => x.wd === wd), shiftSlots(k), frame.comps.length);
      cells.push({ ds, wd, k, known, dayLabel: fmtDay(ds), title: `${fmtDay(ds)} ${ds.slice(0, 4)} · ${SHIFT_INFO[k].label}${known ? '' : ' (verwachting)'}`, ...sp, lo: sp.tot && (known ? sp.tot.min : sp.tot.p10), hi: sp.tot && sp.tot.max });
    });
  });
  return cells;
}

function viewOverview(el, frame) {
  const unitId = S.unit;

  const all = stats(collect(frame.days, ALL_SLOTS));

      ${staff ? kpi('Verpleegkundigen per week', kn(staff.need, 0), `diensten advies · ${staff.plan} ingepland`, `norm ${mLabel()}`, statusPill(staff.need > staff.plan ? 'crit' : 'good', staff.need > staff.plan ? `${staff.need - staff.plan} tekort` : staff.need === staff.plan ? 'Sluitend' : `${staff.plan - staff.need} ruimte`)) : kpi('Afdelingen', kn(frame.comps.length, 0), '', frame.comps.map(c => c.label).join(' · '))}

          <input type="date" id="peil-date" value="${peil.ds}" min="${frame.all[0].ds}" max="${frame.all[frame.all.length - 1].ds}" aria-label="Peildatum">
          <select id="peil-hour" aria-label="Peiluur">${Array.from({ length: 24 }, (_, h) => `<option value="${h}" ${h === peil.h ? 'selected' : ''}>${pad2(h)}:00</option>`).join('')}</select>
          <button class="icon-btn" data-act="peil" data-arg="1" aria-label="Een uur verder">›</button>
          <button class="btn small play ${S.playing ? 'on' : ''}" data-act="play" aria-pressed="${S.playing}">${S.playing ? '<svg viewBox="0 0 16 16" width="12" height="12"><rect x="3" y="2.5" width="3.5" height="11" fill="currentColor"/><rect x="9.5" y="2.5" width="3.5" height="11" fill="currentColor"/></svg> Pauze' : '<svg viewBox="0 0 16 16" width="12" height="12"><path d="M4 2.5v11l9.5-5.5z" fill="currentColor"/></svg> Afspelen'}</button>
        </div>
      </div>

        <span><i class="sw band-sw"></i>Bandbreedte P10–P95</span><span><i class="dot-k"></i>Werkelijk (achteraf)</span><span><i class="ln"></i>Aantal open bedden</span>

  chart24($('#ch-24'), nx);
  if (unitId !== 'ALL') nurseChart($('#ch-nurse'), frame, unitId);

/* ── "Nu"-markering: kolom + label, schuift zacht mee bij afspelen ──── */
const nowMarkerPlugin = {
  id: 'nowMarker',
  beforeDatasetsDraw(chart, _a, opts) {
    if (!opts || opts.index == null) return;
    const { ctx, chartArea: a, scales: { x } } = chart;
    const target = x.getPixelForValue(opts.index);
    const step = Math.abs(x.getPixelForValue(1) - x.getPixelForValue(0));
    const st = chart.$now || (chart.$now = { x: target, from: target, to: target, t0: 0 });
    if (st.to !== target) { st.from = st.x; st.to = target; st.t0 = performance.now(); }
    const t = REDUCED() ? 1 : Math.min(1, (performance.now() - st.t0) / 420);
    st.x = st.from + (st.to - st.from) * (1 - Math.pow(1 - t, 3));

};

/* ════════════════════════════════════════════════════════════════════
   VERPLEEGKUNDIGE INZET — diensten (incl. tussendiensten), een norm per
   dienst (patiënten per verpleegkundige) en een advies op kwartierniveau.

   Model, per weekdag:
   · vraag(q)     = bezetting volgens de gekozen norm (Gem./P95/µ+2σ/Max)
                    in kwartier q
   · capaciteit(q) = Σ over diensten die in q werken: ingepland × ratio
   · advies        = begin bij het rooster; voeg steeds één verpleegkundige
                    toe aan de dienst die per gewerkt uur het meeste tekort
                    wegneemt, tot er geen tekort meer is; haal daarna weg
                    wat nergens nodig is (niet onder het minimum per dienst).
   ════════════════════════════════════════════════════════════════════ */
const RATIO_PRESETS = [1, 1.5, 2, 2.5, 3, 4];
// Dienstkleuren: alleen tinten waarop witte tekst leesbaar blijft.
const SHIFT_TOKENS = ['s1', 's4', 's6', 's7', 's8', 's5'];
const fmtRatio = r => '1:' + fmt(r, r % 1 ? 1 : 0);
const shiftShort = s => (s.label || '?').trim().charAt(0).toUpperCase();
const shiftSpan = s => `${hhmm(s.start)}–${hhmm(s.end)}`;
const shiftHrs = s => (((s.end - s.start + 1440) % 1440) || 1440) / 60;
function shiftActive(s, q) { const m = q * 15; return s.start < s.end ? m >= s.start && m < s.end : m >= s.start || m < s.end; }
function slotsOfShift(s) {
  const out = []; const a = s.start / 15, b = s.end / 15;
  if (a < b) for (let q = a; q < b; q++) out.push([0, q]);
  else { for (let q = a; q < 96; q++) out.push([0, q]); for (let q = 0; q < b; q++) out.push([1, q]); }
  return out;
}

// Vraag per weekdag × kwartier volgens de norm (gecachet per frame + norm).
const DEMAND_CACHE = new WeakMap();
function demandProfile(frame) {
  let byMetric = DEMAND_CACHE.get(frame);
  if (!byMetric) { byMetric = {}; DEMAND_CACHE.set(frame, byMetric); }
  if (byMetric[S.metric]) return byMetric[S.metric];
  const out = WD_SHORT.map((_, wd) => {
    const days = frame.days.filter(d => d.wd === wd);
    return Array.from({ length: 96 }, (_, q) => { const st = stats(collect(days, [[0, q]])); return st ? mv(st) : 0; });
  });
  byMetric[S.metric] = out;
  return out;
}

function capacityAt(shifts, plan, q) {
  let c = 0;
  shifts.forEach((s, i) => { if (shiftActive(s, q)) c += plan[i] * s.ratio; });
  return c;
}
function adviseDay(shifts, dem, wd, minStaff) {
  const plan = shifts.map(s => s.plan[wd]);
  const act = shifts.map(s => Array.from({ length: 96 }, (_, q) => shiftActive(s, q)));
  const shortAt = q => Math.max(0, dem[q] - capacityAt(shifts, plan, q));
  for (let it = 0; it < 300; it++) {
    const sh = Array.from({ length: 96 }, (_, q) => shortAt(q));
    if (sh.every(v => v < 1e-6)) break;
    let best = -1, bestScore = 0;
    shifts.forEach((s, i) => {
      let gain = 0; for (let q = 0; q < 96; q++) if (act[i][q]) gain += Math.min(sh[q], s.ratio);
      const score = gain / shiftHrs(s);
      if (gain > 1e-6 && score > bestScore) { best = i; bestScore = score; }
    });
    if (best < 0) break; // tekort in een kwartier waar geen dienst werkt
    plan[best]++;
  }
  for (let it = 0; it < 300; it++) {
    let best = -1;
    shifts.forEach((s, i) => {
      if (plan[i] <= minStaff) return;
      for (let q = 0; q < 96; q++) if (act[i][q] && capacityAt(shifts, plan, q) - s.ratio < dem[q] - 1e-9) return;
      if (best < 0 || shiftHrs(s) > shiftHrs(shifts[best])) best = i;
    });
    if (best < 0) break;
    plan[best]--;
  }
  const uncovered = [];
  for (let q = 0; q < 96; q++) if (dem[q] > 1e-6 && !shifts.some(s => shiftActive(s, q))) uncovered.push(q);
  return { plan, uncovered };
}

// Volledig advies voor een afdeling (typische week).
function staffSummary(frame, unitId) {
  const cfg = cfgOf(unitId);
  const shifts = cfg.shifts;
  const dem = demandProfile(frame);
  const days = WD_SHORT.map((_, wd) => adviseDay(shifts, dem[wd], wd, cfg.minStaff));
  const plan = shifts.reduce((t, s) => t + s.plan.reduce((a, b) => a + b, 0), 0);
  const need = days.reduce((t, d) => t + d.plan.reduce((a, b) => a + b, 0), 0);
  const planH = shifts.reduce((t, s) => t + s.plan.reduce((a, b) => a + b, 0) * shiftHrs(s), 0);
  const needH = days.reduce((t, d) => t + d.plan.reduce((a, b, i) => a + b * shiftHrs(shifts[i]), 0), 0);
  let shortQ = 0;
  WD_SHORT.forEach((_, wd) => { for (let q = 0; q < 96; q++) if (dem[wd][q] - capacityAt(shifts, shifts.map(s => s.plan[wd]), q) > 1e-6) shortQ++; });
  const uncovered = [...new Set(days.flatMap(d => d.uncovered))].sort((a, b) => a - b);
  return { shifts, dem, days, plan, need, fteNeed: needH / S.fteHours, ftePlan: planH / S.fteHours, shortPct: shortQ / (7 * 96) * 100, uncovered };
}

// Kwartieren zonder dienst samenvatten als tijdvakken.
function gapsText(qs) {
  const out = []; let a = null, p = null;
  qs.forEach(q => { if (a == null) { a = q; p = q; } else if (q === p + 1) p = q; else { out.push([a, p]); a = q; p = q; } });
  if (a != null) out.push([a, p]);
  return out.map(([x, y]) => `${slotLabel(x)}–${slotLabel((y + 1) % 96)}`).join(', ');
}
// "Avond: +1 op ma, di, wo" — gelijke wijzigingen per dienst gebundeld.
function adviceLines(sum) {
  const lines = [];
  sum.shifts.forEach((s, i) => {
    const groups = new Map();
    sum.days.forEach((d, wd) => { const diff = d.plan[i] - s.plan[wd]; if (diff) { if (!groups.has(diff)) groups.set(diff, []); groups.get(diff).push(wd); } });
    groups.forEach((wds, diff) => lines.push({ s, diff, wds }));
  });
  return lines.sort((a, b) => b.diff - a.diff);
}
const dayList = wds => (wds.length === 7 ? 'alle dagen' : wds.length === 5 && wds.every(w => w < 5) ? 'ma–vr' : wds.length === 2 && wds.every(w => w >= 5) ? 'za–zo' : wds.map(w => WD_SHORT[w].toLowerCase()).join(', '));

            <span class="hint">1 vpk op</span>
            <span class="seg small" role="group" aria-label="Norm ${esc(s.label)}" data-ind="ratio-${i}">${RATIO_PRESETS.map(r => `<button class="${s.ratio === r ? 'on' : ''}" data-act="ratio" data-path="sh.${i}.ratio" data-arg="${r}">${fmt(r, r % 1 ? 1 : 0)}</button>`).join('')}</span>
            <input type="number" step="0.1" min="0.5" class="ratio-in" id="in-sh-${i}-ratio" data-path="sh.${i}.ratio" value="${s.ratio}" aria-label="Eigen norm ${esc(s.label)}"><span class="hint">pat.</span>
          </span>
          <span class="shift-cap" title="Aantal vpk × norm">= <b>${fmt(Math.round(mean(s.plan)) * s.ratio, (Math.round(mean(s.plan)) * s.ratio) % 1 ? 1 : 0)}</b> patiënten</span>
          <button class="icon-btn" data-act="shift-del" data-arg="${i}" aria-label="Verwijder ${esc(s.label)}" ${shifts.length > 1 ? '' : 'disabled'}>×</button>
        </div>`).join('')}
      </div>
      <div class="btn-row" style="margin-top:12px">
        <button class="btn" data-act="shift-add" data-arg="tussen">${ICON.plus} Tussendienst toevoegen</button>
        <button class="btn" data-act="shift-add" data-arg="leeg">${ICON.plus} Lege dienst</button>
      </div>
    </section>
    <div class="kpis">
      ${kpi('Diensten per week ingepland', kn(sum.plan, 0), '', 'volgens het rooster hieronder')}
      ${kpi('Advies per week', kn(sum.need, 0), 'diensten', `norm ${mLabel()} · per kwartier getoetst`, statusPill(sum.need > sum.plan ? 'crit' : sum.need < sum.plan ? 'info' : 'good', sum.need > sum.plan ? `${sum.need - sum.plan} erbij nodig` : sum.need < sum.plan ? `${sum.plan - sum.need} kan eraf` : 'Rooster klopt'))}
      ${kpi('Tijd onderbezet', kn(sum.shortPct), '%', 'kwartieren waarin het rooster tekortschiet', statusPill(sum.shortPct < 1 ? 'good' : sum.shortPct < 10 ? 'warn' : 'crit', sum.shortPct < 1 ? 'Gedekt' : sum.shortPct < 10 ? 'Soms krap' : 'Vaak krap'))}
      ${kpi('FTE', kn(sum.ftePlan), `ingepland · ${fmt(sum.fteNeed)} advies`, `bij ${S.fteHours} uur per FTE`)}
    </div>
    <div class="grid g-3-1">
      <section class="panel stagger">
        <div class="panel-head">
          <div><h2>Dekking over de dag</h2><div class="desc">Vraag (${mLabel()} van de bezetting) tegen de capaciteit van het rooster: verpleegkundigen × norm. Rood = tekort.</div></div>
          <div class="seg small" role="group" aria-label="Weekdag" data-ind="staffday">${WD_SHORT.map((d, i) => `<button class="${wd === i ? 'on' : ''}" data-act="staffday" data-arg="${i}">${d}</button>`).join('')}</div>
        </div>
        <div class="chart-box"><canvas id="ch-cover" role="img" aria-label="Dekking over de dag"></canvas></div>
        <div class="gantt" aria-label="Diensten op ${WD_LONG[wd]}">
          ${shifts.map((s, i) => {
            const segs = s.start < s.end ? [[s.start, s.end]] : [[s.start, 1440], [0, s.end]];
            const adv = sum.days[wd].plan[i], cur = s.plan[wd];
            return `<div class="g-row"><span class="g-lbl">${esc(s.label)}</span><span class="g-track">${segs.map(([a, b]) => `<i class="g-bar" style="left:${a / 14.4}%;width:${(b - a) / 14.4}%;--c:${shColor(i)}"><b>${cur}</b> vpk${adv !== cur ? ` → ${adv}` : ''}</i>`).join('')}</span></div>`;
          }).join('')}
          <div class="g-row g-axis"><span class="g-lbl"></span><span class="g-track">${[0, 3, 6, 9, 12, 15, 18, 21].map(h => `<em style="left:${h / 24 * 100}%">${pad2(h)}:00</em>`).join('')}</span></div>
        </div>
        <div class="legend"><span><i class="sw" style="background:var(--axis)"></i>Vraag (${mLabel()})</span><span><i class="ln solid" style="border-color:var(--accent)"></i>Capaciteit rooster</span><span><i class="ln" style="border-color:var(--good)"></i>Capaciteit advies</span><span><i class="sw" style="background:var(--crit)"></i>Tekort</span></div>
      </section>
      <section class="panel stagger">
        <div class="panel-head"><div><h2>Advies</h2><div class="desc">Op basis van je diensten, normen en rooster.</div></div></div>
        ${sum.uncovered.length ? `<div class="picker-warn" style="margin:0 0 10px">${ICON.alert}<div>Geen dienst tussen <b>${gapsText(sum.uncovered)}</b>, terwijl er dan patiënten liggen. Pas de tijden aan of voeg een dienst toe.</div></div>` : ''}
        ${lines.length ? `<ul class="advice">${lines.map(l => `<li class="stagger"><span class="diff ${l.diff > 0 ? 'pos' : 'neg'}">${l.diff > 0 ? '+' : ''}${l.diff}</span><span><b>${esc(l.s.label)}</b> op ${dayList(l.wds)}</span></li>`).join('')}</ul>
          <button class="btn primary" data-act="advice-apply" style="margin-top:12px">${ICON.check.replace('<svg', '<svg width="14" height="14"')} Advies overnemen in rooster</button>`
          : `<p class="advice-ok">${ICON.check.replace('<svg', '<svg width="16" height="16"')} Het rooster dekt de vraag volgens de norm ${mLabel()}, zonder overbodige diensten.</p>`}
        <p class="note">Wijzig de norm (Gem./P95/µ+2σ/Max) bovenaan om strenger of ruimer te plannen.</p>
      </section>
    </div>
    <section class="panel stagger" style="margin-top:16px">
      <div class="panel-head"><div><h2>Verpleegkundigen (advies − ingepland)</h2><div class="desc">Boven de nul: er is meer nodig dan ingepland. Onder de nul: ruimte in het rooster.</div></div></div>
      <div class="chart-box"><canvas id="ch-staffdiff" role="img" aria-label="Verschil advies en ingepland"></canvas></div>
      <div class="legend"><span><i class="sw" style="background:var(--nurse)"></i>Verpleegkundigen (advies − ingepland)</span><span class="sep"></span><span class="key">${shifts.map(s => `<b>${esc(shiftShort(s))}</b> ${esc(s.label)}`).join(' ')}</span></div>
    </section>
    <section class="panel stagger" style="margin-top:16px">
      <div class="panel-head"><div><h2>Rooster</h2><div class="desc">Aantal ingeplande verpleegkundigen per dag en dienst. De regel "Advies" laat zien wat het model voorstelt.</div></div></div>
      <div class="table-wrap"><table class="data" data-name="Rooster"><thead><tr><th>Dienst</th><th></th>${WD_SHORT.map(d => `<th class="num">${d}</th>`).join('')}<th class="num">Alle dagen</th></tr></thead><tbody>
        ${shifts.map((s, i) => `
          <tr><td rowspan="3"><span class="cell-name"><span class="shift-dot small" style="background:${shColor(i)}">${esc(shiftShort(s))}</span>${esc(s.label)}</span><span class="mono" style="color:var(--muted);font-size:11.5px">${shiftSpan(s)} · ${fmtRatio(s.ratio)}</span></td>
            <td class="rowlbl">Patiënten (${mLabel()})</td>${WD_SHORT.map((_, w) => `<td class="num">${fmt(shiftLoad(s, w))}</td>`).join('')}<td></td></tr>
          <tr><td class="rowlbl">Ingepland</td>${WD_SHORT.map((_, w) => `<td class="num">${stepper(`sh.${i}.plan.${w}`, s.plan[w], `Ingepland ${WD_LONG[w]} ${s.label}`)}</td>`).join('')}<td class="num">${stepper(`sh.${i}.plan.all`, s.plan[0], `Ingepland alle dagen ${s.label}`)}</td></tr>
          <tr><td class="rowlbl">Advies</td>${WD_SHORT.map((_, w) => { const a = sum.days[w].plan[i]; return `<td class="num"><b>${a}</b> ${diffChip(a - s.plan[w])}</td>`; }).join('')}<td></td></tr>`).join('')}
      </tbody></table></div>
    </section>`;

  // Dekking over de dag (gekozen weekdag)
  const dem = sum.dem[wd];
  const capNow = Array.from({ length: 96 }, (_, q) => capacityAt(shifts, shifts.map(s => s.plan[wd]), q));
  const capAdv = Array.from({ length: 96 }, (_, q) => capacityAt(shifts, sum.days[wd].plan, q));
  mkChart($('#ch-cover'), {
    type: 'line',
    data: {
      labels: Array.from({ length: 96 }, (_, q) => q),
      datasets: [
        { label: 'Capaciteit rooster', data: capNow, borderColor: c.accent, borderWidth: 2.5, pointRadius: 0, stepped: true, fill: false, order: 1 },
        { label: 'Tekort', data: dem.map((v, q) => Math.max(v, capNow[q])), borderWidth: 0, pointRadius: 0, fill: { target: 0, above: alpha(c.crit, 0.35), below: 'transparent' }, tension: 0.25, order: 3 },
        { label: `Vraag (${mLabel()})`, data: dem, borderColor: c.ink2, backgroundColor: alpha(c.ink2, 0.10), borderWidth: 1.5, pointRadius: 0, fill: 'origin', tension: 0.25, order: 2 },
        { label: 'Capaciteit advies', data: capAdv, borderColor: c.good, borderWidth: 2, borderDash: [5, 4], pointRadius: 0, stepped: true, fill: false, order: 0 },
      ],
    },
    options: {
      interaction: { mode: 'index', intersect: false },
      scales: { x: { grid: { display: false }, border: { color: c.axis }, ticks: { autoSkip: false, maxRotation: 0, callback: tickEveryTwoHours } }, y: { beginAtZero: true, grid: { color: c.grid }, border: { display: false }, title: { display: true, text: 'Patiënten', color: c.muted, font: { size: 11 } } } },
      plugins: { tooltip: { filter: it => it.dataset.label !== 'Tekort', callbacks: { title: it => `${WD_LONG[wd]} ${slotLabel(it[0].dataIndex)}`, label: it => ` ${it.dataset.label}: ${fmt(it.raw)}`, footer: it => { const q = it[0].dataIndex; const g = dem[q] - capNow[q]; return g > 1e-6 ? `Tekort: ${fmt(g)} patiënten` : `Ruimte: ${fmt(-g)} patiënten`; } } } },
    },
  });

  // advies − ingepland, per dag × dienst
  const cells = [];
  WD_SHORT.forEach((d, w) => shifts.forEach((s, i) => cells.push({ w, i, s, d, adv: sum.days[w].plan[i], cur: s.plan[w] })));
  const mid = Math.floor((shifts.length - 1) / 2);
  const labels = cells.map(x => (narrow() ? (x.i === mid ? x.d : '') : x.i === mid ? [shiftShort(x.s), x.d] : [shiftShort(x.s), '']));
  const diffs = cells.map(x => x.adv - x.cur);
  const lim = Math.max(2, ...diffs.map(Math.abs));
  mkChart($('#ch-staffdiff'), {
    type: 'bar',
    data: { labels, datasets: [{ label: 'Advies − ingepland', data: diffs.map(d => (d === 0 ? 0.06 : d)), backgroundColor: c.nurse, borderSkipped: false, barPercentage: 0.66, categoryPercentage: 0.9 }] },
    options: {
      scales: { x: { grid: { display: false }, border: { display: false }, ticks: { maxRotation: 0, autoSkip: false } }, y: { min: -lim - 1, max: lim + 1, grid: { color: ctx => (ctx.tick.value === 0 ? c.axis : c.grid), lineWidth: ctx => (ctx.tick.value === 0 ? 1.5 : 1) }, border: { display: false }, ticks: { precision: 0 } } },
      plugins: { dayBands: { size: shifts.length }, tooltip: { callbacks: { title: it => { const x = cells[it[0].dataIndex]; return `${WD_LONG[x.w]} · ${x.s.label} (${shiftSpan(x.s)})`; }, label: it => { const x = cells[it.dataIndex]; return [` Ingepland ${x.cur} · advies ${x.adv}`, ` Norm ${fmtRatio(x.s.ratio)}`]; } } } },
    },
  });
}

function viewStaffAll(el) {
  const rows = unitsOf().map((u, i) => {
    const comps = compsFor(u.id); if (!comps.length) return { u, i, empty: true };
    const fr = buildFrame(comps, S.filter); if (!fr || !fr.days.length) return { u, i, empty: true };
    return { u, i, sum: staffSummary(fr, u.id) };
  });
  const ok = rows.filter(r => !r.empty);
  const tot = ok.reduce((a, r) => ({ need: a.need + r.sum.need, plan: a.plan + r.sum.plan, fn: a.fn + r.sum.fteNeed, fp: a.fp + r.sum.ftePlan }), { need: 0, plan: 0, fn: 0, fp: 0 });
  el.innerHTML = `
    <div class="kpis">
      ${kpi('Diensten per week ingepland', kn(tot.plan, 0), '', 'alle afdelingen')}
      ${kpi('Advies per week', kn(tot.need, 0), 'diensten', `norm ${mLabel()}`, statusPill(tot.need > tot.plan ? 'crit' : 'good', tot.need > tot.plan ? `${tot.need - tot.plan} erbij nodig` : 'Gedekt'))}
      ${kpi('FTE ingepland', kn(tot.fp), 'FTE', `bij ${S.fteHours} uur per FTE`)}
      ${kpi('FTE advies', kn(tot.fn), 'FTE', `verschil ${tot.fp - tot.fn >= 0 ? '+' : ''}${fmt(tot.fp - tot.fn)} FTE`)}
    </div>
    <section class="panel stagger">
      <div class="panel-head"><div><h2>Diensten per week, per afdeling</h2><div class="desc">Elke afdeling rekent met haar eigen diensten, normen en rooster (instellen in het tabblad van de afdeling).</div></div></div>
      <div class="chart-box short"><canvas id="ch-staffall" role="img" aria-label="Diensten per afdeling"></canvas></div>
      <div class="legend"><span><i class="sw" style="background:var(--axis)"></i>Ingepland</span><span><i class="sw" style="background:var(--s1)"></i>Advies</span></div>
      <div class="table-wrap" style="margin-top:12px"><table class="data" data-name="Inzet per afdeling"><thead><tr><th>Afdeling</th><th>Diensten</th><th class="num">Ingepland</th><th class="num">Advies</th><th class="num">Tijd onderbezet</th><th class="num">FTE ingepland</th><th class="num">FTE advies</th></tr></thead><tbody>
        ${rows.map(r => r.empty ? `<tr><td><span class="cell-name"><i class="sw" style="background:var(--s${r.i + 1})"></i>${esc(r.u.label)}</span></td><td colspan="6" style="color:var(--muted)">Geen data geladen</td></tr>` : `<tr><td><span class="cell-name"><i class="sw" style="background:var(--s${r.i + 1})"></i>${esc(r.u.label)}</span></td>
          <td>${r.sum.shifts.map(s => `${esc(s.label)} <span class="mono" style="color:var(--muted)">${fmtRatio(s.ratio)}</span>`).join(' · ')}</td>
          <td class="num">${r.sum.plan}</td><td class="num"><b>${r.sum.need}</b> <span class="diff ${r.sum.need > r.sum.plan ? 'pos' : r.sum.need < r.sum.plan ? 'neg' : 'zero'}">${r.sum.need - r.sum.plan > 0 ? '+' : ''}${r.sum.need - r.sum.plan}</span></td>
          <td class="num">${fmt(r.sum.shortPct)}%</td><td class="num">${fmt(r.sum.ftePlan)}</td><td class="num">${fmt(r.sum.fteNeed)}</td></tr>`).join('')}
      </tbody></table></div>
    </section>`;
  const c = C();
  mkChart($('#ch-staffall'), {
    type: 'bar',
    data: {
      labels: ok.map(r => r.u.label),
      datasets: [
        { label: 'Ingepland', data: ok.map(r => r.sum.plan), backgroundColor: c.axis, barPercentage: 0.7, categoryPercentage: 0.6 },
        { label: 'Advies', data: ok.map(r => r.sum.need), backgroundColor: c.series[0], barPercentage: 0.7, categoryPercentage: 0.6 },
      ],
    },
    options: { indexAxis: 'y', scales: { x: { beginAtZero: true, grid: { color: c.grid }, border: { display: false } }, y: { grid: { display: false }, border: { color: c.axis } } }, plugins: { tooltip: { callbacks: { label: it => ` ${it.dataset.label}: ${it.raw} diensten per week` } } } },
  });
}

boot();
</script>
</body>
</html>
