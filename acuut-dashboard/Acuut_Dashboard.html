<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Acuut Capaciteitsdashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: klinische regiekamer — vaste app-balk met stappen, daaronder
   locatie-tabs (zoals het Slingeland-dashboard), weergave-tabs, één
   filterstrook, en een raster van panelen. Rustig koel-grijs, marineblauw
   als accent; kleur in grafieken is uitsluitend data. */
:root {
  --bg: #f3f5f8;
  --surface: #ffffff;
  --surface-2: #f7f8fb;
  --ink: #0f1a2b;
  --ink-2: #47536a;
  --muted: #7d8799;
  --line: #e1e5ec;
  --line-strong: #c9d0dc;
  --accent: #1f3c6e;
  --accent-ink: #ffffff;
  --accent-soft: #e7eefa;
  --focus: #2a78d6;
  --grid: #e8ebf0;
  --axis: #c3c9d4;
  --good: #0a8a0a; --good-soft: #e5f4e5;
  --warn: #b77a00; --warn-soft: #fdf3dc;
  --crit: #c93535; --crit-soft: #fbe7e7;
  /* Kleuren zoals het Slingeland-dashboard: marine (spoed/huidig), lichtblauw (electief/nieuw), daarna vlak gehouden tinten */
  --s1: #1f3c6e; --s2: #5f9de6; --s3: #a9c9f1; --s4: #2a8c8c; --s5: #d09a1e; --s6: #a3367e; --s7: #6d7b93; --s8: #7a5fb0;
  --gone: #c3c9d3; --nurse: #b0307a;
  --div-pos: #d03b3b; --div-neg: #2a78d6;
  --seq-0: #f1f6fd; --seq-1: #cde2fb; --seq-2: #9ec5f4; --seq-3: #6da7ec; --seq-4: #3987e5; --seq-5: #256abf; --seq-6: #184f95; --seq-7: #0d366b;
  --heat-0: #fdf1ea; --heat-1: #fbd9c6; --heat-2: #f6b292; --heat-3: #ee8a5d; --heat-4: #d9622f; --heat-5: #a8441b;
  --shadow: 0 1px 2px rgba(15, 26, 43, .05), 0 4px 16px rgba(15, 26, 43, .04);
  --font-ui: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-display: 'IBM Plex Sans Condensed', 'IBM Plex Sans', system-ui, sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  --r: 6px;
  --tri-rood: #d03b3b; --tri-oranje: #ec7a3c; --tri-geel: #e0a000; --tri-groen: #1f9a4a; --tri-blauw: #2a78d6; --tri-overige: #8a919e;
  /* Beweging: sterke ease-out voor binnenkomen, ease-in-out voor verschuiven */
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1118; --surface: #141a23; --surface-2: #19202b; --ink: #edf1f7; --ink-2: #b4bdcc; --muted: #8590a3;
    --line: #262f3c; --line-strong: #364152; --accent: #7fa8ee; --accent-ink: #0c1118; --accent-soft: #1b2a44; --focus: #7fa8ee;
    --grid: #222a36; --axis: #3a4555;
    --good: #2bb52b; --good-soft: #13281a; --warn: #e3a51c; --warn-soft: #2d2410; --crit: #ec6a6a; --crit-soft: #351919;
    --s1: #8fb6ef; --s2: #4b80cf; --s3: #2c5590; --s4: #2fa3a3; --s5: #d9a536; --s6: #d0589c; --s7: #8a98af; --s8: #9d85d6; --gone: #4a5361; --nurse: #d0589c;
    --div-pos: #e66767; --div-neg: #3987e5;
    --seq-0: #16202d; --seq-1: #13294a; --seq-2: #173a68; --seq-3: #1c5cab; --seq-4: #2a78d6; --seq-5: #5598e7; --seq-6: #86b6ef; --seq-7: #cde2fb;
    --heat-0: #241a16; --heat-1: #4a2616; --heat-2: #7a3518; --heat-3: #b34a1d; --heat-4: #e06a33; --heat-5: #f6a27a;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c1118; --surface: #141a23; --surface-2: #19202b; --ink: #edf1f7; --ink-2: #b4bdcc; --muted: #8590a3;
  --line: #262f3c; --line-strong: #364152; --accent: #7fa8ee; --accent-ink: #0c1118; --accent-soft: #1b2a44; --focus: #7fa8ee;
  --grid: #222a36; --axis: #3a4555;
  --good: #2bb52b; --good-soft: #13281a; --warn: #e3a51c; --warn-soft: #2d2410; --crit: #ec6a6a; --crit-soft: #351919;
  --s1: #8fb6ef; --s2: #4b80cf; --s3: #2c5590; --s4: #2fa3a3; --s5: #d9a536; --s6: #d0589c; --s7: #8a98af; --s8: #9d85d6; --gone: #4a5361; --nurse: #d0589c;
  --div-pos: #e66767; --div-neg: #3987e5;
  --seq-0: #16202d; --seq-1: #13294a; --seq-2: #173a68; --seq-3: #1c5cab; --seq-4: #2a78d6; --seq-5: #5598e7; --seq-6: #86b6ef; --seq-7: #cde2fb;
  --heat-0: #241a16; --heat-1: #4a2616; --heat-2: #7a3518; --heat-3: #b34a1d; --heat-4: #e06a33; --heat-5: #f6a27a;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4); color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 14px/1.5 var(--font-ui); -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
.num, td.num, .mono { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--font-mono); }
[hidden] { display: none !important; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }

/* ── App-balk ─────────────────────────────────────────────── */
.appbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30;
  display: flex; align-items: center; gap: 24px; flex-wrap: wrap;
  padding: 10px clamp(16px, 3vw, 32px); background: var(--surface); border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand-mark { width: 28px; height: 28px; border-radius: 6px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; flex: none; }
.brand-mark svg { width: 16px; height: 16px; }
.brand-text { line-height: 1.15; }
.brand-eyebrow { font-size: 11px; color: var(--muted); letter-spacing: .04em; }
.brand-title { font-weight: 600; font-size: 15px; }
.stepper { display: flex; align-items: center; gap: 4px; margin-left: auto; flex-wrap: wrap; }
.step { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 999px; border: 0; background: none; color: var(--muted); font-size: 13px; }
.step .dot { width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid var(--line-strong); display: grid; place-items: center; font-size: 11px; font-weight: 600; }
.step.done { color: var(--ink-2); }
.step.done .dot { background: var(--accent-soft); border-color: transparent; color: var(--accent); }
.step.active { color: var(--ink); font-weight: 600; background: var(--accent-soft); }
.step.active .dot { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.step:disabled { cursor: default; opacity: .6; }
.step-sep { width: 16px; height: 1px; background: var(--line-strong); }
.appbar-actions { display: flex; gap: 8px; align-items: center; }
.icon-btn { width: 32px; height: 32px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; color: var(--ink-2); }
.icon-btn:hover { border-color: var(--line-strong); color: var(--ink); }
.icon-btn svg { width: 16px; height: 16px; }

.wrap { max-width: 1480px; margin: 0 auto; padding-inline: clamp(16px, 3vw, 32px); padding-block: 24px 64px; }

/* ── Startscherm ──────────────────────────────────────────── */
.start { display: grid; gap: 28px; padding-top: 3vh; }
.start-head { max-width: 680px; }
.eyebrow { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
.start-head h1 { font: 600 clamp(28px, 4vw, 40px)/1.1 var(--font-display); letter-spacing: -.01em; margin-top: 6px; }
.start-head p { color: var(--ink-2); font-size: 15px; margin: 10px 0 0; max-width: 62ch; }
.mode-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
.mode-card {
  text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 22px;
  display: grid; gap: 14px; transition: border-color .15s, box-shadow .15s, transform .15s; box-shadow: var(--shadow);
}
.mode-card:hover { border-color: var(--accent); transform: translateY(-1px); }
.mode-card h2 { font: 600 24px/1.15 var(--font-display); }
.mode-card p { margin: 0; color: var(--ink-2); max-width: 52ch; }
.mode-units { display: flex; flex-wrap: wrap; gap: 8px; }
.unit-pill { border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; background: var(--surface-2); min-width: 0; }
.unit-pill b { display: block; font-size: 13px; }
.unit-pill span { display: block; font-size: 11.5px; color: var(--muted); }
.mode-go { font-weight: 600; color: var(--accent); display: flex; align-items: center; gap: 6px; }
.start-steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; color: var(--ink-2); font-size: 13px; }
.start-steps div { border-top: 2px solid var(--line-strong); padding-top: 10px; }
.start-steps b { display: block; color: var(--ink); font-size: 13.5px; margin-bottom: 2px; }

/* ── Data inladen ─────────────────────────────────────────── */
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
.page-head h1 { font: 600 28px/1.15 var(--font-display); margin-top: 4px; }
.page-head p { margin: 6px 0 0; color: var(--ink-2); max-width: 70ch; }
.btn { display: inline-flex; align-items: center; gap: 8px; border-radius: var(--r); padding: 8px 14px; border: 1px solid var(--line-strong); background: var(--surface); font-weight: 500; font-size: 13.5px; white-space: nowrap; }
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); color: var(--accent-ink); }
.btn:disabled { opacity: .45; cursor: not-allowed; filter: none; }
.btn svg { width: 15px; height: 15px; }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
.dropzone {
  border: 1.5px dashed var(--line-strong); border-radius: 10px; background: var(--surface); padding: 22px;
  display: flex; align-items: center; gap: 18px; flex-wrap: wrap; transition: border-color .15s, background .15s;
}
.dropzone.over { border-color: var(--accent); background: var(--accent-soft); }
.dropzone .dz-icon { width: 44px; height: 44px; border-radius: 10px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; flex: none; }
.dropzone .dz-icon svg { width: 22px; height: 22px; }
.dropzone .dz-text { flex: 1 1 260px; min-width: 0; }
.dropzone b { font-size: 15px; }
.dropzone p { margin: 2px 0 0; color: var(--ink-2); font-size: 13px; }
.load-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; margin-top: 18px; }
.load-unit { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.load-unit-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; padding: 14px 16px 10px; border-bottom: 1px solid var(--line); }
.load-unit-head h3 { font-size: 15px; }
.load-unit-head span { font-size: 12px; color: var(--muted); }
.slot { display: grid; grid-template-columns: 10px 1fr auto; align-items: center; gap: 10px; padding: 11px 16px; border-bottom: 1px solid var(--line); }
.slot:last-child { border-bottom: 0; }
.slot .sw { width: 10px; height: 10px; border-radius: 3px; }
.slot-name { font-weight: 500; font-size: 13.5px; }
.slot-meta { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.slot-meta.ok { color: var(--ink-2); }
.slot-body { min-width: 0; }
.slot-actions { display: flex; gap: 6px; align-items: center; }
.tag { font-size: 11px; font-weight: 500; padding: 2px 7px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); color: var(--ink-2); white-space: nowrap; }
.tag.ok { background: var(--good-soft); color: var(--good); border-color: transparent; }
.tag.demo { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.link-btn { border: 0; background: none; color: var(--accent); font-size: 12.5px; font-weight: 500; padding: 4px 6px; border-radius: 4px; }
.link-btn:hover { background: var(--accent-soft); }
.link-btn.danger { color: var(--muted); }
.link-btn.danger:hover { color: var(--crit); background: var(--crit-soft); }
.load-foot { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; margin-top: 20px; padding: 16px 18px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.load-foot p { margin: 0; color: var(--ink-2); }
.unmatched { margin-top: 14px; background: var(--warn-soft); border-radius: 8px; padding: 12px 14px; display: grid; gap: 8px; font-size: 13px; }
.unmatched-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.unmatched-row code { font-family: var(--font-mono); font-size: 12px; overflow-wrap: anywhere; }
select, input[type="number"], input[type="time"] { background: var(--surface); border: 1px solid var(--line-strong); border-radius: 5px; padding: 5px 8px; font-size: 13px; }
.toast { position: fixed; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--surface); padding: 10px 16px; border-radius: 8px; font-size: 13px; z-index: 60; box-shadow: var(--shadow); max-width: calc(100% - 32px); }

/* ── Dashboard ────────────────────────────────────────────── */
.dash-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 14px; }
.dash-head h1 { font: 600 26px/1.15 var(--font-display); }
.dash-head .sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
.loc-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.loc-label { font-weight: 600; font-size: 13px; }
.seg { display: inline-flex; background: var(--surface-2); border: 1px solid var(--line); border-radius: 7px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: none; padding: 6px 14px; border-radius: 5px; font-weight: 500; font-size: 13.5px; color: var(--ink-2); display: flex; align-items: center; gap: 6px; }
.seg button:hover { color: var(--ink); background: var(--surface); }
.seg button.on { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: 0 0 0 1px var(--line-strong), 0 1px 2px rgba(0,0,0,.06); }
.seg button .cnt { font-size: 11px; color: var(--muted); font-weight: 500; }
.seg button.empty { opacity: .55; }
.seg.small button { padding: 4px 10px; font-size: 12.5px; }

.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin: 16px 0 0; overflow-x: auto; scrollbar-width: none; }
.tabs button { border: 0; background: none; padding: 10px 14px; font-weight: 500; color: var(--ink-2); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; font-size: 14px; }
.tabs button:hover { color: var(--ink); }
.tabs button.on { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }

.filters {
  position: sticky; top: calc(53px + env(safe-area-inset-top, 0px)); z-index: 20;
  display: flex; gap: 10px 22px; align-items: center; flex-wrap: wrap;
  padding: 10px 0; background: var(--bg); border-bottom: 1px solid var(--line); margin-bottom: 18px;
}
.f-group { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-width: 0; }
.f-label { font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; font-weight: 500; }
.chip {
  display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line-strong); background: var(--surface);
  border-radius: 999px; padding: 4px 11px 4px 9px; font-size: 13px; font-weight: 500; color: var(--ink);
}
.chip .sw { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.chip.off { color: var(--muted); background: transparent; border-style: dashed; }
.chip.off .sw { opacity: .3; }
.chip:disabled { cursor: not-allowed; opacity: .5; }

.grid { display: grid; gap: 16px; }
.g-2 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 460px), 1fr)); }
.g-3-1 { grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); }
@media (max-width: 1000px) { .g-3-1 { grid-template-columns: minmax(0, 1fr); } }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 16px 18px; min-width: 0; }
.panel-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
.panel-head h2 { font-size: 15px; font-weight: 600; }
.panel-head .desc { font-size: 12.5px; color: var(--muted); margin-top: 2px; max-width: 70ch; }
.chart-box { position: relative; height: 300px; }
.chart-box.tall { height: 360px; }
.chart-box.short { height: 220px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12.5px; color: var(--ink-2); margin-top: 10px; align-items: center; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend .sw { width: 10px; height: 10px; border-radius: 3px; }
.legend .ln { width: 16px; height: 0; border-top: 2px dashed var(--ink); }
.legend .ln.solid { border-top-style: solid; }
.legend .wh { width: 10px; height: 12px; border: solid var(--ink-2); border-width: 1.5px 0; position: relative; }
.legend .wh::after { content: ''; position: absolute; left: 4px; top: 0; bottom: 0; border-left: 1.5px solid var(--ink-2); }
.legend .sep { width: 1px; height: 14px; background: var(--line-strong); }
.legend .key b { color: var(--ink); font-weight: 600; }

/* KPI-tegels */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 16px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 14px 16px; display: grid; gap: 4px; align-content: start; }
.kpi-label { font-size: 12px; color: var(--ink-2); font-weight: 500; }
.kpi-val { font: 600 28px/1.1 var(--font-display); letter-spacing: -.01em; }
.kpi-val small { font: 500 13px var(--font-ui); color: var(--muted); margin-left: 3px; letter-spacing: 0; }
.kpi-sub { font-size: 12px; color: var(--muted); }
.status { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; width: fit-content; }
.status svg { width: 12px; height: 12px; }
.status.good { background: var(--good-soft); color: var(--good); }
.status.warn { background: var(--warn-soft); color: var(--warn); }
.status.crit { background: var(--crit-soft); color: var(--crit); }

/* Tabellen */
.table-wrap { overflow-x: auto; margin: 0 -2px; }
table.data { width: 100%; border-collapse: collapse; font-size: 13px; }
table.data th { text-align: left; font-weight: 500; font-size: 12px; color: var(--muted); padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.data td { padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
table.data tr:last-child td { border-bottom: 0; }
table.data th.num, table.data td.num { text-align: right; }
table.data tr.sub td { color: var(--ink-2); }
table.data tr.total td { font-weight: 600; border-top: 1px solid var(--line-strong); }
table.data tbody tr:hover td { background: var(--surface-2); }
.cell-name { display: flex; align-items: center; gap: 8px; font-weight: 500; white-space: nowrap; }
.cell-name .sw { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.diff { display: inline-block; min-width: 34px; text-align: center; font-weight: 600; font-size: 12px; padding: 2px 6px; border-radius: 4px; }
.diff.pos { background: var(--crit-soft); color: var(--crit); }
.diff.neg { background: var(--accent-soft); color: var(--accent); }
.diff.zero { background: var(--good-soft); color: var(--good); }
.stepper-input { display: inline-flex; align-items: center; border: 1px solid var(--line-strong); border-radius: 5px; overflow: hidden; background: var(--surface); }

/* Stroomkaarten */
.stream-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: 12px; margin-bottom: 16px; }
.s-card { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 14px 16px 10px; text-align: left; display: grid; gap: 8px; transition: border-color .15s, box-shadow .15s; }
.s-card:hover { border-color: var(--line-strong); }

.s-card-head { display: flex; align-items: center; gap: 8px; justify-content: space-between; }

.s-card-name .sw { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.s-card-nums { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.s-card-nums div { display: grid; }
.s-card-nums span { font-size: 11px; color: var(--muted); }

.share { display: flex; align-items: center; gap: 8px; font-size: 11.5px; color: var(--muted); }
.share-bar { flex: 1; height: 4px; background: var(--grid); border-radius: 2px; overflow: hidden; }

.heat .hh { color: var(--muted); text-align: center; font-size: 10px; padding-bottom: 2px; }

.heat .c:hover { outline: 2px solid var(--ink); outline-offset: 0; z-index: 1; }
.heat-scale { display: flex; align-items: center; gap: 8px; font-size: 11.5px; color: var(--muted); margin-top: 10px; }
.heat-scale .ramp { display: flex; height: 8px; width: 160px; border-radius: 2px; overflow: hidden; }

/* Instellingen */
.settings { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
.set { display: grid; gap: 4px; }

.insights { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
.insights li { display: grid; grid-template-columns: 20px 1fr; gap: 8px; font-size: 13px; color: var(--ink-2); align-items: start; }

.insights .ic.warn { background: var(--warn-soft); color: var(--warn); }
.insights .ic.crit { background: var(--crit-soft); color: var(--crit); }

.empty-state { background: var(--surface); border: 1px dashed var(--line-strong); border-radius: 10px; padding: 40px 24px; text-align: center; display: grid; gap: 10px; justify-items: center; color: var(--ink-2); }

.strip { display: grid; grid-template-columns: 54px repeat(52, minmax(0, 1fr)); gap: 2px; min-width: 760px; font-size: 10.5px; }
.strip .sl { color: var(--ink-2); font-weight: 500; display: flex; align-items: center; font-size: 12px; }

.strip .sc:hover { outline: 2px solid var(--ink); }

.chart-tip { font-size: 12px; }

@media (max-width: 640px) {

  .chart-box { height: 260px; }
}


/* ════ Beweging ═════════════════════════════════════════════════════ */
/* Indrukken: directe bevestiging dat de klik is gezien. */
.btn, .chip, .seg button, .icon-btn, .step, .tabs button, .s-card, .mode-card, .link-btn, .stepper-input button, .vstep button, .strip .sc {
  transition: transform 160ms var(--ease-out), background-color 160ms ease, border-color 160ms ease, color 160ms ease, box-shadow 160ms ease, opacity 160ms ease;
}
.btn:active, .chip:active, .seg button:active, .icon-btn:active, .step:active, .link-btn:active, .stepper-input button:active, .vstep button:active { transform: scale(0.97); }

@media (hover: hover) and (pointer: fine) {

}
.mode-card:hover { transform: none; }
@media (hover: hover) and (pointer: fine) { .mode-card:hover { transform: translateY(-2px); } }

/* Binnenkomen van een weergave: gestaffeld, kort, vanaf een zichtbare rust. */
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
#screen.enter .stagger { animation: rise 320ms var(--ease-out) both; }
#screen.enter .stagger:nth-child(2) { animation-delay: 40ms; }

#screen.enter .stagger:nth-child(4) { animation-delay: 120ms; }
#screen.enter .stagger:nth-child(5) { animation-delay: 160ms; }

/* Schuivende indicator onder segmentknoppen en tabs. */
.seg, .tabs { position: relative; }
.seg .ind { position: absolute; left: 0; top: 0; border-radius: 5px; background: var(--surface); box-shadow: 0 0 0 1px var(--line-strong), 0 1px 2px rgba(0,0,0,.06); z-index: 0;
  transition: transform 260ms var(--ease-in-out), width 260ms var(--ease-in-out), height 260ms var(--ease-in-out); pointer-events: none; }

  transition: transform 260ms var(--ease-in-out), width 260ms var(--ease-in-out); }
.tabs.has-ind > button.on { border-bottom-color: transparent; }

/* Toast: komt van onder en gaat via dezelfde weg terug. */
.toast { transition: transform 300ms var(--ease-out), opacity 200ms ease; }
.toast.out { transform: translate(-50%, 16px); opacity: 0; pointer-events: none; }

/* Bezig met inlezen: dunne lopende balk bovenin. */

.appbar::after { content: ''; position: absolute; left: 0; bottom: -1px; height: 2px; width: 40%; background: var(--accent); opacity: 0; transition: opacity 200ms ease; }
body.busy .appbar::after { opacity: 1; animation: slide 1.1s linear infinite; }
.appbar { overflow: hidden; }
@keyframes spin { to { transform: rotate(360deg); } }
.spinner { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line-strong); border-top-color: var(--accent); animation: spin 700ms linear infinite; display: inline-block; }

@media (prefers-reduced-motion: reduce) {
  #screen.enter .stagger { animation: fade 200ms ease both; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  .btn:active, .chip:active, .seg button:active, .s-card:active, .mode-card:active { transform: none; }
  .seg .ind, .tabs .ind { transition: none; }
  body.busy .appbar::after { animation: none; opacity: .6; width: 100%; }
}

/* ════ Data inladen: categorieën en tegels ══════════════════════════ */
.cat { margin-top: 26px; }

.tile.add { border-style: dashed; }

.btn.small { padding: 5px 10px; font-size: 12.5px; }

/* ════ Stromen in de filterstrook + kiezer ══════════════════════════ */
.chip .x { color: var(--muted); font-size: 14px; line-height: 1; margin-left: 2px; }
@media (hover: hover) and (pointer: fine) { .chip:hover .x { color: var(--crit); } }

.picker {
  position: fixed; z-index: 50; background: var(--surface); border: 1px solid var(--line-strong); border-radius: 10px;
  box-shadow: 0 12px 32px rgba(15, 26, 43, .16), 0 2px 6px rgba(15, 26, 43, .06); max-height: min(560px, calc(100vh - 120px)); display: flex; flex-direction: column;

@media (hover: hover) and (pointer: fine) { .pick:hover { background: var(--surface-2); } }
.pick input { accent-color: var(--accent); width: 15px; height: 15px; margin: 0; }

/* ════ JDT ═════════════════════════════════════════════════════════ */

/* ════ Bandbreedte per stroom ══════════════════════════════════════ */
.band-head { margin-bottom: 12px; }

/* ════ Afspelen ═════════════════════════════════════════════════════ */
.btn.play { gap: 6px; }

<script>
/* ════════════════════════════════════════════════════════════════════
   CONFIGURATIE — alle databestanden die het dashboard kan inladen
   (dezelfde set als het oorspronkelijke Acuut Dashboard), de afdelingen
   en de twee omgevingen (Oudbouw / Nieuwbouw).
   ════════════════════════════════════════════════════════════════════ */

// Soorten bestanden:
//   bez — bezetting: per dag een rij, kolom "Datum" + 96 kwartierkolommen

// streamId -> { fileName, source: 'bestand'|'voorbeeld'|'synthetisch', days: Map(date -> Float32Array(96)) }
const STORE = {};

/* ── Hulpfuncties datum ─────────────────────────────────────────────── */
const pad2 = n => String(n).padStart(2, '0');
const ymd = (y, m, d) => `${y}-${pad2(m)}-${pad2(d)}`;
function dateParts(ds) { return { y: +ds.slice(0, 4), m: +ds.slice(5, 7), d: +ds.slice(8, 10) }; }
function utcDate(ds) { const p = dateParts(ds); return new Date(Date.UTC(p.y, p.m - 1, p.d)); }
function addDays(ds, n) { const d = utcDate(ds); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
function weekdayOf(ds) { return (utcDate(ds).getUTCDay() + 6) % 7; } // 0 = maandag
function isoWeek(ds) {
  const d = utcDate(ds); const day = (d.getUTCDay() + 6) % 7;
  d.setUTCDate(d.getUTCDate() - day + 3);
  const isoYear = d.getUTCFullYear();
  const jan4 = new Date(Date.UTC(isoYear, 0, 4));
  const week = 1 + Math.round(((d - jan4) / 86400000 - 3 + ((jan4.getUTCDay() + 6) % 7)) / 7);
  return { isoYear, week };
}
function isoWeekMonday(isoYear, week) {
  const jan4 = new Date(Date.UTC(isoYear, 0, 4));
  const mon = new Date(jan4); mon.setUTCDate(jan4.getUTCDate() - ((jan4.getUTCDay() + 6) % 7) + (week - 1) * 7);
  return mon.toISOString().slice(0, 10);
}
function fmtDay(ds) { const p = dateParts(ds); return `${WD_SHORT[weekdayOf(ds)]} ${p.d} ${MONTH_SHORT[p.m - 1]}`; }
const slotLabel = q => `${pad2(Math.floor(q / 4))}:${pad2((q % 4) * 15)}`;

/* ── Excel inlezen ──────────────────────────────────────────────────── */
// Herkent een kwartierkolom in de kop: Excel-tijd (0..1), "H:MM(:SS)" of een Date.
function headerToSlot(h) {
  let mins = null;
  if (typeof h === 'number' && h >= 0 && h < 1) mins = Math.round(h * 1440);
  else if (h instanceof Date) mins = h.getUTCHours() * 60 + h.getUTCMinutes();
  else if (typeof h === 'string') {
    const m = h.trim().match(/^(\d{1,2}):(\d{2})(?::\d{2})?$/);
    if (m) mins = +m[1] * 60 + +m[2];
  }
  if (mins == null || mins % 15 !== 0 || mins >= 1440) return null;
  return mins / 15;
}
// Datumcel → 'YYYY-MM-DD'. Excel-serienummer, Date, ISO, D-M-YYYY of M/D/YYYY.
function cellToDate(v) {
  if (v == null || v === '') return null;
  if (typeof v === 'number') {
    const p = XLSX.SSF.parse_date_code(v);
    return p && p.y > 1900 ? ymd(p.y, p.m, p.d) : null;
  }
  if (v instanceof Date) return isNaN(v) ? null : ymd(v.getFullYear(), v.getMonth() + 1, v.getDate());
  const s = String(v).trim();
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (m) return ymd(+m[1], +m[2], +m[3]);
  m = s.match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{2,4})/);
  if (m) {
    let a = +m[1], b = +m[2], y = +m[3]; if (y < 100) y += 2000;
    // Met "/" is de Excel-export Amerikaans (M/D); met "-" of "." Nederlands (D-M).
    const usa = s.includes('/') && a <= 12;
    const [mo, d] = usa ? [a, b] : [b, a];
    return ymd(y, mo, d);
  }
  return null;
}
const toNum = v => {
  if (v == null || v === '') return NaN;
  return typeof v === 'number' ? v : parseFloat(String(v).replace(',', '.'));
};

function parseWorkbookFrom(wb, fileName) {
  const candidates = [
    ...wb.SheetNames.filter(n => /brongegevens/i.test(n)),
    ...wb.SheetNames.filter(n => /bron|blad|sheet/i.test(n)),
    ...wb.SheetNames,
  ];
  for (const name of [...new Set(candidates)]) {
    const grid = XLSX.utils.sheet_to_json(wb.Sheets[name], { header: 1, raw: true, defval: null });
    const res = parseGrid(grid);
    if (res) return { ...res, sheet: name, fileName };
  }
  throw new Error('Geen blad gevonden met een kolom "Datum" en kwartierkolommen (00:00 … 23:45).');
}

function parseGrid(grid) {
  let hr = -1;
  for (let r = 0; r < Math.min(grid.length, 40); r++) {
    const row = grid[r] || [];
    if (row.some(c => typeof c === 'string' && c.trim().toLowerCase() === 'datum')) { hr = r; break; }
  }
  if (hr < 0) return null;

    if (!(w52 in histStats)) histStats[w52] = hist[w52] ? stats(hist[w52]) : null;
    const h = histStats[w52];
    return { week, isoYear, monday, val, avg: h ? h.avg : null, max: h ? h.max : null, p10: h ? h.p10 : null, vacation: vacationOf(week), season: seasonal(w52), future: dw > 0 };
  };
  return { at, lastMonday, lastWeek: lastW, slopePerYear: slope * 52, nWeeks: list.length, years: [...new Set(list.map(w => w.isoYear))], seasonal };
}

/* ════════════════════════════════════════════════════════════════════
   GRAFIEKEN — Chart.js met thema-kleuren uit de CSS-tokens en twee

   ════════════════════════════════════════════════════════════════════ */
let CHARTS = [];

}
function alpha(hex, a) {

}
const fmt = (v, d = 1) => v == null || isNaN(v) ? '—' : v.toLocaleString('nl-NL', { minimumFractionDigits: d, maximumFractionDigits: d });

function applyChartDefaults() {
  const c = C();

  Chart.defaults.font.size = 11.5;
  Chart.defaults.color = c.muted;
  Chart.defaults.borderColor = c.grid;
  // Korte, sterke ease-out: nieuwe staven groeien vanaf de basislijn, bij een
  // filterwijziging morphen ze naar de nieuwe waarde. Kleuren niet animeren.
  Chart.defaults.animation.duration = REDUCED() ? 0 : 320;

  Chart.defaults.animations.colors = false;

    usePointStyle: true,

// Spreiding per categorie: verticale streep met dopjes van lo naar hi.
const whiskerPlugin = {
  id: 'whiskers',
  afterDatasetsDraw(chart, _args, opts) {
    if (!opts || !opts.data) return;
    const { ctx, scales: { x, y } } = chart;
    ctx.save(); ctx.strokeStyle = opts.color || C().ink2; ctx.lineWidth = 1.5;
    opts.data.forEach((w, i) => {
      if (!w || w.lo == null || w.hi == null) return;
      const px = x.getPixelForValue(i), y1 = y.getPixelForValue(w.lo), y2 = y.getPixelForValue(w.hi);
      const cap = Math.min(6, (x.width / opts.data.length) * 0.18);
      ctx.beginPath(); ctx.moveTo(px, y1); ctx.lineTo(px, y2);
      ctx.moveTo(px - cap, y1); ctx.lineTo(px + cap, y1); ctx.moveTo(px - cap, y2); ctx.lineTo(px + cap, y2);
      ctx.stroke();
    });
    ctx.restore();
  },
};
// Horizontale gestippelde capaciteitslijn met label ("10 open bedden").
const capLinePlugin = {
  id: 'capLine',
  afterDatasetsDraw(chart, _args, opts) {
    if (!opts || opts.value == null) return;
    const { ctx, chartArea: a, scales: { y } } = chart;
    const py = y.getPixelForValue(opts.value);
    if (py < a.top - 1 || py > a.bottom + 1) return;
    const c = C();
    ctx.save(); ctx.strokeStyle = c.ink; ctx.lineWidth = 1.5; ctx.setLineDash([5, 4]);
    ctx.beginPath(); ctx.moveTo(a.left, py); ctx.lineTo(a.right, py); ctx.stroke();
    if (opts.label) {
      ctx.setLineDash([]); ctx.font = "600 11.5px 'IBM Plex Sans', system-ui, sans-serif";
      const w = ctx.measureText(opts.label).width;
      ctx.fillStyle = c.surface; ctx.fillRect(a.right - w - 8, py - 17, w + 8, 14);
      ctx.fillStyle = c.ink; ctx.textAlign = 'right'; ctx.textBaseline = 'bottom'; ctx.fillText(opts.label, a.right - 2, py - 4);

};
// Lichte achtergrondbanden per dag zodat D/A/N-groepen leesbaar blijven.
const dayBandPlugin = {
  id: 'dayBands',
  beforeDatasetsDraw(chart, _args, opts) {
    if (!opts || !opts.size) return;
    const { ctx, chartArea: a, scales: { x } } = chart;
    const n = x.ticks.length; if (!n) return;
    const step = (x.getPixelForValue(1) - x.getPixelForValue(0)) || (a.width / n);
    ctx.save(); ctx.fillStyle = alpha(C().ink, 0.025);
    for (let g = 0; g * opts.size < n; g += 2) {
      const x0 = x.getPixelForValue(g * opts.size) - step / 2;
      ctx.fillRect(x0, a.top, step * opts.size, a.bottom - a.top);

    ctx.restore();
  },
};

// Lijnen "tekenen" zichzelf bij de eerste weergave: een wipe van links naar
// rechts (ease-out). Alleen bij binnenkomen; daarna morphen ze bij wijzigingen.
const REVEAL_MS = 900;
const revealPlugin = {
  id: 'reveal',

};
function withEntrance(config) {

  const types = [config.type, ...config.data.datasets.map(d => d.type)].filter(Boolean);
  const isLine = types.every(t => t === 'line');
  config.options = config.options || {};
  if (isLine) { config.options.animation = false; config.options.plugins = { ...(config.options.plugins || {}), reveal: { on: true } }; } // de wipe doet het werk
  else {

function mkChart(el, config) {
  if (!el) return null;
  const prev = takeStashed(el, config);
  if (prev) {
    // Zelfde grafiek, nieuwe stand: data vervangen zodat staven en lijnen morphen.
    prev.data.labels = config.data.labels;
    config.data.datasets.forEach((d, i) => {
      const t = prev.data.datasets[i];
      Object.keys(t).forEach(k => { if (!(k in d)) delete t[k]; });
      Object.assign(t, d);

/* ════════════════════════════════════════════════════════════════════
   BEWEGING — klein en functioneel:
   · grafieken morphen naar de nieuwe stand bij een filter (state indication)
   · schuivende indicator onder tabs en segmentknoppen (spatial consistency)
   · getallen in KPI-tegels tellen naar hun nieuwe waarde (state indication)
   · panelen komen gestaffeld binnen bij een andere weergave (geen harde sprong)
   Alles valt terug op direct tonen bij prefers-reduced-motion.
   ════════════════════════════════════════════════════════════════════ */

  const prev = STASH.get(el.id);
  if (!prev || prev.config.type !== config.type) return null;
  const sameShape = prev.data.datasets.length === config.data.datasets.length
    && prev.data.datasets.every((d, i) => (d.type || prev.config.type) === (config.data.datasets[i].type || config.type));
  if (!sameShape) return null;
  STASH.delete(el.id);

  el.parentElement.replaceWith(prev.canvas.parentElement);

}

/* ── Schuivende indicator ───────────────────────────────────────────── */
const IND_POS = new Map();
function placeIndicators(animate = true) {
  document.querySelectorAll('[data-ind]').forEach(group => {
    const key = group.dataset.ind;
    const on = group.querySelector(':scope > button.on');
    let ind = group.querySelector(':scope > .ind');
    if (!on) { if (ind) ind.remove(); IND_POS.delete(key); return; }
    if (!ind) { ind = document.createElement('i'); ind.className = 'ind'; ind.setAttribute('aria-hidden', 'true'); group.prepend(ind); }
    const pos = { x: on.offsetLeft, y: on.offsetTop, w: on.offsetWidth, h: on.offsetHeight };
    const prev = IND_POS.get(key);
    const apply = p => { ind.style.transform = `translate(${p.x}px, ${p.y}px)`; ind.style.width = p.w + 'px'; ind.style.height = p.h + 'px'; };
    if (animate && prev && !REDUCED() && (prev.x !== pos.x || prev.y !== pos.y || prev.w !== pos.w)) {
      ind.style.transition = 'none'; apply(prev); void ind.offsetWidth; ind.style.transition = ''; apply(pos);
    } else { ind.style.transition = 'none'; apply(pos); void ind.offsetWidth; ind.style.transition = ''; }
    IND_POS.set(key, pos);
  });

}

/* ── Tellende getallen ──────────────────────────────────────────────── */
const COUNT_PREV = new Map();
function countUp() {
  document.querySelectorAll('[data-count]').forEach(el => {
    const key = el.dataset.countKey, to = +el.dataset.count, dec = +el.dataset.dec || 0;
    const from = COUNT_PREV.get(key);
    COUNT_PREV.set(key, to);
    if (from == null || from === to || REDUCED() || !isFinite(from)) return;
    const fmtN = v => v.toLocaleString('nl-NL', { minimumFractionDigits: dec, maximumFractionDigits: dec });
    const t0 = performance.now(), dur = 420;
    const ease = t => 1 - Math.pow(1 - t, 3); // ease-out: snel reageren, rustig landen
    const tick = now => {
      const t = Math.min(1, (now - t0) / dur);
      el.textContent = fmtN(from + (to - from) * ease(t));
      if (t < 1 && el.isConnected) requestAnimationFrame(tick);
    };
    el.textContent = fmtN(from);
    requestAnimationFrame(tick);
  });
}

function afterRender() {
  placeIndicators(true);
  countUp();
}

let toastTimer = null;
function toast(msg) {
  let el = $('.toast');
  if (!el) { el = document.createElement('div'); el.className = 'toast out'; el.setAttribute('role', 'status'); document.body.appendChild(el); void el.offsetWidth; }
  el.textContent = msg; el.classList.remove('out');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.add('out'), 3800);
}
function setBusy(on) { document.body.classList.toggle('busy', on); }

function storeResult(key, res, fileName, source) {
  if (key === 'jdt') { if (res.kind !== 'jdt') throw new Error('Dit is geen JDT-bestand (tabblad "JDT aantal" ontbreekt).'); putJDT(res, source); S.jdtVpk = null; }
  else if (key === 'LOS') { if (res.kind !== 'grid') throw new Error('Een JDT-bestand kan geen losse analyse zijn.'); return addLoose(res.days, fileName, source); }
  else { if (res.kind !== 'grid') throw new Error('Dit bestand is een JDT-bestand.'); putStream(key, res.days, fileName, source); }
  return key;
}
async function readFiles(files, forcedKey) {
  const list = [...files]; if (!list.length) return;
  if (forcedKey && forcedKey !== 'LOS') S.loading.add(forcedKey);
  setBusy(true); render();
  await new Promise(r => setTimeout(r, 30));
  const done = [], failed = [];
  S.justLoaded = new Set();
  for (const f of list) {
    try {
      const res = readWorkbook(new Uint8Array(await f.arrayBuffer()), f.name);
      const key = forcedKey || (res.kind === 'jdt' ? 'jdt' : guessDataset(f.name));
      if (key) { const k = storeResult(key, res, f.name, 'bestand'); S.justLoaded.add(k); done.push(k); }
      else S.unmatched.push({ fileName: f.name, res });
    } catch (e) { failed.push(`${f.name}: ${e.message}`); }
  }
  S.loading.clear(); setBusy(false); render();
  if (failed.length) toast(`Niet ingelezen — ${failed.join(' · ')}`);
  else if (done.length) toast(`Ingelezen: ${done.map(k => (DS[k] ? DS[k].label : k)).join(', ')}`);
  else if (S.unmatched.length) toast('Kies hieronder wat het bestand is.');
}

async function loadSamples() {
  setBusy(true); toast('Voorbeelddata wordt geladen…');
  await new Promise(r => setTimeout(r, 30));
  let fromFile = 0;
  for (const path of SAMPLE_FILES) {
    try {
      const r = await fetch(path); if (!r.ok) throw new Error(r.status);
      const name = path.split('/').pop();
      const res = readWorkbook(new Uint8Array(await r.arrayBuffer()), name);
      const key = guessDataset(name);
      if (key && res.kind === 'grid') { putStream(key, res.days, name, 'voorbeeld'); fromFile++; }
    } catch (e) { /* bestand niet bereikbaar (bv. geopend via file://) → synthetisch */ }
  }
  const cache = {};
  S.justLoaded = new Set();
  DATASETS.filter(d => ['bez', 'tri', 'in'].includes(d.kind) && !STORE[d.key]).forEach(d => { putStream(d.key, demoDays(d.key, cache), 'Synthetische reeks', 'synthetisch'); S.justLoaded.add(d.key); });
  if (!STORE.jdt) { putJDT(generateJDT(mulberry32(99)), 'synthetisch'); S.justLoaded.add('jdt'); }
  setBusy(false); render();
  toast(fromFile ? `Voorbeeld geladen: ${fromFile} DUMMY-bestanden, overige bestanden synthetisch.` : 'Synthetische voorbeelddata geladen voor alle bestanden.');
}

/* ── Stromenkiezer (popover onder de knop "Stromen kiezen") ──────────── */
function renderPicker() {

    <div class="picker-body">
      ${groups.map(cat => `<div class="picker-group"><div class="picker-cat">${esc(CATS[cat].label)}</div>
        ${poolOf(u).filter(d => d.cat === cat).map(d => {
          const ok = !!STORE[d.key], on = sel.includes(d.key);
          return `<label class="pick ${ok ? '' : 'na'}">
            <input type="checkbox" data-pick="${d.key}" id="pick-${d.key}" ${on ? 'checked' : ''} ${ok ? '' : 'disabled'}>
            <i class="sw" style="background:var(--${colorFor(u, d.key)})"></i>
            <span class="pick-name">${esc(d.label)}</span>

}
function togglePick(key, on) {
  const u = unitDef(S.unit);
  const cur = selectedFor(u).slice();
  const next = on ? [...cur, key] : cur.filter(k => k !== key);
  // volgorde aanhouden zoals in de pool, zodat stapelingen stabiel blijven
  const order = poolOf(u).map(d => d.key);
  S.sel[u.id] = next.sort((a, b) => order.indexOf(a) - order.indexOf(b));
  saveSettings(); render();
  const cb = document.getElementById('pick-' + key); if (cb) cb.focus({ preventScroll: true });
}

// Paden als "beds", "minStaff", "sh.2.ratio", "sh.0.plan.3", "sh.1.start", "fteHours", "jdtvpk.7".
function setValue(path, raw) {
  const parts = path.split('.');
  if (parts[0] === 'fteHours') S.fteHours = Math.max(1, +String(raw).replace(',', '.') || 36);
  else if (parts[0] === 'jdtvpk') {
    const v = Math.max(0, Math.round(+raw || 0));
    if (parts[1] === 'all') S.jdtVpk = S.jdtVpk.map(x => Math.max(0, x + v)); else S.jdtVpk[+parts[1]] = v;
  } else {
    const c = cfgOf(S.unit);
    const num = () => +String(raw).replace(',', '.');
    if (parts[0] === 'beds') c.beds = Math.max(1, Math.round(num() || 1));
    else if (parts[0] === 'minStaff') c.minStaff = Math.max(0, Math.round(num() || 0));
    else if (parts[0] === 'sh') {
      const sh = c.shifts[+parts[1]]; if (!sh) return;
      const f = parts[2];
      if (f === 'label') sh.label = String(raw).trim().slice(0, 24) || 'Dienst';
      else if (f === 'ratio') sh.ratio = Math.max(0.5, Math.round((num() || 0.5) * 10) / 10);
      else if (f === 'start' || f === 'end') {

// Alles volgt de gekozen norm: de hoogte is de norm (Gem./P95/µ+2σ/Max) van
// het totaal; de verdeling over de stromen volgt hun aandeel in de bezetting.
// (Normen als P95 zijn niet optelbaar; zo blijft de stapel gelijk aan de norm.)
function splitByMetric(days, slots, ncomp) {
  const tot = stats(collect(days, slots));
  if (!tot) return { tot: null, val: null, parts: Array(ncomp).fill(null) };
  const means = Array.from({ length: ncomp }, (_, ci) => mean(collect(days, slots, ci)));
  const sum = means.reduce((a, b) => a + b, 0);
  const val = mv(tot);
  return { tot, val, parts: means.map(m => (sum > 0 ? val * m / sum : val / ncomp)) };
}
const HOUR_SLOTS = Array.from({ length: 24 }, (_, h) => [[0, h * 4], [0, h * 4 + 1], [0, h * 4 + 2], [0, h * 4 + 3]]);
// 21 cellen (7 dagen × D/A/N) voor de typische week.
function weekCells(frame) {
  const cells = [];
  for (let wd = 0; wd < 7; wd++) {
    const days = frame.days.filter(d => d.wd === wd);
    for (const k of SHIFT_KEYS) {
      const sp = splitByMetric(days, shiftSlots(k), frame.comps.length);
      cells.push({ wd, k, dayLabel: WD_SHORT[wd], title: `${WD_LONG[wd]} · ${SHIFT_INFO[k].label}`, ...sp, lo: sp.tot && sp.tot.p10, hi: sp.tot && sp.tot.max });
    }
  }
  return cells;
}
// Per kwartier van de dag, volgens de norm.
function dayProfile(frame) {
  const parts = frame.comps.map(() => new Array(96));
  const tot = new Array(96), val = new Array(96);
  for (let q = 0; q < 96; q++) {
    const sp = splitByMetric(frame.days, [[0, q]], frame.comps.length);
    sp.parts.forEach((v, ci) => { parts[ci][q] = v; });
    tot[q] = sp.tot; val[q] = sp.val;
  }
  return { parts, tot, val };
}
function monthly(frame) {
  const g = new Map();
  frame.days.forEach(d => { const k = `${d.y}-${pad2(d.m)}`; if (!g.has(k)) g.set(k, []); g.get(k).push(d); });
  return [...g.entries()].map(([k, days]) => {
    const sp = splitByMetric(days, ALL_SLOTS, frame.comps.length);
    // per stroom ook de eigen norm (voor de trendlijnen per stroom)
    const own = frame.comps.map((_, ci) => { const st = stats(collect(days, ALL_SLOTS, ci)); return st ? mv(st) : null; });
    return { k, label: `${MONTH_SHORT[+k.slice(5) - 1]} ${k.slice(2, 4)}`, ...sp, own };

}

/* 1. OVERZICHT: zie overview.js */

function pctAtOrAbove(sorted, x) {
  let lo = 0, hi = sorted.length;
  while (lo < hi) { const m = (lo + hi) >> 1; if (sorted[m] < x) lo = m + 1; else hi = m; }
  return sorted.length ? (sorted.length - lo) / sorted.length * 100 : 0;
}

function insights(frame, cells, beds) {
  const out = [], m = mLabel();
  const mOf = (days, slots, which) => { const st = stats(collect(days, slots, which)); return st ? mv(st) : 0; };
  const over = cells.filter(x => x.val != null && x.val > beds);
  if (over.length) {
    const worst = over.reduce((a, b) => (b.val > a.val ? b : a));
    out.push({ kind: 'crit', text: `In <b>${over.length} van ${cells.length}</b> diensten komt de bezetting (${m}) boven de ${beds} bedden. Het krapst: <b>${worst.title.toLowerCase()}</b> met ${fmt(worst.val)}.` });
  } else out.push({ kind: 'good', text: `Alle diensten blijven op ${m} binnen de <b>${beds} bedden</b>.` });
  if (frame.comps.length > 1) {
    const sums = frame.comps.map((_, ci) => mean(collect(frame.days, ALL_SLOTS, ci)));
    const tot = sums.reduce((a, b) => a + b, 0);
    const top = sums.indexOf(Math.max(...sums));
    out.push({ kind: 'info', text: `<b>${esc(frame.comps[top].label)}</b> levert ${fmt(sums[top] / tot * 100, 0)}% van de bezetting (${m} van die stroom: ${fmt(mOf(frame.days, ALL_SLOTS, top))}).` });
  }
  const wk = mOf(frame.days.filter(d => d.wd < 5), ALL_SLOTS), we = mOf(frame.days.filter(d => d.wd >= 5), ALL_SLOTS);
  if (wk && we) { const d = (we / wk - 1) * 100; out.push({ kind: 'info', text: `In het weekend ligt de bezetting (${m}) <b>${fmt(Math.abs(d), 0)}% ${d < 0 ? 'lager' : 'hoger'}</b> dan doordeweeks: ${fmt(we)} tegen ${fmt(wk)}.` }); }
  const ys = frame.years;
  if (ys.length > 1) {
    const a = mOf(frame.all.filter(d => d.y === ys[0]), ALL_SLOTS), b = mOf(frame.all.filter(d => d.y === ys[ys.length - 1]), ALL_SLOTS);
    const d = a ? (b / a - 1) * 100 : 0;
    out.push({ kind: Math.abs(d) < 3 ? 'good' : d > 0 ? 'warn' : 'info', text: `Van ${ys[0]} naar ${ys[ys.length - 1]} ${Math.abs(d) < 1 ? `bleef de bezetting (${m}) gelijk` : `${d > 0 ? 'steeg' : 'daalde'} de bezetting (${m}) met <b>${fmt(Math.abs(d), 0)}%</b>`} (${fmt(a)} → ${fmt(b)}).` });
  }
  out.push({ kind: 'info', text: `Nachtdienst ${m} <b>${fmt(mOf(frame.days, shiftSlots('N')))}</b> patiënten tegen <b>${fmt(mOf(frame.days, shiftSlots('D')))}</b> in de dagdienst.` });
  return out;
}

// Bandbreedte van één reeks (component-index of 'total') per uur / weekdag / maand.
function bandSeries(frame, which, gran) {
  let groups;
  if (gran === 'hour') groups = Array.from({ length: 24 }, (_, h) => ({ label: `${pad2(h)}:00`, days: frame.days, slots: [[0, h * 4], [0, h * 4 + 1], [0, h * 4 + 2], [0, h * 4 + 3]] }));
  else if (gran === 'weekday') groups = WD_SHORT.map((d, wd) => ({ label: d, days: frame.days.filter(x => x.wd === wd), slots: ALL_SLOTS }));
  else {
    const keys = [...new Set(frame.days.map(d => `${d.y}-${pad2(d.m)}`))];
    groups = keys.map(k => ({ label: `${MONTH_SHORT[+k.slice(5) - 1]} ${k.slice(2, 4)}`, days: frame.days.filter(d => `${d.y}-${pad2(d.m)}` === k), slots: ALL_SLOTS }));
  }
  const st = groups.map(g => stats(collect(g.days, g.slots, which)) || { min: 0, max: 0, p95: 0, avg: 0, mu2s: 0 });
  return { labels: groups.map(g => g.label), min: st.map(x => x.min), max: st.map(x => x.max), p95: st.map(x => x.p95), avg: st.map(x => x.avg), m: st.map(x => mv(x)) };
}
function bandChart(canvas, ser, color, { big = false } = {}) {
  const c = C();
  const smooth = S.bandGran === 'month' ? 0.25 : 0.35;
  return mkChart(canvas, {
    type: 'line',
    data: {
      labels: ser.labels,
      datasets: [
        { label: 'Maximum', data: ser.max, borderColor: alpha(color, 0.55), borderWidth: 1, pointRadius: 0, stepped: S.bandGran === 'month' ? false : 'middle', fill: false },
        { label: 'Minimum', data: ser.min, borderColor: alpha(color, 0.55), borderWidth: 1, pointRadius: 0, stepped: S.bandGran === 'month' ? false : 'middle', fill: { target: 0 }, backgroundColor: alpha(color, 0.14) },
        ...(S.metric === 'avg' ? [] : [{ label: 'Gemiddeld', data: ser.avg, borderColor: color, borderWidth: 1.5, borderDash: [5, 4], pointRadius: 0, tension: smooth, fill: false }]),
        { label: METRICS[S.metric].label, data: ser.m, borderColor: color, borderWidth: 2.5, pointRadius: 0, pointHoverRadius: 4, pointBackgroundColor: color, tension: smooth, fill: false },
      ],
    },
    options: {
      interaction: { mode: 'index', intersect: false },
      layout: { padding: { top: 4 } },
      scales: {
        x: { grid: { display: false }, border: { color: c.axis }, ticks: { maxRotation: 0, autoSkip: true, autoSkipPadding: big ? 14 : 10, font: { size: 10.5 } } },
        y: { beginAtZero: true, grid: { color: c.grid }, border: { display: false }, ticks: { precision: 0, maxTicksLimit: big ? 6 : 4, font: { size: 10.5 } } },
      },
      plugins: { tooltip: { itemSort: (a, b) => b.datasetIndex - a.datasetIndex, callbacks: { label: it => ` ${it.dataset.label}: ${fmt(it.raw, it.datasetIndex >= 2 ? 1 : 0)}` } } },
    },
  });
}

function viewStreams(el, frame) {
  const comps = frame.comps;
  if (!S.focus[S.unit] || !comps.some(c => c.id === S.focus[S.unit])) S.focus[S.unit] = comps[0].id;
  const fi = comps.findIndex(c => c.id === S.focus[S.unit]);
  const per = comps.map((_, ci) => stats(collect(frame.days, ALL_SLOTS, ci)));
  const tot = stats(collect(frame.days, ALL_SLOTS));
  const totAvg = per.reduce((s, p) => s + p.avg, 0) || 1;
  const kindWord = S.unit === 'ALL' ? 'afdeling' : 'stroom';
  const multi = comps.length > 1;
  const gran = S.bandGran;
  const granLbl = { hour: 'per uur van de dag', weekday: 'per weekdag', month: 'per maand' }[gran];
  const nums = st => `<div class="s-card-nums"><div><span>Gemiddeld</span><b>${fmt(st.avg)}</b></div><div><span>${S.metric === 'avg' ? 'P95' : mLabel()}</span><b>${fmt(S.metric === 'avg' ? st.p95 : mv(st))}</b></div><div><span>Min</span><b>${fmt(st.min, 0)}</b></div><div><span>Max</span><b>${fmt(st.max, 0)}</b></div></div>`;
  const tag = c => (S.unit === 'ALL' ? `<span class="tag">${c.streams.length} ${c.streams.length === 1 ? 'stroom' : 'stromen'}</span>` : `<span class="tag ${STORE[c.id].source === 'bestand' ? 'ok' : 'demo'}">${DS[c.id].role === 'basis' ? STORE[c.id].source : DS[c.id].role}</span>`);

  el.innerHTML = `
    <section class="panel band-head stagger">
      <div class="panel-head" style="margin:0">
        <div><h2>Bandbreedte per ${kindWord}</h2><div class="desc">Elke ${kindWord} in een eigen grafiek ${granLbl}: het vlak loopt van minimum tot maximum, de dikke lijn is de gekozen norm (${mLabel()})${S.metric === 'avg' ? '' : ', de stippellijn het gemiddelde'}.${multi ? ` Bovenaan alle ${kindWord === 'stroom' ? 'stromen' : 'afdelingen'} samen als één stroom.` : ''}</div></div>
        <div class="seg small" role="group" aria-label="Indeling" data-ind="bandgran">${[['hour', 'Per uur'], ['weekday', 'Per weekdag'], ['month', 'Per maand']].map(([v, l]) => `<button class="${gran === v ? 'on' : ''}" data-act="bandgran" data-arg="${v}">${l}</button>`).join('')}</div>
      </div>
      <div class="legend" style="margin-top:8px"><span><i class="sw band-sw"></i>Min – max</span><span><i class="ln solid" style="border-color:var(--ink);border-top-width:3px"></i>${METRICS[S.metric].label}</span>${S.metric === 'avg' ? '' : '<span><i class="ln" style="border-color:var(--ink-2)"></i>Gemiddeld</span>'}</div>
    </section>
    <div class="stream-cards">
      ${multi ? `<div class="s-card total stagger">
        <div class="s-card-head"><span class="s-card-name"><i class="sw" style="background:var(--ink)"></i>Alle ${kindWord === 'stroom' ? 'stromen' : 'afdelingen'} samen</span><span class="tag">${comps.length} ${kindWord === 'stroom' ? 'stromen' : 'afdelingen'}</span></div>
        ${nums(tot)}
        <div class="band-box big"><canvas id="band-total" role="img" aria-label="Bandbreedte alle stromen samen"></canvas></div>
      </div>` : ''}
      ${comps.map((c, ci) => `<button class="s-card stagger ${ci === fi ? 'on' : ''}" data-act="focus" data-arg="${c.id}" aria-pressed="${ci === fi}">
        <div class="s-card-head"><span class="s-card-name"><i class="sw" style="background:${cssColor(c)}"></i>${esc(c.label)}</span>${tag(c)}</div>
        ${nums(per[ci])}
        <div class="band-box"><canvas id="band-${ci}" role="img" aria-label="Bandbreedte ${esc(c.label)}"></canvas></div>
        <div class="share"><span>${fmt(per[ci].avg / totAvg * 100, 0)}% van totaal</span><span class="share-bar"><i style="width:${per[ci].avg / totAvg * 100}%;background:${cssColor(c)}"></i></span></div>
      </button>`).join('')}
    </div>
    <div class="grid g-2">
      <section class="panel stagger">
        <div class="panel-head"><div><h2>Weekpatroon · ${esc(comps[fi].label)}</h2><div class="desc">Bezetting (${mLabel()}) per weekdag en uur. Klik een kaart hierboven om een andere ${kindWord} te kiezen.</div></div></div>
        <div class="table-wrap">${heatmapHTML(frame, fi)}</div>
      </section>
      <section class="panel stagger">
        <div class="panel-head">
          <div><h2>Trend per maand</h2><div class="desc">${mLabel()} per maand${S.trendMode !== 'stroom' ? `; de zwarte lijn is alles samen (${mLabel()} van het totaal), het vlak de bandbreedte min–max van het totaal` : ' per stroom'}.</div></div>
          <div class="seg small" role="group" aria-label="Trendweergave" data-ind="trendmode">${[['stroom', 'Per ' + kindWord], ['samen', 'Samen'], ['both', 'Beide']].map(([v, l]) => `<button class="${S.trendMode === v ? 'on' : ''}" data-act="trendmode" data-arg="${v}">${l}</button>`).join('')}</div>
        </div>
        <div class="chart-box"><canvas id="ch-strend" role="img" aria-label="Trend per maand"></canvas></div>
        ${legendHTML(S.trendMode === 'samen' ? [] : comps, S.trendMode === 'stroom' ? '' : `<span><i class="ln solid" style="border-color:var(--ink);border-top-width:3px"></i>Alles samen</span><span><i class="sw band-sw" style="background:color-mix(in srgb, var(--ink) 12%, transparent)"></i>Min–max totaal</span>`)}
      </section>
    </div>
    <section class="panel stagger" style="margin-top:16px">
      <div class="panel-head"><div><h2>Kerncijfers per ${kindWord} en dienst</h2><div class="desc">Aantal gelijktijdig aanwezige patiënten, berekend over alle kwartieren in de selectie.</div></div></div>
      <div class="table-wrap">${streamTable(frame)}</div>
    </section>`;

  if (multi) bandChart($('#band-total'), bandSeries(frame, 'total', gran), C().ink, { big: true });
  comps.forEach((c, ci) => bandChart($('#band-' + ci), bandSeries(frame, ci, gran), colorOf(c)));

  const cc = C();
  const months = monthly(frame);
  const ds = [];
  if (S.trendMode !== 'samen') comps.forEach((c, ci) => ds.push({ label: c.label, data: months.map(m => m.own[ci]), borderColor: colorOf(c), backgroundColor: colorOf(c), borderWidth: S.trendMode === 'both' ? 1.5 : 2, pointRadius: 0, pointHoverRadius: 4, tension: 0.25, fill: false }));
  if (S.trendMode !== 'stroom') {
    ds.push({ label: 'Max totaal', data: months.map(m => m.tot.max), borderWidth: 0, pointRadius: 0, fill: false, tension: 0.25 });
    ds.push({ label: 'Min totaal', data: months.map(m => m.tot.min), borderWidth: 0, pointRadius: 0, fill: { target: '-1' }, backgroundColor: alpha(cc.ink, 0.08), tension: 0.25 });
    ds.push({ label: `Alles samen (${mLabel()})`, data: months.map(m => m.val), borderColor: cc.ink, backgroundColor: cc.ink, borderWidth: 3, pointRadius: 0, pointHoverRadius: 4, tension: 0.25, fill: false });
  }
  mkChart($('#ch-strend'), {
    type: 'line',
    data: { labels: months.map(m => m.label), datasets: ds },
    options: {
      interaction: { mode: 'index', intersect: false },
      scales: { x: { grid: { display: false }, border: { color: cc.axis }, ticks: { maxRotation: 0, autoSkipPadding: 10 } }, y: { beginAtZero: true, grid: { color: cc.grid }, border: { display: false } } },
      plugins: { tooltip: { callbacks: { label: it => ` ${it.dataset.label}: ${fmt(it.raw)}` } } },
    },
  });
}

// Waarde per weekdag × uur volgens de norm. 'sum' = aankomsten per uur (instroom).
function heatVal(days, h, ci, agg) {
  if (agg === 'sum') {
    const vals = days.map(d => d.parts[ci][h * 4] + d.parts[ci][h * 4 + 1] + d.parts[ci][h * 4 + 2] + d.parts[ci][h * 4 + 3]);
    const st = stats(vals); return st ? mv(st) : 0;
  }
  const st = stats(collect(days, HOUR_SLOTS[h], ci)); return st ? mv(st) : 0;
}
function heatmapHTML(frame, ci, agg = 'mean', unitLbl = 'patiënten') {
  const grid = [];
  let max = 0;
  for (let wd = 0; wd < 7; wd++) {
    const days = frame.days.filter(d => d.wd === wd);
    const row = [];
    for (let h = 0; h < 24; h++) { const v = heatVal(days, h, ci, agg); row.push(v); if (v > max) max = v; }
    grid.push(row);
  }
  const steps = 8;
  const cls = v => Math.min(steps - 1, Math.floor((v / (max || 1)) * steps));
  return `<div class="heat" role="table" aria-label="Weekpatroon">
    <div></div>${Array.from({ length: 24 }, (_, h) => `<div class="hh">${h % 3 === 0 ? pad2(h) : ''}</div>`).join('')}
    ${grid.map((row, wd) => `<div class="hl">${WD_SHORT[wd]}</div>${row.map((v, h) => { const s = cls(v); return `<div class="c" style="background:var(--seq-${s});color:${s >= 5 ? 'var(--surface)' : 'var(--ink-2)'}" title="${WD_LONG[wd]} ${pad2(h)}:00–${pad2(h + 1)}:00 · ${mLabel()} ${fmt(v)} ${unitLbl}">${v >= 10 ? Math.round(v) : fmt(v, 1)}</div>`; }).join('')}`).join('')}
  </div>
  <div class="heat-scale"><span>0</span><span class="ramp">${Array.from({ length: steps }, (_, i) => `<i style="background:var(--seq-${i})"></i>`).join('')}</span><span>${fmt(max)} ${unitLbl} (${mLabel()})</span></div>`;
}

function streamTable(frame) {
  const rowsFor = (which, name, sw, cls = '') => {
    const cells = ['all', ...SHIFT_KEYS].map(k => stats(collect(frame.days, k === 'all' ? ALL_SLOTS : shiftSlots(k), which)));
    return cells.map((s, i) => `<tr class="${i ? 'sub' : cls}">
      <td>${i ? `<span style="padding-left:18px">${SHIFT_INFO[SHIFT_KEYS[i - 1]].label} <span class="mono" style="color:var(--muted);font-size:11.5px">${shiftTimes(SHIFT_KEYS[i - 1])}</span></span>` : `<span class="cell-name">${sw ? `<i class="sw" style="background:${sw}"></i>` : ''}${esc(name)}</span>`}</td>
      <td class="num">${fmt(s.avg)}</td><td class="num">${fmt(s.p50, 0)}</td><td class="num">${fmt(s.p95, 0)}</td><td class="num">${fmt(s.mu2s)}</td><td class="num">${fmt(s.max, 0)}</td>
    </tr>`).join('');
  };
  return `<table class="data" data-name="Stromen"><thead><tr><th>${S.unit === 'ALL' ? 'Afdeling' : 'Stroom'} / dienst</th><th class="num">Gemiddeld</th><th class="num">Mediaan</th><th class="num">P95</th><th class="num">µ+2σ</th><th class="num">Max</th></tr></thead>
    <tbody>${frame.comps.map((c, ci) => rowsFor(ci, c.label, cssColor(c))).join('')}${frame.comps.length > 1 ? rowsFor('total', 'Totaal', null, 'total') : ''}</tbody></table>`;
}

/* ═════════════ 3. BEDDEN ═════════════ */
function viewBeds(el, frame) {
  const beds = bedsOf(S.unit);
  const all = stats(collect(frame.days, ALL_SLOTS));
  const full = pctAtOrAbove(all.sorted, beds);
  const overflow = pctAtOrAbove(all.sorted, beds + 1);
  let free = 0; for (const v of all.sorted) free += Math.max(0, beds - v); free /= all.n;
  const target = S.bedTarget / 100;
  const advise = Math.ceil(all.sorted[Math.max(0, Math.ceil(all.n * target) - 1)]);
  const isAll = S.unit === 'ALL';
  const maxV = Math.ceil(all.max);
  const hist = new Array(maxV + 1).fill(0);
  all.sorted.forEach(v => { hist[Math.min(maxV, Math.max(0, Math.round(v)))]++; });

  el.innerHTML = `
    <div class="grid g-3-1" style="margin-bottom:16px">
      <section class="panel stagger">
        <div class="panel-head"><div><h2>Beddencapaciteit</h2><div class="desc">${isAll ? 'Som van de bedden van alle afdelingen. Pas de bedden per afdeling aan in hun eigen tabblad.' : 'Stel het aantal open bedden in; alle grafieken en de verpleegkundige inzet rekenen direct mee.'}</div></div></div>
        <div class="settings">
          <div class="set"><label for="in-beds">Open bedden</label>${isAll ? `<div class="kpi-val num">${beds}</div>` : `<div class="set-row">${stepper('beds', beds, 'Open bedden')}<input type="range" min="1" max="${Math.max(40, maxV + 5)}" value="${beds}" data-path="beds" data-out="in-beds" aria-label="Open bedden schuif"></div>`}</div>
          <div class="set"><label>Gewenste dekking</label><div class="seg small" role="group" aria-label="Gewenste dekking" data-ind="target">${[90, 95, 99].map(t => `<button class="${S.bedTarget === t ? 'on' : ''}" data-act="target" data-arg="${t}">${t}%</button>`).join('')}</div><span class="hint">Deel van de tijd dat iedereen een bed moet hebben.</span></div>
        </div>
      </section>
      <section class="panel stagger">
        <div class="panel-head"><div><h2>Advies</h2></div></div>
        <div class="kpi-val num"><span data-count="${advise}" data-dec="0" data-count-key="advies">${advise}</span><small>bedden</small></div>
        <div class="kpi-sub" style="margin:4px 0 8px">nodig om ${S.bedTarget}% van de tijd iedereen op te vangen</div>
        ${advise > beds ? statusPill('crit', `${advise - beds} bedden tekort t.o.v. ${beds}`) : advise === beds ? statusPill('good', 'Precies passend') : statusPill('good', `${beds - advise} bedden ruimte`)}
      </section>
    </div>
    <div class="kpis">
      ${kpi('Tijd volledig bezet', kn(full), '%', `≥ ${beds} patiënten tegelijk`)}
      ${kpi('Tijd boven capaciteit', kn(overflow), '%', `meer patiënten dan bedden`, statusPill(overflow < 1 ? 'good' : overflow < 5 ? 'warn' : 'crit', overflow < 1 ? 'Zelden' : overflow < 5 ? 'Regelmatig' : 'Vaak'))}
      ${kpi('Gemiddeld vrije bedden', kn(free), 'bedden', `bij ${beds} open bedden`)}
      ${kpi('Gemiddelde benutting', kn(all.avg / beds * 100, 0), '%', `gem. ${fmt(all.avg)} van ${beds} bedden`)}
    </div>
    <div class="grid g-2">
      <section class="panel stagger">
        <div class="panel-head"><div><h2>Hoe vaak liggen er N patiënten?</h2><div class="desc">Aandeel van alle kwartieren per aantal gelijktijdige patiënten. Rood = meer patiënten dan open bedden.</div></div></div>
        <div class="chart-box"><canvas id="ch-hist" role="img" aria-label="Verdeling van de bezetting"></canvas></div>
        <div class="legend"><span><i class="sw" style="background:var(--s1)"></i>Past binnen ${beds} bedden</span><span><i class="sw" style="background:var(--crit)"></i>Boven capaciteit</span></div>
      </section>
      <section class="panel stagger">
        <div class="panel-head"><div><h2>Bedden nodig per uur</h2><div class="desc">Gemiddelde, ${mLabel()} en maximum per uur van de dag, tegen de open bedden.</div></div></div>
        <div class="chart-box"><canvas id="ch-bedhour" role="img" aria-label="Bedden nodig per uur"></canvas></div>
        <div class="legend"><span><i class="ln solid" style="border-color:var(--s1)"></i>Gemiddeld</span><span><i class="ln solid" style="border-color:var(--ink)"></i>${mLabel()}</span><span><i class="ln solid" style="border-color:var(--muted)"></i>Maximum</span><span><i class="ln"></i>Open bedden</span></div>
      </section>
    </div>
    <div class="grid g-2" style="margin-top:16px">
      <section class="panel stagger">
        <div class="panel-head"><div><h2>Kans op een volle afdeling</h2><div class="desc">Percentage van de kwartieren met ≥ ${beds} patiënten, per weekdag en uur.</div></div></div>
        <div class="table-wrap">${fullHeatHTML(frame, beds)}</div>
      </section>
      <section class="panel stagger">
        <div class="panel-head"><div><h2>Bedden per weekdag</h2><div class="desc">Advies = bedden die nodig zijn voor ${S.bedTarget}% dekking op die dag.</div></div></div>
        <div class="table-wrap">${bedTable(frame, beds)}</div>
      </section>
    </div>`;

  const c = C();
  mkChart($('#ch-hist'), {
    type: 'bar',
    data: { labels: hist.map((_, i) => i), datasets: [{ data: hist.map(n => n / all.n * 100), backgroundColor: hist.map((_, i) => (i > beds ? c.crit : c.series[0])), barPercentage: 0.86, categoryPercentage: 0.92 }] },
    options: {
      scales: { x: { grid: { display: false }, border: { color: c.axis }, title: { display: true, text: 'Aantal patiënten tegelijk', color: c.muted, font: { size: 11 } } }, y: { beginAtZero: true, grid: { color: c.grid }, border: { display: false }, ticks: { callback: v => v + '%' } } },
      plugins: { tooltip: { callbacks: { title: it => `${it[0].label} patiënten`, label: it => ` ${fmt(it.raw)}% van de tijd`, footer: it => (+it[0].label > beds ? 'Boven capaciteit' : `${beds - it[0].label} bedden vrij`) } } },
    },
  });
  const hrs = Array.from({ length: 24 }, (_, h) => stats(collect(frame.days, [[0, h * 4], [0, h * 4 + 1], [0, h * 4 + 2], [0, h * 4 + 3]])));
  mkChart($('#ch-bedhour'), {
    type: 'line',
    data: {
      labels: hrs.map((_, h) => `${pad2(h)}:00`),
      datasets: [
        { label: 'Gemiddeld', data: hrs.map(s => s.avg), borderColor: c.series[0], backgroundColor: alpha(c.series[0], 0.12), fill: 'origin', borderWidth: 2, pointRadius: 0, tension: 0.3 },
        { label: mLabel(), data: hrs.map(s => mv(s)), borderColor: c.ink, borderWidth: 2, pointRadius: 0, tension: 0.3 },
        { label: 'Maximum', data: hrs.map(s => s.max), borderColor: c.muted, borderWidth: 1.5, pointRadius: 0, stepped: 'middle' },
      ],
    },
    options: {
      interaction: { mode: 'index', intersect: false },
      scales: { x: { grid: { display: false }, border: { color: c.axis }, ticks: { maxRotation: 0, autoSkip: true, autoSkipPadding: 12 } }, y: { beginAtZero: true, suggestedMax: Math.max(beds, all.max) + 1, grid: { color: c.grid }, border: { display: false }, ticks: { precision: 0 } } },
      plugins: { capLine: { value: beds, label: `${beds} open bedden` }, tooltip: { callbacks: { label: it => ` ${it.dataset.label}: ${fmt(it.raw)}` } } },
    },
  });
}

function fullHeatHTML(frame, beds) {
  const steps = 6;
  return `<div class="heat" role="table" aria-label="Kans op volle afdeling">
    <div></div>${Array.from({ length: 24 }, (_, h) => `<div class="hh">${h % 3 === 0 ? pad2(h) : ''}</div>`).join('')}
    ${WD_SHORT.map((wl, wd) => { const days = frame.days.filter(d => d.wd === wd); return `<div class="hl">${wl}</div>` + Array.from({ length: 24 }, (_, h) => {
      const v = collect(days, [[0, h * 4], [0, h * 4 + 1], [0, h * 4 + 2], [0, h * 4 + 3]]);
      let n = 0; for (const x of v) if (x >= beds) n++;
      const p = v.length ? n / v.length * 100 : 0;
      const s = p === 0 ? 0 : Math.min(steps - 1, 1 + Math.floor(p / 10));
      return `<div class="c" style="background:var(--heat-${s});color:${s >= 4 ? 'var(--surface)' : 'var(--ink-2)'}" title="${WD_LONG[wd]} ${pad2(h)}:00 · ${fmt(p)}% vol">${p >= 0.5 ? Math.round(p) : ''}</div>`;
    }).join(''); }).join('')}
  </div>
  <div class="heat-scale"><span>0%</span><span class="ramp">${Array.from({ length: steps }, (_, i) => `<i style="background:var(--heat-${i})"></i>`).join('')}</span><span>≥ 40% van de tijd vol</span></div>`;
}

function bedTable(frame, beds) {
  const t = S.bedTarget / 100;
  const rows = WD_LONG.map((name, wd) => {
    const s = stats(collect(frame.days.filter(d => d.wd === wd), ALL_SLOTS)); if (!s) return '';
    const adv = Math.ceil(s.sorted[Math.max(0, Math.ceil(s.n * t) - 1)]);
    const full = pctAtOrAbove(s.sorted, beds);
    const d = adv - beds;
    return `<tr><td>${name}</td><td class="num">${fmt(s.avg)}</td><td class="num">${fmt(s.p95, 0)}</td><td class="num">${fmt(s.max, 0)}</td><td class="num">${fmt(full)}%</td><td class="num"><b>${adv}</b> <span class="diff ${d > 0 ? 'pos' : d < 0 ? 'neg' : 'zero'}">${d > 0 ? '+' : ''}${d}</span></td></tr>`;
  }).join('');
  return `<table class="data" data-name="Bedden"><thead><tr><th>Weekdag</th><th class="num">Gemiddeld</th><th class="num">P95</th><th class="num">Max</th><th class="num">Tijd vol</th><th class="num">Advies (${S.bedTarget}%)</th></tr></thead><tbody>${rows}</tbody></table>`;
}
