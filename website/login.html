<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in — We Are Made</title>
  <meta name="description" content="Sign in to your We Are Made course account, or create one.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23faf6eb'/%3E%3Ctext x='16' y='23' text-anchor='middle' font-family='Times New Roman,serif' font-weight='700' font-size='20' fill='%234a0e18'%3EW%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/theme.js"></script>
</head>
<body>

  <div class="cursor" aria-hidden="true"><span class="cursor__label label"></span></div>

  <header class="nav nav--sub">
    <a class="nav__logo" href="index.html" data-hover>We&nbsp;Are&nbsp;Made<sup>®</sup></a>
    <div class="nav__right">
    <button class="themetoggle" data-hover aria-label="Invert colours">
      <span class="themetoggle__pill"><span class="themetoggle__knob"></span></span>
    </button>
    <a class="nav__account label" href="index.html" data-hover data-roll>←&nbsp;Back&nbsp;to&nbsp;site</a>
    </div>
  </header>

  <main class="authpage">
    <div class="authpage__visual" aria-hidden="true">
      <canvas id="authCanvas"></canvas>
      <p class="authpage__quote">Every image starts as a blank prompt.</p>
    </div>

    <div class="authpage__form">
      <h1 class="authpage__title">Welcome<br><em>back.</em></h1>

      <div class="auth-tabs" role="tablist">
        <button class="auth-tab is-active" id="tabSignin" data-hover>Sign in</button>
        <button class="auth-tab" id="tabSignup" data-hover>Create account</button>
      </div>

      <form class="authform" id="formSignin" novalidate>
        <div class="field">
          <label class="label" for="siEmail">Email</label>
          <input id="siEmail" type="email" autocomplete="email" placeholder="you@example.com" required>
        </div>
        <div class="field">
          <label class="label" for="siPassword">Password</label>
          <input id="siPassword" type="password" autocomplete="current-password" placeholder="••••••••" required>
        </div>
        <p class="form-error" id="siError" role="alert"></p>
        <button class="btn btn--solid btn--big" type="submit" data-hover data-magnet>Sign&nbsp;in&nbsp;→</button>
      </form>

      <form class="authform" id="formSignup" hidden novalidate>
        <div class="field">
          <label class="label" for="suName">Name</label>
          <input id="suName" type="text" autocomplete="name" placeholder="Your name" required>
        </div>
        <div class="field">
          <label class="label" for="suEmail">Email</label>
          <input id="suEmail" type="email" autocomplete="email" placeholder="you@example.com" required>
        </div>
        <div class="field">
          <label class="label" for="suPassword">Password</label>
          <input id="suPassword" type="password" autocomplete="new-password" placeholder="At least 6 characters" required>
        </div>
        <div class="field">
          <label class="label" for="suPlan">Package</label>
          <select id="suPlan">
            <option value="starter">Starter — €149</option>
            <option value="pro">Pro — €349</option>
            <option value="studio">Studio — €749</option>
          </select>
        </div>
        <p class="form-error" id="suError" role="alert"></p>
        <button class="btn btn--solid btn--big" type="submit" data-hover data-magnet>Create&nbsp;account&nbsp;→</button>
      </form>

      <p class="authpage__note">
        Demo checkout: creating an account unlocks your chosen package right away.
        Accounts live in this browser only — payments and real accounts arrive with the launch.
      </p>
    </div>
  </main>

  <script src="js/auth.js"></script>
  <script src="js/main.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
