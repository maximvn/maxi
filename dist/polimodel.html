<!doctype html>
<title>PoliRaster Studio</title>

  .boot{min-height:100vh;display:flex;align-items:center;justify-content:center;
    font-family:ui-sans-serif,system-ui,sans-serif;color:#68746E;font-size:13px;letter-spacing:.02em}
</style>
<div id="root"><div class="boot">PoliModel wordt geladen…</div></div>
