<!doctype html>
<!--
  ═══ LOGIN — de inlogpagina van PoliRaster Studio ════════════════════════════
  Wat doet dit onderdeel
    Statische pagina (geen React) met het inlogformulier. login.js stuurt
    POST /api/auth/login en gaat daarna naar ?naar=… of /. Opmaak in login.css.
  Plaats in de tool
    Vrij toegankelijk pad (backend/ACCOUNTS.md §4). De Vercel-middleware en de
    Python-server sturen elke pagina zonder sessie hierheen (302). Vite kopieert
    frontend/public/ ongewijzigd naar dist/.
  Waar kan het misgaan en hoe zie je dat
    - De knop doet niets → login.js laadt niet (CSP: alleen eigen scripts; geen
      inline script in deze pagina). Kijk in de browserconsole.
-->
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Inloggen — PoliRaster Studio</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&amp;display=swap">
<link rel="stylesheet" href="/login.css">
<script src="/login.js" defer></script>
</head>
<body>
<main class="kader">
  <div class="merk" aria-hidden="true">
    <div class="logo">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="4" width="18" height="17" rx="2"></rect>
        <path d="M3 9h18M9 9v12M15 9v12"></path>
      </svg>
    </div>
    <div class="merknaam">PoliRaster <em>Studio</em></div>
  </div>
  <form id="login" class="kaart" novalidate>
    <h1>Inloggen</h1>
    <p class="uitleg">Log in met je eigen gebruikersnaam en wachtwoord. Je gaat verder waar je gebleven was.</p>
    <label for="gebruikersnaam">Gebruikersnaam</label>
    <input id="gebruikersnaam" name="gebruikersnaam" type="text" autocomplete="username"
           autocapitalize="none" autocorrect="off" spellcheck="false" required>
    <label for="wachtwoord">Wachtwoord</label>
    <input id="wachtwoord" name="wachtwoord" type="password" autocomplete="current-password" required>
    <p id="melding" class="melding" role="alert" aria-live="assertive" hidden></p>
    <button id="knop" type="submit">Inloggen</button>
    <noscript><p class="melding">Zet JavaScript aan om in te loggen.</p></noscript>
  </form>
  <p class="voet">Wachtwoord vergeten of geblokkeerd? Vraag de beheerder om een nieuw wachtwoord.</p>
</main>
</body>
</html>
